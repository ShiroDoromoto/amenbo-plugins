desc: 在手機上讀你的任務，資料存在你自己的伺服器上
about: |
  離開電腦時，任務也會送到手機上，用 Amenbo Viewer 就能讀——有哪些任務、每一件現在處於什麼狀態，以及當初為什麼這麼定。

  沒有誰替你代管。伺服器是你自己的：「3. 在 Cloudflare 上建立伺服器」在你自己的 Cloudflare 帳戶裡建立的伺服器和資料庫。任務單向送出，只送動過的那些。

  任務是封好的。「4. 配對手機」不經過網路就能配對手機——相機讀走伺服器的 URL、讀取用的代碼和加密金鑰。「5. 檢視手機是否已配對」說明有沒有手機可讀，「6. 解除配對」把那個代碼收回。

  一旦啟用，送出的是這台電腦上的全部專案——手機是一台裝置，不是一個專案。
config:
  routes:
    label: 送到哪裡
    help: |-
      這個可不可以送到你自己在 Cloudflare 上的伺服器。這裡只能把地方減去：勾起來了，伺服器也得先真的存在才會有東西送到，而建立它的是「3. 在 Cloudflare 上建立伺服器」。一個都不勾也是一種回答，並會被照辦：外掛仍然啟用，但哪裡都不送。
    options:
      cloudflare: 你自己在 Cloudflare 上的伺服器
  worker_url:
    label: 你在 Cloudflare 上的伺服器的 URL
    help: "建立伺服器時由「3. 在 Cloudflare 上建立伺服器」寫入。這裡沒有要輸入的東西。"
  auth_token:
    label: 伺服器接受寫入所用的 API 權杖
    help: "由「3. 在 Cloudflare 上建立伺服器」產生。這裡沒有要輸入的東西。"
  encryption_key:
    label: 加密你的任務所用的金鑰
    help: "由「3. 在 Cloudflare 上建立伺服器」產生。這裡沒有要輸入的東西——手機透過 QR 取得，不經過網路。"
settings:
  actions:
    app:
      label: 1. 把 App 裝到手機上
    token:
      label: 2. 取得 Cloudflare API 權杖
    setup:
      label: 3. 在 Cloudflare 上建立伺服器
      ask:
        api_token: Cloudflare API 權杖
    qr:
      label: 4. 配對手機
    phones:
      label: 5. 檢視手機是否已配對
    revoke:
      label: 6. 解除配對
    repair:
      label: "7. 修復手機上的副本"
