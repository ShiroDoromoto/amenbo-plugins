desc: Melaporkan lewat email apa yang dikerjakan AI Anda
about: |
  Terima lewat email apa yang dikerjakan AI di sebuah proyek selagi Anda tidak di sana.

  Yang dilaporkan hanya tulisan AI: perubahan yang Anda buat sendiri sudah Anda saksikan.
  Peristiwa mana yang layak dikirimkan, Anda sendiri yang memilih, dari sebelas yang
  dikeluarkan amenbo.

  Peristiwa yang beruntun datang sebagai satu pesan, bukan selusin, dan semua pesan dari satu
  proyek berkumpul di utas yang sama. Ke mana perginya adalah setelan proyek itu sendiri, jadi
  dua proyek bisa melapor ke dua kotak surat.

  Server SMTP apa pun yang sudah Anda punya sudah cukup. Tidak ada layanan di tengah, dan
  plugin ini tidak menyimpan alamat apa pun: email keluar lewat akun Anda sendiri.

  Memakai Gmail? Anda perlu sandi aplikasi:
  https://github.com/ShiroDoromoto/amenbo-plugin-mail#gmail
config:
  smtp_host:
    label: Server SMTP
    help: |-
      Server tempat pesan diserahkan. Penyedia Anda mencantumkannya, biasanya di bawah "SMTP" atau "outgoing mail".
  smtp_port:
    label: Port
    help: |-
      587 adalah port pengiriman yang didengarkan hampir semua penyedia. Ubah hanya jika penyedia Anda menyebut yang lain.
  smtp_user:
    label: Akun
    help: |-
      Akun untuk otentikasi, ditulis lengkap — seluruh alamatnya, bukan bagian sebelum @. Kosongkan bersama kata sandinya untuk relay yang tidak meminta keduanya.
  smtp_password:
    label: Kata sandi
    help: |-
      Kata sandi yang boleh dipakai sebuah program pada akun itu, yang tidak selalu sama dengan kata sandi masuk Anda. Gmail menolak kata sandinya sendiri: nyalakan Verifikasi 2 Langkah, buat sandi aplikasi, lalu masukkan enam belas karakternya tanpa spasi — jarak yang tampil di layar bukan bagian darinya.
  from:
    label: Pengirim
    help: |-
      Alamat pengirim pesan. Bila dikosongkan, yang dipakai adalah akun, dan itulah yang diterima penyedia — kebanyakan menolak pesan yang mengaku dari orang lain. Tanpa akun tidak ada yang bisa dijadikan cadangan, jadi isilah.
  to:
    label: Penerima
    help: |-
      Ke mana pesan dikirim. Bila dikosongkan, pesan menuju akun, dan tanpa akun kolom ini harus diisi. Beberapa alamat ditulis dalam satu baris, dipisahkan koma.
  events:
    label: Apa yang dilaporkan
    help: |-
      Semua yang dipicu amenbo dan bisa dilaporkan plugin ini. Apa pun yang Anda centang, yang dilaporkan hanyalah tulisan AI Anda — yang Anda kerjakan sendiri, Anda sudah ada di sana. Tidak mencentang apa pun juga sebuah jawaban: plugin tetap menyala dan tidak melaporkan apa-apa.
    options:
      task.created: Tugas dibuat
      task.status_changed: Status tugas berubah
      task.done: Tugas selesai
      task.rejected: Tugas dibatalkan
      task.assigned: Penanggung jawab tugas berubah
      task.moved: Tugas pindah ke proyek lain
      task.deleted: Tugas dihapus
      decision.accepted: Keputusan diterima
      decision.rejected: Keputusan ditolak
      comment.added: Komentar ditambahkan
      comment.removed: Komentar ditarik
