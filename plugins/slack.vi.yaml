desc: Báo lên kênh Slack những gì AI của bạn đã làm
about: |
  Mỗi việc AI của bạn hoàn thành, mỗi việc nó quyết định không làm, mỗi quyết định nó chấp nhận: dòng tin đến một kênh Slack. Những gì đã diễn ra khi bạn rời khỏi dự án, đọc ngay ở nơi bạn vẫn theo dõi.

  - **Chỉ những gì AI ghi mới được đăng.** Việc bạn tự làm thì bạn đã ở đó rồi; kênh giữ lại phần việc chạy khi không có bạn.
  - **Kênh chính là thiết lập.** `webhook_url` thuộc về dự án nơi nó được ghi, nên giá trị đó *chính là* kênh mà dự án ấy báo về. Hai dự án với hai webhook báo về hai kênh; mỗi tin nhắn đều nêu tên dự án của nó, nên gộp cả hai vào một kênh vẫn đọc được.
  - **Báo những gì, bạn chọn.** Mười một mục để tick, từ một việc được tạo đến một bình luận bị thu hồi. Mặc định là bốn: việc được tạo, đổi trạng thái, hoàn thành, hoặc bị bỏ.

  Slack chỉ cần đưa ra một URL Incoming Webhook, và nó được giữ như một thiết lập bí mật — nó không rời amenbo qua bản xuất, nhật ký hay lần đọc lại nào. Tin nhắn được viết bằng ngôn ngữ bạn đang đọc amenbo, và gọi AI bằng cái tên bạn đã đặt.
config:
  webhook_url:
    label: URL webhook của Slack
  events:
    label: Báo những gì
    options:
      task.created: Một việc được tạo
      task.status_changed: Trạng thái của một việc thay đổi
      task.done: Một việc hoàn thành
      task.rejected: Quyết định không làm một việc
      task.assigned: Một việc được giao
      task.moved: Một việc chuyển sang dự án khác
      task.deleted: Một việc bị xoá
      decision.accepted: Một quyết định được chấp nhận
      decision.rejected: Một quyết định bị bác
      comment.added: Một bình luận được thêm
      comment.removed: Một bình luận bị rút lại
