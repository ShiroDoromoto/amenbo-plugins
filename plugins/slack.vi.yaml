desc: Báo lên kênh Slack những gì AI của bạn đã làm
about: |
  Mỗi việc AI của bạn hoàn thành, mỗi việc nó quyết định không làm, mỗi quyết định nó chấp nhận, mỗi việc đã đến ngày hạn: dòng tin đến một kênh Slack. Những gì đã diễn ra khi bạn rời khỏi dự án, đọc ngay ở nơi bạn vẫn theo dõi.

  - **Chỉ những gì AI ghi mới được đăng — và những ngày không ai ghi.** Việc bạn tự làm thì bạn đã ở đó rồi; kênh giữ lại phần việc chạy khi không có bạn. Hạn đến không phải do ai ghi, và nó đến lúc không ai nhìn, nên cũng được báo.
  - **Kênh chính là thiết lập.** `webhook_url` thuộc về dự án nơi nó được ghi, nên giá trị đó *chính là* kênh mà dự án ấy báo về. Hai dự án với hai webhook báo về hai kênh; mỗi tin nhắn đều nêu tên dự án của nó, nên gộp cả hai vào một kênh vẫn đọc được.
  - **Báo những gì, bạn chọn.** Mười ba mục để tick, từ một việc được tạo đến một hạn chót đến ngày. Mặc định là sáu: việc được tạo, đổi trạng thái, hoàn thành, bị bỏ, đến hạn, hoặc còn một ngày.

  Slack chỉ cần đưa ra một URL Incoming Webhook, và nó được giữ như một thiết lập bí mật — nó không rời Amenbo qua bản xuất, nhật ký hay lần đọc lại nào. Tin nhắn được viết bằng ngôn ngữ bạn đang đọc Amenbo, và gọi AI bằng cái tên bạn đã đặt.
config:
  webhook_url:
    label: URL webhook của Slack
    help: |-
      URL này do Slack tạo, không phải Amenbo, và chính nó là kênh: một webhook lấy nhầm kênh sẽ báo vào phòng khác dù mọi thứ còn lại đều đúng.
      Tại api.slack.com/apps, tạo một app trong workspace cần biết về dự án này, bật Incoming Webhooks, thêm một cái cho kênh muốn gửi, rồi sao chép URL nhận được.
      Nó được giữ như một thiết lập bí mật — không rời Amenbo qua bản xuất, nhật ký hay lần đọc lại nào.
  events:
    label: Báo những gì
    help: |-
      Không tick mục nào cũng là một câu trả lời và được tôn trọng: plugin vẫn bật và không báo gì. Xoá trống sẽ đưa sáu mục mặc định trở lại.
    options:
      task.created: Một việc được tạo
      task.status_changed: Trạng thái của một việc thay đổi
      task.done: Một việc hoàn thành
      task.rejected: Quyết định không làm một việc
      task.assigned: Một việc được giao
      task.moved: Một việc chuyển sang dự án khác
      task.deleted: Một việc bị xoá
      decision.accepted: Một quyết định được chấp nhận
      decision.rejected: Một quyết định bị bác
      comment.added: Một bình luận được thêm
      comment.removed: Một bình luận bị rút lại
      task.due: Một việc đến hạn hôm nay, hoặc đã quá hạn
      task.due_tomorrow: Một việc đến hạn vào ngày mai
