desc: Informa por correo de lo que hizo tu IA
config:
  smtp_host:
    label: "Servidor SMTP (Gmail: smtp.gmail.com)"
  smtp_port:
    label: Puerto
  smtp_user:
    label: "Cuenta (Gmail: tu dirección)"
  smtp_password:
    label: "Contraseña (Gmail: una contraseña de aplicación)"
  from:
    label: Remitente (si se deja vacío, la cuenta)
  to:
    label: Destinatario (si se deja vacío, la cuenta; varios separados por comas)
  events:
    label: Qué informar
    options:
      task.created: Se creó una tarea
      task.status_changed: Cambió el estado de una tarea
      task.done: Se terminó una tarea
      task.rejected: Se descartó una tarea
      task.assigned: Se reasignó una tarea
      task.moved: Una tarea pasó a otro proyecto
      task.deleted: Se eliminó una tarea
      decision.accepted: Se aceptó una decisión
      decision.rejected: Se rechazó una decisión
      comment.added: Se añadió un comentario
      comment.removed: Se retiró un comentario
