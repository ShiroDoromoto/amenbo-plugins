desc: Isola cada tarefa em seu próprio git worktree
about: |
  Cada tarefa ganha um checkout só dela: `start` corta para ela um git worktree no branch novo `task/<id>`, e `finish` retira os dois assim que o trabalho é mesclado.

  ```
  <repo>/../<repo-name>-worktrees/<id>/    no branch task/<id>
  ```

  O checkout fica **fora** do repositório, então é um ambiente de desenvolvimento puro: nada nele está preso ao amenbo, e nada dele se confunde com parte do projeto. Assim várias sessões correm ao mesmo tempo sem colidir: uma tarefa, um checkout, um branch.

  ```sh
  eval "$(amenbo plugin run worktree start 123)"   # iex (…) no PowerShell
  # …trabalhar, commitar, mesclar…
  amenbo plugin run worktree finish 123
  ```

  `start` devolve essa mesma linha `cd`, de modo que o shell em que você está é o que entra no worktree. `finish` roda a partir do repositório principal e recusa enquanto o checkout estiver sujo ou o branch guardar commits que a base não tem; `--force` passa por cima dos dois. Sem `--base`, ambos respondem com o branch em que o repositório está, então não há nada a preencher antes.

  Reservar uma tarefa faz o plugin escrever uma sugestão no stderr, e nada além disso: se *esta* tarefa quer um checkout próprio é um juízo, e ele fica com quem lê a sugestão. O backlog também fica com o amenbo — este plugin lê uma tarefa para ver onde ela é trabalhada, e não escreve nada além de git.

  Precisa de git 2.31 ou mais novo.
