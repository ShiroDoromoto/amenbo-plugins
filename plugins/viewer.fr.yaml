desc: Lisez vos tâches sur votre téléphone, depuis un serveur qui vous appartient
about: |
  Vos tâches arrivent sur votre téléphone et l'app Amenbo Viewer les y lit — les tâches, l'état de chacune et les décisions qui les motivent — pendant que vous êtes loin de l'ordinateur.

  Rien n'est hébergé pour vous. Le serveur est le vôtre : un serveur et sa base de données que « 3. Créer le serveur sur Cloudflare » crée dans votre propre compte Cloudflare. Les tâches circulent dans un seul sens, et seulement à mesure qu'elles bougent.

  Elles circulent scellées. « 4. Associer un téléphone » associe un téléphone hors réseau — l'appareil photo lit l'URL du serveur, le code de lecture et la clé de chiffrement. « 5. Voir si un téléphone est associé » dit si l'un d'eux peut lire, et « 6. Annuler l'association » retire ce code.

  L'activer emporte tous les projets de cette machine : un téléphone est un appareil, pas un projet.
config:
  routes:
    label: Où acheminer
    help: |-
      Si ceci peut acheminer vers votre propre serveur sur Cloudflare. On ne peut ici que retirer l'endroit : le cocher n'y suffit pas, le serveur doit exister avant que quoi que ce soit y arrive, et c'est « 3. Créer le serveur sur Cloudflare » qui le crée. Ne rien cocher est aussi une réponse, et elle est respectée : le plugin reste activé et n'achemine nulle part.
    options:
      cloudflare: Votre propre serveur sur Cloudflare
  worker_url:
    label: URL de votre serveur sur Cloudflare
    help: "« 3. Créer le serveur sur Cloudflare » le renseigne à la création du serveur. Vous n'avez rien à saisir."
  auth_token:
    label: Jeton d'API avec lequel le serveur accepte les écritures
    help: "« 3. Créer le serveur sur Cloudflare » le génère. Vous n'avez rien à saisir."
  encryption_key:
    label: Clé avec laquelle vos tâches sont chiffrées
    help: "« 3. Créer le serveur sur Cloudflare » la génère. Vous n'avez rien à saisir — le téléphone la reçoit par le QR, jamais par le réseau."
settings:
  actions:
    app:
      label: 1. Installer l'app sur le téléphone
    token:
      label: 2. Obtenir un jeton d'API Cloudflare
    setup:
      label: 3. Créer le serveur sur Cloudflare
      ask:
        api_token: Jeton d'API Cloudflare
    qr:
      label: 4. Associer un téléphone
    phones:
      label: 5. Voir si un téléphone est associé
    revoke:
      label: 6. Annuler l'association
    repair:
      label: "7. Réparer la copie du téléphone"
