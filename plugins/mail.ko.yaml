desc: AI가 한 일을 메일로 알립니다
about: |
  자리를 비운 사이에 AI가 프로젝트에서 무엇을 했는지 메일로 받아 봅니다.

  알리는 것은 AI가 쓴 것뿐입니다. 직접 한 변경은 그 자리에 있었던 일이니 보내지 않습니다. 어떤 이벤트를
  메일로 받을지는 amenbo가 내보내는 11가지 중에서 고르면 됩니다.

  한꺼번에 일어난 이벤트는 여러 통으로 나뉘지 않고 한 통으로 옵니다. 같은 프로젝트가 보낸 메일은 하나의
  스레드로 모입니다. 받는 곳은 프로젝트마다의 설정이라, 두 프로젝트를 서로 다른 메일함으로 보낼 수 있습니다.

  SMTP 서버는 이미 쓰던 것을 그대로 쓰면 됩니다. 사이에 끼는 서비스가 없고, 플러그인 자체는 주소를
  가지지 않습니다. 메일은 본인 계정에서 나갑니다.

  Gmail을 쓴다면 앱 비밀번호를 발급해야 합니다.
  https://github.com/ShiroDoromoto/amenbo-plugin-mail#gmail
config:
  smtp_host:
    label: SMTP 서버(Gmail은 smtp.gmail.com)
  smtp_port:
    label: 포트
  smtp_user:
    label: 계정(Gmail은 본인 주소)
  smtp_password:
    label: 비밀번호(Gmail은 앱 비밀번호)
  from:
    label: 보내는 사람(비우면 계정 주소)
  to:
    label: 받는 사람(비우면 계정 주소, 여럿은 쉼표로 구분)
  events:
    label: 무엇을 알릴지
    options:
      task.created: 작업이 생성됨
      task.status_changed: 작업 상태가 바뀜
      task.done: 작업이 완료됨
      task.rejected: 작업이 기각됨
      task.assigned: 작업 담당이 바뀜
      task.moved: 작업이 다른 프로젝트로 이동됨
      task.deleted: 작업이 삭제됨
      decision.accepted: 결정이 채택됨
      decision.rejected: 결정이 기각됨
      comment.added: 댓글이 추가됨
      comment.removed: 댓글이 철회됨
