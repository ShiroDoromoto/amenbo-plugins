desc: AI가 한 일을 메일로 알립니다
about: |
  자리를 비운 사이에 AI가 프로젝트에서 무엇을 했는지 메일로 받아 봅니다.

  알리는 것은 AI가 쓴 것뿐입니다. 직접 한 변경은 그 자리에 있었던 일이니 보내지 않습니다. 어떤 이벤트를
  메일로 받을지는 amenbo가 내보내는 11가지 중에서 고르면 됩니다.

  한꺼번에 일어난 이벤트는 여러 통으로 나뉘지 않고 한 통으로 옵니다. 같은 프로젝트가 보낸 메일은 하나의
  스레드로 모입니다. 받는 곳은 프로젝트마다의 설정이라, 두 프로젝트를 서로 다른 메일함으로 보낼 수 있습니다.

  SMTP 서버는 이미 쓰던 것을 그대로 쓰면 됩니다. 사이에 끼는 서비스가 없고, 플러그인 자체는 주소를
  가지지 않습니다. 메일은 본인 계정에서 나갑니다.

  Gmail을 쓴다면 앱 비밀번호를 발급해야 합니다.
  https://github.com/ShiroDoromoto/amenbo-plugin-mail#gmail
config:
  smtp_host:
    label: SMTP 서버
    help: |-
      메일을 건네줄 서버입니다. 사용하는 업체가 "SMTP" 또는 "보내는 메일 서버"라는 이름으로 안내합니다.
  smtp_port:
    label: 포트
    help: |-
      587은 거의 모든 업체가 열어 두는 발송용 포트입니다. 다른 번호를 안내받은 경우에만 바꾸세요.
  smtp_user:
    label: 계정
    help: |-
      인증에 쓸 계정을 줄이지 말고 전부 적습니다. @ 앞부분이 아니라 주소 전체입니다. 인증을 요구하지 않는 릴레이라면 비밀번호와 함께 비워 두세요.
  smtp_password:
    label: 비밀번호
    help: |-
      그 계정이 프로그램에 허용하는 비밀번호로, 로그인에 쓰는 것과 같지 않을 수 있습니다. Gmail은 본인 비밀번호를 받지 않습니다. 2단계 인증을 켜고 앱 비밀번호를 만든 뒤, 열여섯 글자를 띄어쓰기 없이 입력하세요. 화면에 보이는 공백은 포함되지 않습니다.
  from:
    label: 보내는 사람
    help: |-
      메일을 보내는 주소입니다. 비워 두면 계정 주소가 되고, 업체가 받아 주는 것도 그쪽입니다. 다른 사람을 사칭한 메일은 대부분 거부됩니다. 계정이 없으면 대신할 것이 없으니 그때는 채워 넣으세요.
  to:
    label: 받는 사람
    help: |-
      메일이 가는 곳입니다. 비워 두면 계정 주소로 가고, 계정이 없으면 반드시 채워야 합니다. 여러 주소는 한 줄에 쉼표로 구분해 적습니다.
  events:
    label: 무엇을 알릴지
    help: |-
      amenbo가 내보내는 것 중 이 플러그인이 알릴 수 있는 전부입니다. 무엇을 고르든 알리는 것은 AI가 쓴 것뿐이며, 직접 한 일은 그 자리에 있었던 일입니다. 하나도 고르지 않는 것도 답입니다. 플러그인은 켜진 채로 아무것도 알리지 않습니다.
    options:
      task.created: 작업이 생성됨
      task.status_changed: 작업 상태가 바뀜
      task.done: 작업이 완료됨
      task.rejected: 작업이 기각됨
      task.assigned: 작업 담당이 바뀜
      task.moved: 작업이 다른 프로젝트로 이동됨
      task.deleted: 작업이 삭제됨
      decision.accepted: 결정이 채택됨
      decision.rejected: 결정이 기각됨
      comment.added: 댓글이 추가됨
      comment.removed: 댓글이 철회됨
