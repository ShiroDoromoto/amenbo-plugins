desc: Zgłasza e-mailem, co zrobiła twoja AI
about: |
  Dostajesz e-mailem to, co twoja AI zrobiła w projekcie, gdy cię przy nim nie było.

  Zgłaszane jest tylko to, co zapisała AI: własna zmiana dzieje się na twoich oczach. Które
  zdarzenia są warte e-maila, wybierasz ty — z jedenastu, które wysyła Amenbo.

  Seria zdarzeń przychodzi jako jedna wiadomość, a nie kilkanaście, a wszystkie wiadomości
  jednego projektu trafiają do tego samego wątku. Dokąd idą, to ustawienie samego projektu,
  więc dwa projekty mogą zgłaszać do dwóch skrzynek.

  Wystarczy dowolny serwer SMTP, który już masz. Po drodze nie ma żadnej usługi, a sama
  wtyczka nie przechowuje żadnego adresu: poczta wychodzi z twojego konta.

  Używasz Gmaila? Będzie potrzebne hasło do aplikacji:
  https://github.com/ShiroDoromoto/amenbo-plugin-mail#gmail
config:
  smtp_host:
    label: Serwer SMTP
    help: |-
      Serwer, któremu wiadomość zostaje przekazana. Twój dostawca go podaje, zwykle pod "SMTP" lub "poczta wychodząca".
  smtp_port:
    label: Port
    help: |-
      587 to port wysyłki, na którym nasłuchuje niemal każdy dostawca. Zmień go tylko wtedy, gdy twój wskazuje inny.
  smtp_user:
    label: Konto
    help: |-
      Konto, którym następuje uwierzytelnienie, zapisane w całości — cały adres, nie sam człon przed @. Zostaw je puste razem z hasłem, jeśli przekaźnik nie żąda żadnego z nich.
  smtp_password:
    label: Hasło
    help: |-
      Hasło, które to konto udostępnia programowi, nie zawsze to samo, którym się logujesz. Gmail odrzuca własne: włącz weryfikację dwuetapową, utwórz hasło do aplikacji i wpisz jego szesnaście znaków bez przerw — odstępy widoczne na ekranie nie są jego częścią.
  from:
    label: Nadawca
    help: |-
      Adres, z którego wychodzi wiadomość. Puste pole oznacza konto, i właśnie to dostawca przyjmie — większość odrzuca wiadomość podającą się za kogoś innego. Bez konta nie ma do czego się cofnąć, więc wtedy wypełnij je.
  to:
    label: Odbiorca
    help: |-
      Dokąd trafia wiadomość. Puste pole oznacza konto, a bez konta trzeba je wypełnić. Kilka adresów mieści się w jednym wierszu, rozdzielonych przecinkami.
  events:
    label: Co zgłaszać
    help: |-
      Wszystko, co Amenbo wywołuje, a ta wtyczka potrafi zgłosić. Cokolwiek zaznaczysz, zgłaszane są tylko zapisy twojej SI — przy tym, co zrobiłeś sam, byłeś obecny. Nie zaznaczyć niczego to również odpowiedź: wtyczka pozostaje włączona i nic nie zgłasza.
    options:
      task.created: Utworzono zadanie
      task.status_changed: Zmienił się status zadania
      task.done: Ukończono zadanie
      task.rejected: Odrzucono zadanie
      task.assigned: Zmieniono przypisanie zadania
      task.moved: Zadanie trafiło do innego projektu
      task.deleted: Usunięto zadanie
      decision.accepted: Przyjęto decyzję
      decision.rejected: Odrzucono decyzję
      comment.added: Dodano komentarz
      comment.removed: Wycofano komentarz
