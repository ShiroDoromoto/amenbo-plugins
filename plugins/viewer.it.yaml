desc: Leggi le tue attività sul telefono, da un server che è tuo
about: |
  Le tue attività arrivano sul telefono e l'app Amenbo Viewer le legge lì — le attività, lo stato di ciascuna e le decisioni che ci stanno dietro — mentre sei lontano dal computer.

  Nulla viene ospitato per te. Il server è tuo: un server con il suo database che «3. Crea il server su Cloudflare» crea nel tuo account Cloudflare. Le attività viaggiano in un solo senso, e solo man mano che si muovono.

  Viaggiano sigillate. «4. Abbina un telefono» abbina un telefono fuori dalla rete — la fotocamera legge l'URL del server, il codice di lettura e la chiave di cifratura. «5. Vedi se un telefono è abbinato» dice se uno può leggere, e «6. Annulla l'abbinamento» ritira quel codice.

  Attivarlo porta ogni progetto di questa macchina: un telefono è un dispositivo, non un progetto.
config:
  routes:
    label: Dove portarlo
    help: |-
      Se questo può portare al tuo server su Cloudflare. Qui il luogo si può solo togliere: spuntarlo non basta, il server deve esistere prima che qualcosa ci arrivi, ed è «3. Crea il server su Cloudflare» a crearlo. Non spuntare nulla è anch'essa una risposta e viene rispettata: il plugin resta attivo e non porta da nessuna parte.
    options:
      cloudflare: Il tuo server su Cloudflare
  worker_url:
    label: URL del tuo server su Cloudflare
    help: "«3. Crea il server su Cloudflare» lo inserisce quando crea il server. Non c'è nulla da digitare."
  auth_token:
    label: Token API con cui il server accetta le scritture
    help: "«3. Crea il server su Cloudflare» lo genera. Non c'è nulla da digitare."
  encryption_key:
    label: Chiave con cui le tue attività vengono cifrate
    help: "«3. Crea il server su Cloudflare» la genera. Non c'è nulla da digitare — il telefono la riceve dal QR, mai dalla rete."
settings:
  actions:
    app:
      label: 1. Installa l'app sul telefono
    token:
      label: 2. Ottieni un token API Cloudflare
    setup:
      label: 3. Crea il server su Cloudflare
      ask:
        api_token: Token API di Cloudflare
    qr:
      label: 4. Abbina un telefono
    phones:
      label: 5. Vedi se un telefono è abbinato
    revoke:
      label: 6. Annulla l'abbinamento
    repair:
      label: "7. Riparare la copia del telefono"
