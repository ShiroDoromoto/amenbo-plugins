desc: Informa por e-mail o que a sua IA fez
about: |
  Receba por e-mail o que a sua IA fez em um projeto enquanto você estava longe dele.

  Só é informado o que a IA escreveu: uma mudança feita por você é uma mudança que você
  acompanhou. Quais eventos merecem um e-mail é você quem escolhe, entre os onze que o
  amenbo dispara.

  Uma rajada de eventos chega em uma única mensagem, e não em uma dúzia, e todas as mensagens
  de um projeto ficam na mesma conversa. Para onde elas vão é um ajuste do próprio projeto,
  então dois projetos podem informar a duas caixas de entrada.

  Use qualquer servidor SMTP que você já tenha. Não há serviço nenhum no meio e o plugin não
  guarda endereço algum: o e-mail sai pela sua própria conta.

  Usa o Gmail? Você vai precisar de uma senha de app:
  https://github.com/ShiroDoromoto/amenbo-plugin-mail#gmail
config:
  smtp_host:
    label: "Servidor SMTP (Gmail: smtp.gmail.com)"
  smtp_port:
    label: Porta
  smtp_user:
    label: "Conta (Gmail: seu endereço)"
  smtp_password:
    label: "Senha (Gmail: uma senha de app)"
  from:
    label: Remetente (se ficar vazio, a conta)
  to:
    label: Destinatário (se ficar vazio, a conta; vários separados por vírgula)
  events:
    label: O que informar
    options:
      task.created: Uma tarefa foi criada
      task.status_changed: O estado de uma tarefa mudou
      task.done: Uma tarefa foi concluída
      task.rejected: Uma tarefa foi recusada
      task.assigned: Uma tarefa foi reatribuída
      task.moved: Uma tarefa foi para outro projeto
      task.deleted: Uma tarefa foi excluída
      decision.accepted: Uma decisão foi aceita
      decision.rejected: Uma decisão foi rejeitada
      comment.added: Um comentário foi adicionado
      comment.removed: Um comentário foi retirado
