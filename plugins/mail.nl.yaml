desc: Meldt per e-mail wat je AI heeft gedaan
about: |
  Je krijgt per e-mail wat je AI in een project heeft gedaan terwijl je er niet bij was.

  Alleen wat de AI schrijft wordt gemeld: bij een wijziging van jezelf was je er immers bij.
  Een einddatum die aanbreekt is niemands schrijven, en breekt aan terwijl niemand kijkt, dus
  ook die wordt gemeld. Welke gebeurtenissen een e-mail waard zijn, kies je zelf uit de
  dertien die Amenbo afgeeft.

  Een reeks ervan komt als één bericht binnen in plaats van als een stuk of twaalf, en alle
  berichten van een project belanden in dezelfde thread. Waar ze heen gaan is een instelling
  van het project zelf, dus twee projecten kunnen aan twee mailboxen melden.

  Elke SMTP-server die je al hebt volstaat. Er zit geen dienst tussen en de plug-in bewaart
  zelf geen enkel adres: de mail gaat via je eigen account de deur uit.

  Gebruik je Gmail? Dan heb je een app-wachtwoord nodig:
  https://github.com/ShiroDoromoto/amenbo-plugin-mail#gmail
config:
  smtp_host:
    label: SMTP-server
    help: |-
      De server waaraan het bericht wordt overhandigd. Je provider publiceert hem, meestal onder "SMTP" of "uitgaande mail".
  smtp_port:
    label: Poort
    help: |-
      587 is de verzendpoort waarop vrijwel elke provider luistert. Wijzig hem alleen als die van jou een andere noemt.
  smtp_user:
    label: Account
    help: |-
      Het account waarmee wordt geauthenticeerd, voluit geschreven — het hele adres, niet alleen het deel vóór de @. Laat dit samen met het wachtwoord leeg voor een relay die om geen van beide vraagt.
  smtp_password:
    label: Wachtwoord
    help: |-
      Het wachtwoord dat dit account een programma laat gebruiken, en dat niet altijd het wachtwoord is waarmee je inlogt. Gmail weigert zijn eigen wachtwoord: zet verificatie in twee stappen aan, maak een app-wachtwoord en voer de zestien tekens aaneengesloten in — de spaties die het scherm toont horen er niet bij.
  from:
    label: Afzender
    help: |-
      Het adres waarvandaan het bericht wordt verstuurd. Leeg gelaten is het het account, en dat is wat een provider accepteert — de meeste weigeren een bericht dat beweert van iemand anders te komen. Zonder account is er niets om op terug te vallen, vul het dan in.
  to:
    label: Ontvanger
    help: |-
      Waar het bericht heen gaat. Leeg gelaten gaat het naar het account, en zonder account moet dit ingevuld worden. Meerdere adressen staan op dezelfde regel, gescheiden door komma's.
  events:
    label: Wat er gemeld wordt
    help: |-
      Alles wat Amenbo afvuurt en deze plug-in kan melden. Van het schrijfwerk wordt, wat je hier ook aanvinkt, alleen gemeld wat je AI schrijft — bij wat je zelf deed was je erbij. De laatste twee zijn geen schrijfwerk: Amenbo waarschuwt één keer per dag voor een taak waarvan de einddatum is aangebroken, en voor een taak die morgen aan de beurt is. Niemand schreef ze, dus niets filtert ze weg. Niets aanvinken is ook een antwoord: de plug-in blijft aan en meldt niets.
    options:
      task.created: Een taak is aangemaakt
      task.status_changed: De status van een taak is gewijzigd
      task.done: Een taak is afgerond
      task.rejected: Een taak is vervallen
      task.assigned: Een taak is opnieuw toegewezen
      task.moved: Een taak is naar een ander project verplaatst
      task.deleted: Een taak is verwijderd
      decision.accepted: Een besluit is aangenomen
      decision.rejected: Een besluit is afgewezen
      comment.added: Een reactie is toegevoegd
      comment.removed: Een reactie is ingetrokken
      task.due: Een taak moet vandaag af, of is te laat
      task.due_tomorrow: Een taak moet morgen af
