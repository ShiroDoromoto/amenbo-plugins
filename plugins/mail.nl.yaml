desc: Meldt per e-mail wat je AI heeft gedaan
about: |
  Je krijgt per e-mail wat je AI in een project heeft gedaan terwijl je er niet bij was.

  Alleen wat de AI schrijft wordt gemeld: bij een wijziging van jezelf was je er immers bij.
  Welke gebeurtenissen een e-mail waard zijn, kies je zelf uit de elf die amenbo afgeeft.

  Een reeks ervan komt als één bericht binnen in plaats van als een stuk of twaalf, en alle
  berichten van een project belanden in dezelfde thread. Waar ze heen gaan is een instelling
  van het project zelf, dus twee projecten kunnen aan twee mailboxen melden.

  Elke SMTP-server die je al hebt volstaat. Er zit geen dienst tussen en de plug-in bewaart
  zelf geen enkel adres: de mail gaat via je eigen account de deur uit.

  Gebruik je Gmail? Dan heb je een app-wachtwoord nodig:
  https://github.com/ShiroDoromoto/amenbo-plugin-mail#gmail
config:
  smtp_host:
    label: "SMTP-server (Gmail: smtp.gmail.com)"
  smtp_port:
    label: Poort
  smtp_user:
    label: "Account (Gmail: je eigen adres)"
  smtp_password:
    label: "Wachtwoord (Gmail: een app-wachtwoord)"
  from:
    label: Afzender (leeg is het adres van het account)
  to:
    label: Ontvanger (leeg is het adres van het account; meerdere gescheiden door komma's)
  events:
    label: Wat er gemeld wordt
    options:
      task.created: Een taak is aangemaakt
      task.status_changed: De status van een taak is gewijzigd
      task.done: Een taak is afgerond
      task.rejected: Een taak is vervallen
      task.assigned: Een taak is opnieuw toegewezen
      task.moved: Een taak is naar een ander project verplaatst
      task.deleted: Een taak is verwijderd
      decision.accepted: Een besluit is aangenomen
      decision.rejected: Een besluit is afgewezen
      comment.added: Een reactie is toegevoegd
      comment.removed: Een reactie is ingetrokken
