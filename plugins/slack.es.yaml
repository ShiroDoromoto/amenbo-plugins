desc: Informar en un canal de Slack lo que hizo tu IA
about: |
  Cada tarea que tu IA termina, cada una que decide no hacer, cada decisión que acepta: la línea llega a un canal de Slack. Lo que pasó mientras estabas lejos del proyecto, en la sala que ya miras.

  - **Solo se publica lo que escribe la IA.** Lo que escribiste tú ya lo viviste; en el canal queda el trabajo que ocurrió sin ti.
  - **El canal es el ajuste.** `webhook_url` pertenece al proyecto donde se escribió, así que ese valor *es* el canal al que ese proyecto informa. Dos proyectos con dos webhooks informan a dos canales; cada mensaje dice de qué proyecto viene, así que apuntar ambos al mismo canal también se lee.
  - **Qué eventos, lo eliges tú.** Once para marcar, desde crear una tarea hasta retirar un comentario. Por defecto, los cuatro que dicen que una tarea se creó, cambió de estado, se terminó o se descartó.

  Slack solo tiene que darte una URL de Incoming Webhook, y se guarda como ajuste secreto: no sale de amenbo ni en una exportación, ni en un registro, ni en una lectura de vuelta. Los mensajes se escriben en el idioma en que lees amenbo y llaman a tu IA por el nombre que le pusiste.
config:
  webhook_url:
    label: URL del webhook de Slack
    help: |-
      Esta URL la hace Slack, no amenbo, y esa URL es el canal: un webhook del canal equivocado publica en la sala equivocada sin que nada más esté mal puesto.
      En api.slack.com/apps, crea una app en el espacio de trabajo que deba enterarse de este proyecto, activa Incoming Webhooks, añade uno al canal donde quieras publicar y copia la URL que te devuelve.
      Se guarda como ajuste secreto: no sale de amenbo ni en una exportación, ni en un registro, ni en una lectura de vuelta.
  events:
    label: Qué se informa
    help: |-
      No marcar nada también es una respuesta y se respeta: el plugin sigue activo y no informa de nada. Vaciarlo devuelve los cuatro por defecto.
    options:
      task.created: Se creó una tarea
      task.status_changed: Cambió el estado de una tarea
      task.done: Se terminó una tarea
      task.rejected: Se descartó una tarea
      task.assigned: Se asignó una tarea
      task.moved: Una tarea pasó a otro proyecto
      task.deleted: Se eliminó una tarea
      decision.accepted: Se aceptó una decisión
      decision.rejected: Se rechazó una decisión
      comment.added: Se añadió un comentario
      comment.removed: Se retiró un comentario
