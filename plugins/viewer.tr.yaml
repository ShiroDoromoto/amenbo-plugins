desc: Görev listenizi telefonunuzdan, size ait bir yerden okuyun
about: |
  Bilgisayarınızdan uzaktayken görev listeniz telefonunuza ulaşır ve Amenbo Viewer uygulaması onu orada okur — görevleri, her birinin hangi durumda olduğunu ve arkalarındaki kararları.

  Sizin için hiçbir şey barındırılmaz. Yer sizindir: `setup`'ın kendi Cloudflare hesabınızda ayağa kaldırdığı bir Cloudflare Worker ve veritabanı. Kayıtlar tek yöne, yalnızca değiştikleri kadar gider.

  Mühürlü giderler. `qr` bir telefonu ağa çıkmadan eşleştirir — kamera adresi, belirteci ve anahtarı okur. `phones` hangi telefonların okuyabildiğini söyler, `revoke` ise birini keser.

  Etkinleştirdiğinizde bu makinedeki her projeyi taşır: telefon bir cihazdır, bir proje değil.
config:
  routes:
    label: Nereye taşınsın
    help: |-
      Bunun Cloudflare Worker'ınıza taşıyıp taşıyamayacağı. Buradan yer yalnızca çıkarılabilir: işaretlemek yetmez, bir şey ulaşmadan önce Worker'ın var olması gerekir, onu da setup ayağa kaldırır. Hiçbir şey işaretlememek de bir cevaptır ve öylece kabul edilir: eklenti açık kalır ve hiçbir yere taşımaz.
    options:
      cloudflare: Kendi Cloudflare Worker'ınız
  worker_url:
    label: Kendi Cloudflare Worker'ınızın URL'si
    help: "Worker'ı kurarken setup bunu yazar. Yazmanız gereken bir şey yok."
  auth_token:
    label: Worker'ın yazmaya izin verdiği belirteç
    help: "setup bunu üretir. Yazmanız gereken bir şey yok."
  encryption_key:
    label: Kayıtların şifrelendiği anahtar
    help: "setup bunu üretir. Yazmanız gereken bir şey yok — telefona QR ile geçer, ağ üzerinden asla."
settings:
  actions:
    app:
      label: 1. Uygulamayı telefona kur
    token:
      label: 2. API belirteci al
    setup:
      label: 3. Cloudflare yolunu kur
      ask:
        api_token: Cloudflare API belirteci
    qr:
      label: 4. Telefon eşle
      ask:
        label: Bu telefonun adı
