desc: Görev listenizi telefonunuzdan, size ait bir yerden okuyun
about: |
  Bilgisayarınızdan uzaktayken görev listeniz telefonunuza ulaşır ve Amenbo Viewer uygulaması onu orada okur — görevleri, her birinin hangi durumda olduğunu ve arkalarındaki kararları.

  Sizin için hiçbir şey barındırılmaz. Yer sizindir: Mac'te uygulamaya özel bir iCloud klasörü, değilse `setup`'ın kendi Cloudflare hesabınızda ayağa kaldırdığı bir Cloudflare Worker ve veritabanı. Kayıtlar tek yöne, yalnızca değiştikleri kadar gider.

  Cloudflare yolunda mühürlü giderler. `qr` bir telefonu ağa çıkmadan eşleştirir — kamera adresi, belirteci ve anahtarı okur. `phones` hangi telefonların okuyabildiğini söyler, `revoke` ise birini keser.

  Etkinleştirdiğinizde bu makinedeki her projeyi taşır: telefon bir cihazdır, bir proje değil.
config:
  worker_url:
    label: Kendi Cloudflare Worker'ınızın URL'si
    help: "Worker'ı kurarken setup bunu yazar. Yazmanız gereken bir şey yok."
  auth_token:
    label: Worker'ın yazmaya izin verdiği belirteç
    help: "setup bunu üretir. Yazmanız gereken bir şey yok."
  encryption_key:
    label: Kayıtların şifrelendiği anahtar
    help: "setup bunu üretir. Yazmanız gereken bir şey yok — telefona QR ile geçer, ağ üzerinden asla."
settings:
  actions:
    token:
      label: 1. API belirteci al
    setup:
      label: 2. Cloudflare yolunu kur
      ask:
        api_token: Cloudflare API belirteci
    qr:
      label: 3. Telefon eşle
      ask:
        label: Bu telefonun adı
