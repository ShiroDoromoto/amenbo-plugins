desc: Görevlerinizi telefonunuzdan, size ait bir sunucudan okuyun
about: |
  Bilgisayarınızdan uzaktayken görevleriniz telefonunuza ulaşır ve Amenbo Viewer uygulaması onları orada okur — görevleri, her birinin hangi durumda olduğunu ve arkalarındaki kararları.

  Sizin için hiçbir şey barındırılmaz. Sunucu sizindir: «3. Cloudflare'de sunucu oluştur»un kendi Cloudflare hesabınızda oluşturduğu bir sunucu ve veritabanı. Görevler tek yöne, yalnızca değiştikleri kadar gider.

  Mühürlü giderler. «4. Telefon eşle» bir telefonu ağa çıkmadan eşleştirir — kamera sunucunun URL'sini, okuma kodunu ve şifreleme anahtarını okur. «5. Bir telefon eşleşmiş mi gör» bir telefonun okuyup okuyamadığını söyler, «6. Eşleşmeyi kaldır» ise o kodu geri alır.

  Etkinleştirdiğinizde bu makinedeki her projeyi taşır: telefon bir cihazdır, bir proje değil.
config:
  routes:
    label: Nereye taşınacak
    help: |-
      Bunun Cloudflare'deki kendi sunucunuza taşıyıp taşıyamayacağı. Buradan yer yalnızca çıkarılabilir: işaretlemek yetmez, bir şey ulaşmadan önce sunucunun var olması gerekir, onu da «3. Cloudflare'de sunucu oluştur» oluşturur. Hiçbir şey işaretlememek de bir cevaptır ve öylece kabul edilir: eklenti açık kalır ve hiçbir yere taşımaz.
    options:
      cloudflare: Cloudflare'deki kendi sunucunuz
  worker_url:
    label: Cloudflare'deki sunucunuzun URL'si
    help: "«3. Cloudflare'de sunucu oluştur» sunucuyu oluştururken bunu yazar. Yazmanız gereken bir şey yok."
  auth_token:
    label: Sunucunun yazmaya izin verdiği API belirteci
    help: "«3. Cloudflare'de sunucu oluştur» bunu üretir. Yazmanız gereken bir şey yok."
  encryption_key:
    label: Görevlerinizin şifrelendiği anahtar
    help: "«3. Cloudflare'de sunucu oluştur» bunu üretir. Yazmanız gereken bir şey yok — telefona QR ile geçer, ağ üzerinden asla."
settings:
  actions:
    app:
      label: 1. Uygulamayı telefona kur
    token:
      label: 2. Cloudflare API belirteci al
    setup:
      label: 3. Cloudflare'de sunucu oluştur
      ask:
        api_token: Cloudflare API belirteci
    qr:
      label: 4. Telefon eşle
    phones:
      label: 5. Bir telefon eşleşmiş mi gör
    revoke:
      label: 6. Eşleşmeyi kaldır
    repair:
      label: "7. Telefondaki kopyayı onar"
