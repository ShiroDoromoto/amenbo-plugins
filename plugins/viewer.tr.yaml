desc: Görevlerinizi telefonunuzdan, size ait bir sunucudan okuyun
about: |
  Bilgisayarınızdan uzaktayken görevleriniz telefonunuza ulaşır ve Amenbo Viewer uygulaması onları orada okur — görevleri, her birinin hangi durumda olduğunu ve arkalarındaki kararları.

  Sizin için hiçbir şey barındırılmaz. Sunucu sizindir: “3. Cloudflare'de sunucu oluştur” onu, veritabanıyla birlikte, kendi Cloudflare hesabınızda oluşturur. Değişen ne varsa tek yöne, yalnızca değiştiği kadar gider.

  Mühürlü gider. “4. Telefon eşle” bir telefonu ağa çıkmadan eşler — kamera sunucunun URL'sini, okuma API jetonunu ve şifreleme anahtarını okur. “5. Eşleşen telefonları gör” hangi telefonların okuyabildiğini söyler, “6. Telefon eşleşmesini kaldır” ise birini keser.

  Etkinleştirdiğinizde bu makinedeki her projeyi taşır: telefon bir cihazdır, bir proje değil.
config:
  routes:
    label: Nereye taşınsın
    help: |-
      Bunun Cloudflare'deki sunucunuza taşıyıp taşıyamayacağı. Buradan yer yalnızca çıkarılabilir: işaretlemek yetmez, bir şey ulaşmadan önce sunucunun var olması gerekir, onu da “3. Cloudflare'de sunucu oluştur” oluşturur. Hiçbir şey işaretlememek de bir cevaptır ve öylece kabul edilir: eklenti açık kalır ve hiçbir yere taşımaz.
    options:
      cloudflare: Cloudflare'deki kendi sunucunuz
  worker_url:
    label: Cloudflare'deki sunucunuzun URL'si
    help: |-
      Sunucuyu oluştururken “3. Cloudflare'de sunucu oluştur” bunu yazar. Yazmanız gereken bir şey yok.
  auth_token:
    label: Sunucunun yazmaya izin verdiği API jetonu
    help: |-
      “3. Cloudflare'de sunucu oluştur” bunu üretir. Yazmanız gereken bir şey yok.
  encryption_key:
    label: Görevlerinizin şifrelendiği anahtar
    help: |-
      “3. Cloudflare'de sunucu oluştur” bunu üretir. Yazmanız gereken bir şey yok — telefona QR ile geçer, ağ üzerinden asla.
settings:
  actions:
    app:
      label: 1. Uygulamayı telefona kur
    token:
      label: 2. API belirteci al
    setup:
      label: 3. Cloudflare'de sunucu oluştur
      ask:
        api_token: Cloudflare API belirteci
    qr:
      label: 4. Telefon eşle
      ask:
        label: Bu telefonun adı
    phones:
      label: 5. Eşleşen telefonları gör
    revoke:
      label: 6. Telefon eşleşmesini kaldır
      ask:
        phone: Eşleşmesi kaldırılacak telefonun adı
