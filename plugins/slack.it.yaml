desc: Segnalare in un canale Slack quello che ha fatto la tua IA
about: |
  Ogni attività che la tua IA completa, ogni attività che decide di non fare, ogni decisione che accetta: la riga arriva in un canale Slack. Quello che è successo mentre eri lontano dal progetto, nella stanza che già guardi.

  - **Viene pubblicato solo ciò che scrive l'IA.** Quello che hai scritto tu l'hai vissuto; nel canale resta il lavoro fatto senza di te.
  - **Il canale è l'impostazione.** `webhook_url` appartiene al progetto in cui è stata scritta, quindi quel valore *è* il canale a cui quel progetto riferisce. Due progetti con due webhook riferiscono a due canali; ogni messaggio dice da quale progetto viene, così anche puntarli entrambi su un solo canale si legge.
  - **Quali eventi, lo scegli tu.** Undici da spuntare, dalla creazione di un'attività al ritiro di un commento. Di default i quattro che dicono che un'attività è stata creata, ha cambiato stato, è stata completata o è stata scartata.

  A Slack basta consegnare un solo URL di Incoming Webhook, tenuto come impostazione segreta: non lascia amenbo né in un export, né in un log, né in una rilettura. I messaggi sono scritti nella lingua in cui leggi amenbo e chiamano la tua IA con il nome che le hai dato.
config:
  webhook_url:
    label: URL del webhook di Slack
    help: |-
      Questo URL lo crea Slack, non amenbo, ed è il canale: un webhook fatto per il canale sbagliato pubblica nella stanza sbagliata anche con tutto il resto a posto.
      Su api.slack.com/apps crea un'app nello spazio di lavoro che deve sapere di questo progetto, attiva Incoming Webhooks, aggiungine uno al canale desiderato e copia l'URL restituito.
      È tenuto come impostazione segreta: non lascia amenbo né in un export, né in un log, né in una rilettura.
  events:
    label: Che cosa segnalare
    help: |-
      Non spuntare nulla è anch'essa una risposta e viene rispettata: il plugin resta attivo e non segnala niente. Svuotarlo rimette i quattro predefiniti.
    options:
      task.created: È stata creata un'attività
      task.status_changed: È cambiato lo stato di un'attività
      task.done: Un'attività è stata completata
      task.rejected: Un'attività è stata scartata
      task.assigned: Un'attività è stata assegnata
      task.moved: Un'attività è stata spostata in un altro progetto
      task.deleted: Un'attività è stata eliminata
      decision.accepted: Una decisione è stata accettata
      decision.rejected: Una decisione è stata respinta
      comment.added: È stato aggiunto un commento
      comment.removed: Un commento è stato ritirato
