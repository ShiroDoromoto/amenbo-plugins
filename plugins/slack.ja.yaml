desc: AI がやったことを Slack のチャンネルへ報告する
about: |
  AI がタスクを完了したとき、見送ると決めたとき、決定を採択したときに、その一行が Slack のチャンネルへ届きます。タスクの期日が来たときも同じです。プロジェクトから離れている間に何が進んだかを、いつも見ている場所で読めます。

  - **届くのは AI の書き込みと、期日の到来だけ。** 自分でやった操作はその場に居合わせたものなので、チャンネルに残るのは自分の居ない間に進んだ仕事だけです。期日が来ることは誰の書き込みでもありませんが、誰も見ていない時に来るので、これも報告します。
  - **チャンネルは設定そのもの。** `webhook_url` は書き込んだプロジェクトのものなので、その値がそのプロジェクトの報告先になります。2つのプロジェクトに2本の Webhook を入れれば2つのチャンネルへ。1つにまとめても、各メッセージにプロジェクト名が入ります。
  - **どのできごとを報告するかは選べます。** タスクの作成から期日の到来まで13種類。既定はタスクの作成・ステータス変更・完了・見送りと、期日の到来・前日の6つです。

  Slack 側で要るのは Incoming Webhook の URL が1本だけ。シークレット設定として持つので、エクスポートにもログにも読み返しにも出ません。メッセージは Amenbo を読んでいる言語で書かれ、AI は付けた名前で呼ばれます。
config:
  webhook_url:
    label: Slack の Webhook URL
    help: |-
      これを作るのは Amenbo ではなく Slack で、URL がそのままチャンネルです。宛先を間違えた Webhook は、ほかが全部合っていても別のチャンネルへ届きます。
      このプロジェクトの報告を受けるワークスペースにアプリを作り、Incoming Webhooks を有効にして、報告を受けたいチャンネルへ1本追加し、返ってきた URL をコピーします。
      シークレット設定として持つので、エクスポートにもログにも読み返しにも出ません。
  events:
    label: 何を報告するか
    help: |-
      1つも選ばないという答えも、そのまま通ります——有効なまま、何も報告しません。設定そのものを消すと、既定の6つに戻ります。
    options:
      task.created: タスクが作成された
      task.status_changed: タスクのステータスが変わった
      task.done: タスクが完了した
      task.rejected: タスクを見送ると決めた
      task.assigned: タスクの担当が決まった
      task.moved: タスクが別のプロジェクトへ移った
      task.deleted: タスクが削除された
      decision.accepted: 決定が採択された
      decision.rejected: 決定が却下された
      comment.added: コメントが追加された
      comment.removed: コメントが取り消された
      task.due: タスクの期日が今日、または過ぎている
      task.due_tomorrow: タスクの期日が明日
settings:
  actions:
    config test:
      label: テスト送信
