desc: AI がやったことを Slack のチャンネルへ報告する
about: |
  AI がタスクを完了するたび、見送ると決めるたび、決定を採択するたびに、その一行が Slack のチャンネルへ届きます。プロジェクトから離れている間に何が進んだかを、いつも見ている場所で読めます。

  - **流れるのは AI の書き込みだけ。** 自分でやった操作はその場に居合わせたものなので、チャンネルに残るのは自分の居ない間に進んだ仕事だけです。
  - **チャンネルは設定そのもの。** `webhook_url` は書き込んだプロジェクトのものなので、その値がそのプロジェクトの報告先になります。2つのプロジェクトに2本の Webhook を入れれば2つのチャンネルへ。1つにまとめても、どのプロジェクトの話かは各メッセージが名乗ります。
  - **どのできごとを流すかは選べます。** タスクの作成からコメントの取り消しまで11種類。既定はタスクの作成・状態変更・完了・見送りの4つです。

  Slack 側で要るのは Incoming Webhook の URL が1本だけ。秘密の設定として持つので、エクスポートにもログにも読み返しにも出ません。メッセージは amenbo を読んでいる言語で書かれ、AI は付けた名前で呼ばれます。
config:
  webhook_url:
    label: Slack の Webhook URL
    help: |-
      これを作るのは amenbo ではなく Slack で、URL がそのままチャンネルです。宛先を間違えた Webhook は、ほかが全部合っていても別の部屋へ流れます。
      api.slack.com/apps で、このプロジェクトの報告を受けるワークスペースにアプリを作り、Incoming Webhooks を有効にして、流したいチャンネルへ1本追加し、返ってきた URL をコピーします。
      秘密の設定として持つので、エクスポートにもログにも読み返しにも出ません。
  events:
    label: 何を報告するか
    help: |-
      1つも選ばないことも答えで、そのまま尊重されます——有効なまま何も報告しません。空にすると既定の4つに戻ります。
    options:
      task.created: タスクが作成された
      task.status_changed: タスクの状態が変わった
      task.done: タスクが完了した
      task.rejected: タスクを見送ると決めた
      task.assigned: タスクの担当が決まった
      task.moved: タスクが別のプロジェクトへ移った
      task.deleted: タスクが削除された
      decision.accepted: 決定が承認された
      decision.rejected: 決定が却下された
      comment.added: コメントが追加された
      comment.removed: コメントが取り消された
settings:
  actions:
    config test:
      label: テスト送信
