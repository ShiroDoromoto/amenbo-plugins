desc: 在手机上读你的任务，数据存在你自己的服务器上
about: |
  离开电脑时，任务也会送到手机上，用 Amenbo Viewer 就能读——有哪些任务、每一件现在处于什么状态，以及当初为什么这么定。

  没有谁替你托管。服务器是你自己的：“3. 在 Cloudflare 上创建服务器”会在你自己的 Cloudflare 账户里连同数据库一起建好。动过的那些单向送出，也只送动过的部分。

  送出时是封好的。“4. 配对手机”不经过网络就能配对一台手机——摄像头读走服务器的 URL、读取用的 API 令牌和加密密钥。“5. 查看已配对的手机”列出哪些手机可读，“6. 解除手机配对”单独切断其中一台。

  一旦启用，送出的是这台电脑上的全部项目——手机是一台设备，不是一个项目。
config:
  routes:
    label: 送往哪里
    help: |-
      这个可不可以送到你自己在 Cloudflare 上的服务器。这里只能把地方减去：勾上了，服务器也得先真的存在才会有东西送到，而建起它的是“3. 在 Cloudflare 上创建服务器”。一个都不勾也是一种回答，并会被照办：插件仍然启用，但哪儿都不送。
    options:
      cloudflare: 你自己在 Cloudflare 上的服务器
  worker_url:
    label: 你在 Cloudflare 上的服务器的 URL
    help: |-
      创建服务器时由“3. 在 Cloudflare 上创建服务器”写入。这里没有要输入的东西。
  auth_token:
    label: 服务器放行写入所用的 API 令牌
    help: |-
      由“3. 在 Cloudflare 上创建服务器”生成。这里没有要输入的东西。
  encryption_key:
    label: 加密你的任务所用的密钥
    help: |-
      由“3. 在 Cloudflare 上创建服务器”生成。这里没有要输入的东西——手机通过二维码拿到，不经过网络。
settings:
  actions:
    app:
      label: 1. 把 App 装到手机上
    token:
      label: 2. 获取 API 令牌
    setup:
      label: 3. 在 Cloudflare 上创建服务器
      ask:
        api_token: Cloudflare API 令牌
    qr:
      label: 4. 配对手机
      ask:
        label: 这台手机的名称
    phones:
      label: 5. 查看已配对的手机
    revoke:
      label: 6. 解除手机配对
      ask:
        phone: 要解除配对的手机名称
