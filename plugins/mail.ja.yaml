desc: AI がやったことをメールで報告する
about: |
  離れているあいだに AI がプロジェクトで何をしたかを、メールで受け取れます。

  報告するのは AI が書き込んだぶんだけです。自分で動かした変更は、その場に居合わせたものなので送りません。
  どのイベントをメールにするかは、amenbo が出す11種類から選べます。

  まとめて起きたイベントは、何通にも分かれず1通で届きます。同じプロジェクトからのメールは1つのスレッドに
  まとまります。宛先はプロジェクトごとの設定なので、2つのプロジェクトを別々のメールボックスへ向けられます。

  SMTP サーバーは手持ちのもので構いません。あいだに入るサービスはなく、プラグイン自身はアドレスを持ちません。
  メールは自分のアカウントから出ていきます。

  Gmail をお使いの場合は、アプリパスワードの発行が必要です。
  https://github.com/ShiroDoromoto/amenbo-plugin-mail#gmail
config:
  smtp_host:
    label: SMTP サーバー（Gmail なら smtp.gmail.com）
  smtp_port:
    label: ポート番号
  smtp_user:
    label: アカウント（Gmail なら自分のアドレス）
  smtp_password:
    label: パスワード（Gmail ならアプリパスワード）
  from:
    label: 差出人（未入力ならアカウントのアドレス）
  to:
    label: 宛先（未入力ならアカウントのアドレス・複数はカンマ区切り）
  events:
    label: 何を報告するか
    options:
      task.created: タスクが作成された
      task.status_changed: タスクの状態が変わった
      task.done: タスクが完了した
      task.rejected: タスクを見送ると決めた
      task.assigned: タスクの担当が決まった
      task.moved: タスクが別のプロジェクトへ移った
      task.deleted: タスクが削除された
      decision.accepted: 決定が承認された
      decision.rejected: 決定が却下された
      comment.added: コメントが追加された
      comment.removed: コメントが取り消された
