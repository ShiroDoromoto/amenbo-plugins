desc: AI がやったことをメールで報告する
about: |
  離れているあいだに AI がプロジェクトで何をしたかを、メールで受け取れます。

  報告するのは AI が書き込んだぶんだけです。自分で動かした変更は、その場に居合わせたものなので送りません。
  どのイベントをメールにするかは、Amenbo が出す11種類から選べます。

  まとめて起きたイベントは、何通にも分かれず1通で届きます。同じプロジェクトからのメールは1つのスレッドに
  まとまります。宛先はプロジェクトごとの設定なので、2つのプロジェクトを別々のメールボックスへ向けられます。

  SMTP サーバーは手持ちのもので構いません。あいだに入るサービスはなく、プラグイン自身はアドレスを持ちません。
  メールは自分のアカウントから出ていきます。

  Gmail をお使いの場合は、アプリパスワードの発行が必要です。
  https://github.com/ShiroDoromoto/amenbo-plugin-mail#gmail
config:
  smtp_host:
    label: SMTP サーバー
    help: |-
      メールを渡す先のサーバーです。契約している事業者が「SMTP」や「送信サーバー」といった名前で公開しています。
  smtp_port:
    label: ポート番号
    help: |-
      587 はほとんどの事業者が待ち受けている送信用のポートです。別の番号を指定されている場合だけ変えてください。
  smtp_user:
    label: アカウント
    help: |-
      認証に使うアカウントを、省略せずに書きます。@ の前だけでなくアドレス全体です。認証を求めないリレーに送るなら、パスワードごと空のままにします。
  smtp_password:
    label: パスワード
    help: |-
      そのアカウントがプログラムに使わせるパスワードで、サインインに使うものとは限りません。Gmail は本人のパスワードを受け付けません。2 段階認証を有効にしてアプリパスワードを作り、16 文字を続けて入力してください。画面上の空白は含みません。
  from:
    label: 差出人
    help: |-
      メールの差出人になるアドレスです。空のままならアカウントのアドレスになり、事業者が受け付けるのもそれです。別人を名乗るメールはたいてい拒否されます。アカウントが無いと代わりがないので、そのときは記入してください。
  to:
    label: 宛先
    help: |-
      メールの宛先です。空のままならアカウントのアドレスへ届き、アカウントが無いときは記入が必要です。複数の宛先は1行に、カンマで区切って並べます。
  events:
    label: 何を報告するか
    help: |-
      Amenbo が出すイベントのうち、このプラグインが報告できるものすべてです。どれを選んでも報告するのは AI の書き込みだけで、自分で動かした変更はその場に居合わせたものなので送りません。1つも選ばないことも答えです。プラグインは有効なまま、何も報告しません。
    options:
      task.created: タスクが作成された
      task.status_changed: タスクの状態が変わった
      task.done: タスクが完了した
      task.rejected: タスクを見送ると決めた
      task.assigned: タスクの担当が決まった
      task.moved: タスクが別のプロジェクトへ移った
      task.deleted: タスクが削除された
      decision.accepted: 決定が承認された
      decision.rejected: 決定が却下された
      comment.added: コメントが追加された
      comment.removed: コメントが取り消された
