desc: Baca tugas Anda di ponsel, dari server milik Anda sendiri
about: |
  Tugas Anda sampai ke ponsel, dan aplikasi Amenbo Viewer membacanya di sana — tugasnya, keadaan tiap tugas saat ini, dan keputusan di baliknya — selagi Anda jauh dari PC.

  Tidak ada yang dihosting untuk Anda. Servernya milik Anda sendiri: server beserta basis datanya yang dibuat «3. Buat server di Cloudflare» di akun Cloudflare Anda sendiri. Tugas berjalan satu arah, dan hanya sebanyak yang berubah.

  Tugas berjalan tersegel. «4. Pasangkan ponsel» memasangkan ponsel tanpa melalui jaringan — kamera membaca URL server, token API untuk membaca, dan kunci enkripsinya. «5. Lihat ponsel yang dipasangkan» menyebut ponsel mana saja yang boleh membaca, dan «6. Lepaskan ponsel» memutus salah satunya.

  Begitu diaktifkan, yang dibawa adalah seluruh proyek di mesin ini: ponsel adalah satu perangkat, bukan satu proyek.
config:
  routes:
    label: Ke mana mengantar
    help: |-
      Apakah ini boleh mengantar ke server Anda di Cloudflare. Dari sini tempat hanya bisa dikurangi: dicentang pun server tetap harus sudah ada sebelum ada yang sampai ke sana, dan «3. Buat server di Cloudflare»-lah yang membuatnya. Tidak mencentang juga sebuah jawaban dan dihormati: plugin tetap aktif dan tidak mengantar ke mana pun.
    options:
      cloudflare: Server Anda sendiri di Cloudflare
  worker_url:
    label: URL server Anda di Cloudflare
    help: "«3. Buat server di Cloudflare» mengisinya saat membuat server. Tidak ada yang perlu diketik."
  auth_token:
    label: Token API yang dipakai server untuk menerima tulisan
    help: "«3. Buat server di Cloudflare» membuatnya. Tidak ada yang perlu diketik."
  encryption_key:
    label: Kunci untuk mengenkripsi tugas Anda
    help: "«3. Buat server di Cloudflare» membuatnya. Tidak ada yang perlu diketik — ponsel menerimanya lewat QR, tidak pernah lewat jaringan."
settings:
  actions:
    app:
      label: 1. Pasang aplikasi di ponsel
    token:
      label: 2. Ambil token API Cloudflare
    setup:
      label: 3. Buat server di Cloudflare
      ask:
        api_token: Token API Cloudflare
    qr:
      label: 4. Pasangkan ponsel
      ask:
        label: Nama untuk ponsel ini
    phones:
      label: 5. Lihat ponsel yang dipasangkan
    revoke:
      label: 6. Lepaskan ponsel
      ask:
        phone: Nama ponsel yang akan dilepaskan
