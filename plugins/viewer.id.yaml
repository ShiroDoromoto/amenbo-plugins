desc: Baca daftar tugas Anda di ponsel, dari tempat milik Anda sendiri
about: |
  Daftar tugas Anda sampai ke ponsel, dan aplikasi Amenbo Viewer membacanya di sana — tugasnya, keadaan tiap tugas saat ini, dan keputusan di baliknya — selagi Anda jauh dari PC.

  Tidak ada yang dihosting untuk Anda. Tempatnya milik Anda sendiri: Cloudflare Worker beserta basis datanya yang didirikan `setup` di akun Cloudflare Anda sendiri. Catatan berjalan satu arah, dan hanya sebanyak yang berubah.

  Catatan berjalan tersegel. `qr` memasangkan ponsel tanpa melalui jaringan — kamera membaca alamat, token, dan kuncinya. `phones` menyebut ponsel mana saja yang boleh membaca, dan `revoke` memutus salah satunya.

  Begitu diaktifkan, yang dibawa adalah seluruh proyek di mesin ini: ponsel adalah satu perangkat, bukan satu proyek.
config:
  routes:
    label: Ke mana dibawa
    help: |-
      Apakah ini boleh membawa ke Cloudflare Worker Anda. Dari sini tempat hanya bisa dikurangi: dicentang pun Worker tetap harus sudah ada sebelum ada yang sampai ke sana, dan setup-lah yang mendirikannya. Tidak mencentang juga sebuah jawaban dan dihormati: plugin tetap aktif dan tidak membawa ke mana pun.
    options:
      cloudflare: Cloudflare Worker milik Anda
  worker_url:
    label: URL Cloudflare Worker Anda sendiri
    help: "setup mengisinya saat menyiapkan Worker. Tidak ada yang perlu diketik."
  auth_token:
    label: Token yang dipakai Worker untuk menerima tulisan
    help: "setup membuatnya. Tidak ada yang perlu diketik."
  encryption_key:
    label: Kunci untuk mengenkripsi catatan
    help: "setup membuatnya. Tidak ada yang perlu diketik — ponsel menerimanya lewat QR, tidak pernah lewat jaringan."
settings:
  actions:
    app:
      label: 1. Pasang aplikasi di ponsel
    token:
      label: 2. Ambil token API
    setup:
      label: 3. Siapkan jalur Cloudflare
      ask:
        api_token: Token API Cloudflare
    qr:
      label: 4. Pasangkan ponsel
      ask:
        label: Nama untuk ponsel ini
