desc: Đọc công việc của bạn trên điện thoại, từ máy chủ thuộc về bạn
about: |
  Công việc đến điện thoại của bạn, và ứng dụng Amenbo Viewer đọc chúng ở đó — các việc, trạng thái hiện tại của từng việc, và những quyết định đằng sau chúng — trong lúc bạn rời khỏi máy tính.

  Không ai lưu trữ hộ bạn cả. Máy chủ là của chính bạn: “3. Tạo máy chủ trên Cloudflare” dựng nó cùng cơ sở dữ liệu trong tài khoản Cloudflare của bạn. Phần đã thay đổi đi một chiều, và chỉ đi đúng phần đó.

  Nó đi trong phong bì niêm kín. “4. Ghép nối điện thoại” ghép một chiếc mà không qua mạng — máy ảnh đọc URL máy chủ, token API để đọc và khoá mã hoá. “5. Xem điện thoại đã ghép nối” cho biết những điện thoại nào được đọc, còn “6. Hủy ghép nối điện thoại” cắt một chiếc trong số đó.

  Bật lên là mang theo mọi dự án trên máy này: điện thoại là một thiết bị, không phải một dự án.
config:
  routes:
    label: Chuyển tới đâu
    help: |-
      Cái này có được phép chuyển tới máy chủ của bạn trên Cloudflare hay không. Ở đây chỉ có thể bớt nơi đi: tick rồi thì máy chủ vẫn phải tồn tại trước đã thì mới có gì đến được, và dựng nó lên là việc của “3. Tạo máy chủ trên Cloudflare”. Không tick cũng là một câu trả lời và được tôn trọng: plugin vẫn bật và không chuyển đi đâu cả.
    options:
      cloudflare: Máy chủ của riêng bạn trên Cloudflare
  worker_url:
    label: URL máy chủ của bạn trên Cloudflare
    help: |-
      “3. Tạo máy chủ trên Cloudflare” điền vào khi dựng máy chủ. Không có gì để gõ.
  auth_token:
    label: Token API để máy chủ cho phép ghi
    help: |-
      “3. Tạo máy chủ trên Cloudflare” tạo ra. Không có gì để gõ.
  encryption_key:
    label: Khoá dùng để mã hoá công việc của bạn
    help: |-
      “3. Tạo máy chủ trên Cloudflare” tạo ra. Không có gì để gõ — điện thoại nhận qua QR, không bao giờ qua mạng.
settings:
  actions:
    app:
      label: 1. Cài ứng dụng điện thoại
    token:
