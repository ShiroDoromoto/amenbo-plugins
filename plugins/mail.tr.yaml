desc: Yapay zekânızın yaptıklarını e-postayla bildirir
about: |
  Siz projeden uzaktayken yapay zekânın orada ne yaptığını e-postayla alırsınız.

  Yalnızca yapay zekânın yazdıkları bildirilir: kendi yaptığınız bir değişiklikte zaten
  oradaydınız. Hangi olayların bir e-postaya değdiğini, amenbo'nun ürettiği on bir olay
  arasından siz seçersiniz.

  Arka arkaya gelen olaylar bir düzine ileti yerine tek iletiyle ulaşır ve bir projenin
  gönderdiği iletiler aynı konu dizisinde toplanır. Nereye gideceği projenin kendi ayarıdır;
  yani iki proje iki ayrı posta kutusuna bildirebilir.

  Elinizde hâlihazırda olan hangi SMTP sunucusu varsa yeter. Araya giren bir hizmet yoktur ve
  eklentinin kendisi hiçbir adres tutmaz: e-posta sizin hesabınızdan çıkar.

  Gmail mi kullanıyorsunuz? Bir uygulama parolası gerekecek:
  https://github.com/ShiroDoromoto/amenbo-plugin-mail#gmail
config:
  smtp_host:
    label: "SMTP sunucusu (Gmail için: smtp.gmail.com)"
  smtp_port:
    label: Port
  smtp_user:
    label: "Hesap (Gmail'de: kendi adresiniz)"
  smtp_password:
    label: "Parola (Gmail'de: uygulama parolası)"
  from:
    label: Gönderen (boş bırakılırsa hesabın adresi)
  to:
    label: Alıcı (boş bırakılırsa hesabın adresi; birden fazlası virgülle ayrılır)
  events:
    label: Neler bildirilsin
    options:
      task.created: Bir görev oluşturuldu
      task.status_changed: Bir görevin durumu değişti
      task.done: Bir görev bitirildi
      task.rejected: Bir görevden vazgeçildi
      task.assigned: Bir görevin ataması değişti
      task.moved: Bir görev başka projeye taşındı
      task.deleted: Bir görev silindi
      decision.accepted: Bir karar kabul edildi
      decision.rejected: Bir karar reddedildi
      comment.added: Bir yorum eklendi
      comment.removed: Bir yorum geri alındı
