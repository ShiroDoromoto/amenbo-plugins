desc: Yapay zekânızın yaptıklarını e-postayla bildirir
about: |
  Siz projeden uzaktayken yapay zekânın orada ne yaptığını e-postayla alırsınız.

  Yalnızca yapay zekânın yazdıkları bildirilir: kendi yaptığınız bir değişiklikte zaten
  oradaydınız. Bir tarihin gelmesi kimsenin yazdığı bir şey değildir ve kimse bakmazken gelir;
  bu yüzden o da bildirilir. Hangi olayların bir e-postaya değdiğini, Amenbo'nun ürettiği on üç
  olay arasından siz seçersiniz.

  Arka arkaya gelen olaylar bir düzine ileti yerine tek iletiyle ulaşır ve bir projenin
  gönderdiği iletiler aynı konu dizisinde toplanır. Nereye gideceği projenin kendi ayarıdır;
  yani iki proje iki ayrı posta kutusuna bildirebilir.

  Elinizde hâlihazırda olan hangi SMTP sunucusu varsa yeter. Araya giren bir hizmet yoktur ve
  eklentinin kendisi hiçbir adres tutmaz: e-posta sizin hesabınızdan çıkar.

  Gmail mi kullanıyorsunuz? Bir uygulama parolası gerekecek:
  https://github.com/ShiroDoromoto/amenbo-plugin-mail#gmail
config:
  smtp_host:
    label: SMTP sunucusu
    help: |-
      İletinin teslim edileceği sunucu. Sağlayıcınız bunu genellikle "SMTP" ya da "giden posta" başlığı altında duyurur.
  smtp_port:
    label: Port
    help: |-
      587, neredeyse her sağlayıcının dinlediği gönderim portudur. Yalnızca sağlayıcınız başka bir port belirtiyorsa değiştirin.
  smtp_user:
    label: Hesap
    help: |-
      Kimlik doğrulamada kullanılacak hesap, tam olarak yazılmış hâliyle — @ işaretinden önceki kısım değil, adresin tamamı. Hiçbirini istemeyen bir aktarıcı için bunu da parolayı da boş bırakın.
  smtp_password:
    label: Parola
    help: |-
      O hesabın bir programa kullandırdığı parola; her zaman oturum açtığınız parola değildir. Gmail kendi parolasını kabul etmez, bunun yerine bir uygulama parolası ister: yukarıdaki düğme bir tane oluşturur, yeter ki hesapta 2 Adımlı Doğrulama açık olsun. On altı karakterini bitişik girin — ekranda görünen boşluklar parolanın parçası değildir.
  from:
    label: Gönderen
    help: |-
      İletinin gönderildiği adres. Boş bırakılırsa hesabın kendisidir ve bir sağlayıcının kabul edeceği de budur: çoğu, başkasından geliyormuş gibi görünen iletiyi reddeder. Hesap yoksa geri düşülecek bir şey de kalmaz, o zaman doldurun.
  to:
    label: Alıcı
    help: |-
      İletinin gönderileceği yer. Boş bırakılırsa hesaba gider, hesap yoksa doldurulması gerekir. Birden fazla adres aynı satırda, virgülle ayrılarak yazılır.
  events:
    label: Neler bildirilsin
    help: |-
      Amenbo'nun ürettiği ve bu eklentinin bildirebildiği her şey. Yazılanlardan, neyi işaretlerseniz işaretleyin, yalnızca yapay zekânızın yazdıkları bildirilir — kendi yaptığınızın zaten başındaydınız. Son ikisi yazı değildir: Amenbo günde bir kez, süresi gelen bir görevi ve yarın süresi dolan bir görevi bildirir. Bunları kimse yazmadı, dolayısıyla hiçbir şey onları elemez. Hiçbirini işaretlememek de bir yanıttır: eklenti açık kalır ve hiçbir şey bildirmez.
    options:
      task.created: Bir görev oluşturuldu
      task.status_changed: Bir görevin durumu değişti
      task.done: Bir görev bitirildi
      task.rejected: Bir görevden vazgeçildi
      task.assigned: Bir görevin ataması değişti
      task.moved: Bir görev başka projeye taşındı
      task.deleted: Bir görev silindi
      decision.accepted: Bir karar kabul edildi
      decision.rejected: Bir karar reddedildi
      comment.added: Bir yorum eklendi
      comment.removed: Bir yorum geri alındı
      task.due: Bir görevin süresi bugün doluyor ya da geçmiş
      task.due_tomorrow: Bir görevin süresi yarın doluyor
