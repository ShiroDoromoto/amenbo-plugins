desc: Signale par e-mail ce que votre IA a fait
about: |
  Recevez par e-mail ce que votre IA a fait dans un projet pendant que vous en étiez loin.

  Seules les écritures de l'IA sont signalées : une modification que vous avez faite
  vous-même, vous y étiez. Les événements qui méritent un e-mail, c'est vous qui les cochez,
  parmi les onze qu'amenbo émet.

  Une rafale d'événements arrive en un seul message plutôt qu'en une douzaine, et tous les
  messages d'un projet se rejoignent dans le même fil. Leur destination est un réglage du
  projet lui-même : deux projets peuvent donc écrire à deux boîtes différentes.

  N'importe quel serveur SMTP que vous avez déjà fera l'affaire. Rien ne s'interpose, et le
  plugin ne détient aucune adresse : l'e-mail part par votre propre compte.

  Vous utilisez Gmail ? Il vous faudra un mot de passe d'application :
  https://github.com/ShiroDoromoto/amenbo-plugin-mail#gmail
config:
  smtp_host:
    label: Serveur SMTP
    help: |-
      Le serveur auquel le message est remis. Votre fournisseur le publie, en général sous « SMTP » ou « courrier sortant ».
  smtp_port:
    label: Port
    help: |-
      587 est le port de soumission sur lequel écoute presque tout fournisseur. Ne le changez que si le vôtre en indique un autre.
  smtp_user:
    label: Compte
    help: |-
      Le compte avec lequel s'authentifier, écrit en entier — l'adresse complète, pas seulement ce qui précède le @. Laissez-le vide, ainsi que le mot de passe, pour un relais qui n'en demande aucun.
  smtp_password:
    label: Mot de passe
    help: |-
      Le mot de passe que ce compte autorise un programme à utiliser, qui n'est pas toujours celui de votre connexion. Gmail refuse le sien : activez la validation en deux étapes, créez un mot de passe d'application et saisissez ses seize caractères d'affilée — les espaces affichés à l'écran n'en font pas partie.
  from:
    label: Expéditeur
    help: |-
      L'adresse depuis laquelle le message est envoyé. Laissée vide, c'est le compte, et c'est ce qu'un fournisseur acceptera : la plupart refusent un message se présentant comme venant d'un autre. Sans compte, il n'y a rien sur quoi se rabattre : remplissez-la.
  to:
    label: Destinataire
    help: |-
      Où le message est envoyé. Laissé vide, il part vers le compte, et sans compte il faut le remplir. Plusieurs adresses tiennent sur la même ligne, séparées par des virgules.
  events:
    label: Ce qu'il faut signaler
    help: |-
      Tout ce qu'amenbo émet et que ce plugin peut signaler. Seules les écritures de votre IA sont signalées, quoi que vous cochiez ici : ce que vous avez fait vous-même, vous y étiez. Ne rien cocher est aussi une réponse : le plugin reste activé et ne signale rien.
    options:
      task.created: Une tâche a été créée
      task.status_changed: Le statut d'une tâche a changé
      task.done: Une tâche a été terminée
      task.rejected: Une tâche a été écartée
      task.assigned: Une tâche a été réattribuée
      task.moved: Une tâche est passée à un autre projet
      task.deleted: Une tâche a été supprimée
      decision.accepted: Une décision a été acceptée
      decision.rejected: Une décision a été rejetée
      comment.added: Un commentaire a été ajouté
      comment.removed: Un commentaire a été retiré
