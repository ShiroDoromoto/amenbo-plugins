desc: バックログを、自前の置き場からスマートフォンで読む
about: |
  PC から離れているあいだも、バックログがスマートフォンへ届き、Amenbo Viewer で読める——タスクと、その一つ一つが今どの状態か、そして決めた理由が。

  置き場は運営が持たない。持つのは利用者で、mac ならアプリ専用の iCloud フォルダ、そうでなければ `setup` が自分の Cloudflare アカウントへ立てる Worker とデータベースになる。レコードは片方向に、動いたぶんだけ運ぶ。

  Cloudflare 経路では封をして運ぶ。`qr` はネットワークを通さずに端末をペアリングし、置き場とトークンと鍵をカメラへ渡す。読める端末は `phones` で分かり、`revoke` で1台だけ切れる。

  有効にすると、運ぶのはこの端末の全プロジェクトになる——スマートフォンは1台であって、1プロジェクトではない。
config:
  worker_url:
    label: 自分の Cloudflare Worker の URL（setup が入れる）
  auth_token:
    label: Worker が書き込みを受け入れるトークン（setup が入れる）
  encryption_key:
    label: 記録を暗号化する鍵（setup が入れる）
settings:
  actions:
    setup:
      label: Cloudflare 経路を立てる
      ask:
        api_token: Cloudflare の API トークン
