desc: タスクを、自分のサーバーからスマートフォンで読む
about: |
  PC から離れているあいだも、タスクと決定記録がスマートフォンへ届き、Amenbo Viewer で読める——一つ一つが今どの状態か、そして何をなぜそう決めたのかまで。

  サーバーは運営が持たない。持つのは利用者で、「3. Cloudflare にサーバーを作る」が自分の Cloudflare アカウントへサーバーとデータベースを作る。動いたぶんだけ、片方向に運ぶ。

  運ぶときは封をする。「4. 端末をペアリング」はネットワークを通さずに端末を繋ぎ、サーバーの URL と読み取り用の API トークンと暗号鍵をカメラへ渡す。読める端末は「5. ペアリングした端末を見る」で分かり、「6. ペアリングを解除する」で1台だけ切れる。

  有効にすると、運ぶのはこの端末の全プロジェクトになる——スマートフォンは1台であって、1プロジェクトではない。
config:
  routes:
    label: どこへ運ぶか
    help: |-
      自分の Cloudflare のサーバーへ運んでよいかどうかです。ここで選べるのは減らすことだけで、選んでも、そこへ届くより先にサーバーが実在している必要があります——作るのは「3. Cloudflare にサーバーを作る」です。選ばないことも答えで、そのまま尊重されます——有効なまま、どこへも運びません。
    options:
      cloudflare: 自分の Cloudflare のサーバー
  worker_url:
    label: Cloudflare の自分のサーバーの URL
    help: |-
      「3. Cloudflare にサーバーを作る」がサーバーを作るときに書き込みます。打つものはありません。
  auth_token:
    label: サーバーが書き込みを受け入れる API トークン
    help: |-
      「3. Cloudflare にサーバーを作る」が生成します。打つものはありません。
  encryption_key:
    label: タスクを暗号化する暗号鍵
    help: |-
      「3. Cloudflare にサーバーを作る」が生成します。打つものはありません——端末へは QR で渡り、ネットワークには出ません。
settings:
  actions:
    app:
      label: 1. アプリを端末に入れる
    token:
      label: 2. API トークンを取る
    setup:
      label: 3. Cloudflare にサーバーを作る
      ask:
        api_token: Cloudflare の API トークン
    qr:
      label: 4. 端末をペアリング
      ask:
        label: この端末の名前
    phones:
      label: 5. ペアリングした端末を見る
    revoke:
      label: 6. ペアリングを解除する
      ask:
        phone: 解除する端末の名前
