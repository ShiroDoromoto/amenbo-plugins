desc: AI가 한 일을 Slack 채널로 보고하기
about: |
  AI가 작업을 완료할 때마다, 하지 않기로 정할 때마다, 결정을 채택할 때마다, 그리고 작업의 기한이 될 때마다 그 한 줄이 Slack 채널에 도착합니다. 프로젝트를 떠나 있는 동안 무엇이 진행됐는지를, 이미 보고 있는 곳에서 읽습니다.

  - **올라가는 것은 AI가 쓴 것과, 아무도 쓰지 않은 날짜뿐입니다.** 직접 한 일은 그 자리에 있었던 일이니, 채널에는 아무도 보지 않는 동안 진행된 일만 남습니다. 기한이 되는 것은 누구의 기록도 아니고 아무도 보지 않을 때 찾아오므로, 이것도 알립니다.
  - **채널이 곧 설정입니다.** `webhook_url`은 그것을 쓴 프로젝트의 것이므로, 그 값이 바로 그 프로젝트가 보고하는 채널입니다. 두 프로젝트에 웹훅 두 개를 넣으면 두 채널로 갑니다. 하나로 모아도 각 메시지가 어느 프로젝트인지 밝힙니다.
  - **어떤 일을 알릴지는 고릅니다.** 작업 생성부터 기한 도래까지 열세 가지 중에서 고르며, 기본값은 작업의 생성·상태 변경·완료·보류와 기한 도래·하루 전 여섯 가지입니다.

  Slack에서 필요한 것은 Incoming Webhook URL 하나뿐이고, 비밀 설정으로 보관됩니다 — 내보내기에도, 로그에도, 되읽기에도 나오지 않습니다. 메시지는 amenbo를 읽는 언어로 쓰이고, AI는 붙여 준 이름으로 불립니다.
config:
  webhook_url:
    label: Slack Webhook URL
    help: |-
      이 URL을 만드는 곳은 amenbo가 아니라 Slack이고, 그 URL이 곧 채널입니다. 채널을 잘못 고른 Webhook은 다른 설정이 모두 맞아도 엉뚱한 방으로 보냅니다.
      api.slack.com/apps에서 이 프로젝트의 보고를 받을 워크스페이스에 앱을 만들고, Incoming Webhooks를 켜고, 보낼 채널에 하나 추가한 뒤 돌려받은 URL을 복사합니다.
      비밀 설정으로 보관되므로 내보내기에도, 로그에도, 되읽기에도 나오지 않습니다.
  events:
    label: 무엇을 보고할지
    help: |-
      하나도 고르지 않는 것도 답이며 그대로 지켜집니다. 플러그인은 켜진 채 아무것도 보고하지 않습니다. 비우면 기본 여섯 가지로 돌아갑니다.
    options:
      task.created: 작업이 만들어짐
      task.status_changed: 작업의 상태가 바뀜
      task.done: 작업이 완료됨
      task.rejected: 작업을 하지 않기로 함
      task.assigned: 작업의 담당이 정해짐
      task.moved: 작업이 다른 프로젝트로 옮겨짐
      task.deleted: 작업이 삭제됨
      decision.accepted: 결정이 채택됨
      decision.rejected: 결정이 기각됨
      comment.added: 댓글이 달림
      comment.removed: 댓글이 철회됨
      task.due: 작업의 기한이 오늘이거나 지났음
      task.due_tomorrow: 작업의 기한이 내일임
settings:
  actions:
    config test:
      label: 테스트 메시지 보내기
