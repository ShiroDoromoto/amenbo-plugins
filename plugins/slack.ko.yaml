desc: AI가 한 일을 Slack 채널로 보고하기
about: |
  AI가 작업을 완료할 때마다, 하지 않기로 정할 때마다, 결정을 채택할 때마다 그 한 줄이 Slack 채널에 도착합니다. 프로젝트를 떠나 있는 동안 무엇이 진행됐는지를, 이미 보고 있는 곳에서 읽습니다.

  - **올라가는 것은 AI가 쓴 것뿐입니다.** 직접 한 일은 그 자리에 있었던 일이니, 채널에는 아무도 보지 않는 동안 진행된 일만 남습니다.
  - **채널이 곧 설정입니다.** `webhook_url`은 그것을 쓴 프로젝트의 것이므로, 그 값이 바로 그 프로젝트가 보고하는 채널입니다. 두 프로젝트에 웹훅 두 개를 넣으면 두 채널로 갑니다. 하나로 모아도 각 메시지가 어느 프로젝트인지 밝힙니다.
  - **어떤 일을 알릴지는 고릅니다.** 작업 생성부터 댓글 취소까지 열한 가지 중에서 고르며, 기본값은 작업의 생성·상태 변경·완료·보류 네 가지입니다.

  Slack에서 필요한 것은 Incoming Webhook URL 하나뿐이고, 비밀 설정으로 보관됩니다 — 내보내기에도, 로그에도, 되읽기에도 나오지 않습니다. 메시지는 amenbo를 읽는 언어로 쓰이고, AI는 붙여 준 이름으로 불립니다.
config:
  webhook_url:
    label: Slack Webhook URL
  events:
    label: 무엇을 보고할지
    options:
      task.created: 작업이 만들어짐
      task.status_changed: 작업의 상태가 바뀜
      task.done: 작업이 완료됨
      task.rejected: 작업을 하지 않기로 함
      task.assigned: 작업의 담당이 정해짐
      task.moved: 작업이 다른 프로젝트로 옮겨짐
      task.deleted: 작업이 삭제됨
      decision.accepted: 결정이 채택됨
      decision.rejected: 결정이 기각됨
      comment.added: 댓글이 달림
      comment.removed: 댓글이 철회됨
