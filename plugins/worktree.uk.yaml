desc: Ізолює кожне завдання в окремому git worktree
about: |
  Кожне завдання дістає власну робочу копію: `start` вирізає для нього git worktree на свіжій гілці `task/<id>`, а `finish` прибирає і копію, і гілку, щойно роботу влито.

  ```
  <repo>/../<repo-name>-worktrees/<id>/    гілка task/<id>
  ```

  Копія лежить **поза** репозиторієм, тож це чисте середовище розробки — ніщо в ній не прив'язане до amenbo й не зійде за частину проєкту. Кілька сесій ідуть водночас, не стикаючись: одне завдання, одна копія, одна гілка.

  ```sh
  eval "$(amenbo plugin run worktree start 123)"   # у PowerShell: iex (…)
  amenbo plugin run worktree finish 123
  ```

  `start` повертає сам рядок `cd`, тож у worktree заходить та оболонка, у якій ви стоїте. `finish` запускають із головного репозиторію; він відмовляє, доки копія брудна або гілка тримає коміти, яких немає в базовій, — `--force` переступає через обидві відмови. Без `--base` обидві команди беруть ту гілку, на якій стоїть репозиторій, тож заповнювати наперед нічого.

  Резервування завдання змушує плагін написати одну підказку в stderr, і тільки: чи потрібна *цьому* завданню власна копія — це судження, і воно лишається за тим, хто підказку читає. Беклог теж лишається за amenbo: плагін чіпає git і більше нічого.

  Потрібен git 2.31 або новіший.
