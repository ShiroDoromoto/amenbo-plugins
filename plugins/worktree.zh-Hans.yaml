desc: 把每个任务隔离到各自的 git worktree
about: |
  每个任务都有自己的检出：`start` 在新分支 `task/<id>` 上为它切出一个 git worktree，`finish` 则在工作合并之后把两者一并撤走。

  ```
  <repo>/../<repo-name>-worktrees/<id>/    分支 task/<id>
  ```

  检出放在仓库**之外**，因此是一个纯粹的开发环境——里面没有任何东西绑定到 amenbo，也没有任何东西会被错认成项目的一部分。多个实现会话于是可以同时进行而互不碰撞：一个任务，一份检出，一条分支。

  ```sh
  eval "$(amenbo plugin run worktree start 123)"   # PowerShell 用 iex (…)
  # …干活、提交、合并…
  amenbo plugin run worktree finish 123
  ```

  `start` 返回的就是那一行 `cd`，所以走进 worktree 的正是你此刻所站的 shell。`finish` 在主仓库里执行；只要检出还脏着，或分支还揣着基准分支没有的改动，它就拒绝——`--force` 可以越过这两道。算数的是改动本身，而不是承载它的提交，所以 squash 或 rebase 的合并同样会被读作已合并。不给 `--base` 时，两者都以仓库当前所在的分支为准，事先没有什么要填。

  预约一个任务只会让插件往 stderr 写一行建议，仅此而已：*这个*任务要不要一份自己的检出是判断，判断留给读到建议的人。待办同样留在 amenbo 手里——这个插件读任务只为看它在哪里进行，写的只有 git。

  需要 git 2.31 或更新版本。
