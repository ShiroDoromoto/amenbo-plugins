desc: In een Slack-kanaal melden wat je AI heeft gedaan
about: |
  Elke taak die je AI afrondt, elke taak die het niet gaat doen, elk besluit dat het aanneemt, elke taak waarvan de dag is gekomen: de regel komt in een Slack-kanaal binnen. Wat er gebeurde terwijl je weg was bij het project, in de ruimte die je toch al leest.

  - **Alleen wat de AI schrijft, wordt gemeld — en de dagen die niemand schreef.** Wat je zelf schreef, was je bij; in het kanaal blijft het werk dat zonder jou gebeurde. Een deadline die aanbreekt schrijft niemand, en hij breekt aan terwijl niemand kijkt, dus die wordt ook gemeld.
  - **Het kanaal is de instelling.** `webhook_url` hoort bij het project waarin die is gezet, dus die waarde *is* het kanaal waaraan dat project meldt. Twee projecten met twee webhooks melden aan twee kanalen; elk bericht noemt zijn project, dus samen op één kanaal leest ook.
  - **Welke gebeurtenissen, kies je zelf.** Dertien om aan te vinken, van een taak die is aangemaakt tot een deadline die aanbreekt. Standaard zes: een taak aangemaakt, van status veranderd, afgerond of verworpen, en een deadline bereikt of nog één dag weg.

  Slack hoeft maar één Incoming Webhook-URL af te geven, en die wordt als geheime instelling bewaard — hij verlaat amenbo niet in een export, een log of een teruglezing. Berichten staan in de taal waarin je amenbo leest en noemen je AI bij de naam die je hem gaf.
config:
  webhook_url:
    label: Slack-webhook-URL
    help: |-
      Deze URL komt van Slack, niet van amenbo, en hij is het kanaal: een webhook voor het verkeerde kanaal meldt in de verkeerde ruimte, terwijl er verder niets fout staat.
      Maak op api.slack.com/apps een app in de workspace die van dit project moet horen, zet Incoming Webhooks aan, voeg er een toe aan het kanaal waar het heen moet, en kopieer de URL die je terugkrijgt.
      Hij wordt als geheime instelling bewaard — hij verlaat amenbo niet in een export, een log of een teruglezing.
  events:
    label: Wat er gemeld wordt
    help: |-
      Niets aanvinken is ook een antwoord en wordt gerespecteerd: de plug-in blijft aan en meldt niets. Leegmaken zet de zes standaardgebeurtenissen terug.
    options:
      task.created: Een taak is aangemaakt
      task.status_changed: De status van een taak is gewijzigd
      task.done: Een taak is afgerond
      task.rejected: Een taak is afgewezen
      task.assigned: Een taak is toegewezen
      task.moved: Een taak is naar een ander project verplaatst
      task.deleted: Een taak is verwijderd
      decision.accepted: Een besluit is aangenomen
      decision.rejected: Een besluit is afgewezen
      comment.added: Een opmerking is toegevoegd
      comment.removed: Een opmerking is ingetrokken
      task.due: De deadline van een taak is vandaag, of al verstreken
      task.due_tomorrow: De deadline van een taak is morgen
settings:
