desc: 把 AI 做过的事报告到 Slack 频道
about: |
  你的 AI 每完成一个任务、每决定不做一个任务、每采纳一项决策，以及每当任务到了期限，都会有一行消息送到 Slack 频道。你离开项目的这段时间里发生了什么，就在你本来就看着的地方读到。

  - **只发 AI 写下的东西，以及没人写下的日子。** 你自己动手的那些，你当时就在场；频道里留下的是没人盯着时推进的工作。期限到了不是谁写下的，而且它总在没人看的时候到来，所以也会发。
  - **频道就是那项设置。** `webhook_url` 属于写下它的项目，所以这个值*就是*该项目汇报的频道。两个项目填两个 webhook，就汇报到两个频道；每条消息都会说明来自哪个项目，因此两个项目共用一个频道也读得清。
  - **报哪些事，由你选。** 从任务被创建到期限到来，共十三项可勾选。默认是任务被创建、状态变更、完成、放弃，以及期限到来、还剩一天这六项。

  Slack 那边只需要给出一条 Incoming Webhook URL，它作为机密设置保存——不会随导出、日志或回读离开 Amenbo。消息用你阅读 Amenbo 的语言写成，并按你给 AI 起的名字称呼它。
config:
  webhook_url:
    label: Slack Webhook 地址
    help: |-
      这个地址由 Slack 生成，不是 Amenbo，而它就是频道：webhook 选错频道，其他都设置对了也会发到错的房间。
      为需要知道这个项目的工作区创建一个应用，打开 Incoming Webhooks，为要发消息的频道添加一条，再复制返回的地址。
      它作为机密设置保存——不会随导出、日志或回读离开 Amenbo。
  events:
    label: 报告哪些事
    help: |-
      一个都不勾也是一种回答，并会被照办：插件仍然启用，但什么都不报。清空则恢复默认的六项。
    options:
      task.created: 创建了任务
      task.status_changed: 任务的状态变了
      task.done: 完成了任务
      task.rejected: 决定不做某个任务
      task.assigned: 分配了任务
      task.moved: 任务移到了另一个项目
      task.deleted: 删除了任务
      decision.accepted: 采纳了决策
      decision.rejected: 否决了决策
      comment.added: 添加了评论
      comment.removed: 撤回了评论
      task.due: 任务今天到期，或已过期
      task.due_tomorrow: 任务明天到期
settings:
  actions:
    config test:
      label: 发送测试消息
