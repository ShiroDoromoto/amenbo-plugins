about: |
  Report by email what your AI did in a project while you were away from it.

  Only the AI's writes are reported: a change you made yourself is one you were there for.
  Which events are worth a mail is yours to tick, from the eleven Amenbo fires.

  A burst of them arrives as one message instead of a dozen, and every message a project
  sends joins the same thread. Where it goes is that project's own setting, so two projects
  can report to two mailboxes.

  Bring any SMTP server you already have. Nothing sits in between, and the plugin holds no
  address of its own — the mail leaves through your own account.

  Using Gmail? You will need an app password:
  https://github.com/ShiroDoromoto/amenbo-plugin-mail#gmail
official: true
payload_v: 1
min_amenbo: 13.0.0
config:
  - key: smtp_host
    label: SMTP server
    help: |-
      The server the message is handed to. Your provider publishes it, usually under "SMTP" or "outgoing mail".
    placeholder: smtp.gmail.com
  - key: smtp_port
    label: Port
    help: |-
      587 is the submission port nearly every provider listens on. Change it only where yours names another.
    default: "587"
  - key: smtp_user
    label: Account
    help: |-
      The account to authenticate as, written out in full — the whole address, not the part before the @. Leave it and the password empty for a relay that asks for neither.
    placeholder: you@gmail.com
  - key: smtp_password
    label: Password
    help: |-
      The password that account lets a program use, which is not always the one you sign in with. Gmail refuses its own: turn on 2-Step Verification, create an app password, and enter its sixteen characters run together — the spaces the screen shows them in are not part of it.
    secret: true
  - key: from
    label: From
    help: |-
      The address the message is sent from. Left empty it is the account, which is what a provider will accept — most refuse a message claiming to be from anyone else. With no account there is nothing to fall back on, so fill it in.
  - key: to
    label: To
    help: |-
      Where the message is sent. Left empty it goes to the account, and with no account it has to be filled in. Several addresses go on the one line, separated by commas.
    placeholder: you@example.com, someone-else@example.com
  - key: events
    label: What to report
    help: |-
      Everything Amenbo fires that this plugin can report. Only your AI's writes are reported, whichever of these you tick — a write you drove yourself is one you were there for. Ticking none is an answer too: the plugin stays on and reports nothing.
    type: multi
    default: task.created,task.status_changed,task.done,task.rejected
    options:
      - value: task.created
        label: A task was created
      - value: task.status_changed
        label: A task's status moved
      - value: task.done
        label: A task was finished
      - value: task.rejected
        label: A task was decided against
      - value: task.assigned
        label: A task was assigned
      - value: task.moved
        label: A task moved to another project
      - value: task.deleted
        label: A task was deleted
      - value: decision.accepted
        label: A decision was accepted
      - value: decision.rejected
        label: A decision was rejected
      - value: comment.added
        label: A comment was added
      - value: comment.removed
        label: A comment was taken back
settings:
  check: config check
events:
  - task.created
  - task.status_changed
  - task.done
  - task.rejected
  - task.assigned
  - task.moved
  - task.deleted
  - decision.accepted
  - decision.rejected
  - comment.added
  - comment.removed
