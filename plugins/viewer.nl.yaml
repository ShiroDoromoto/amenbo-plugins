desc: Lees je taken op je telefoon, vanaf een server die van jou is
about: |
  Je taken komen op je telefoon aan, en de app Amenbo Viewer leest ze daar — de taken, de stand van elk ervan en de beslissingen erachter — terwijl je weg bent van de computer.

  Er wordt niets voor je gehost. De server is van jou: “3. Server op Cloudflare aanmaken” zet hem, met zijn database, in je eigen Cloudflare-account neer. Wat bewogen heeft reist één kant op, en alleen voor zover het beweegt.

  Het reist verzegeld. “4. Telefoon koppelen” koppelt er één buiten het netwerk om — de camera leest de server-URL, het lees-API-token en de versleutelingssleutel. “5. Gekoppelde telefoons bekijken” zegt welke telefoons mogen lezen, en “6. Telefoon ontkoppelen” snijdt er één af.

  Aanzetten draagt elk project op deze machine mee: een telefoon is één apparaat, niet één project.
config:
  routes:
    label: Waarheen dragen
    help: |-
      Of dit naar je server op Cloudflare mag dragen. De plek kan hier alleen weg: aanvinken is niet genoeg, de server moet bestaan voordat er iets aankomt, en “3. Server op Cloudflare aanmaken” is wat er een neerzet. Niets aanvinken is ook een antwoord en wordt gerespecteerd: de plug-in blijft aan en draagt nergens heen.
    options:
      cloudflare: Je eigen server op Cloudflare
  worker_url:
    label: URL van je server op Cloudflare
    help: |-
      “3. Server op Cloudflare aanmaken” vult dit in bij het aanmaken van de server. Je hoeft niets te typen.
  auth_token:
    label: API-token waarmee de server schrijfacties toelaat
    help: |-
      “3. Server op Cloudflare aanmaken” genereert dit. Je hoeft niets te typen.
  encryption_key:
    label: Sleutel waarmee je taken versleuteld worden
    help: |-
      “3. Server op Cloudflare aanmaken” genereert deze. Je hoeft niets te typen — de telefoon krijgt hem via de QR, nooit via het netwerk.
settings:
  actions:
    app:
      label: 1. App op de telefoon zetten
    token:
      label: 2. Cloudflare-API-token halen
    setup:
      label: 3. Server op Cloudflare aanmaken
      ask:
        api_token: Cloudflare-API-token
    qr:
      label: 4. Telefoon koppelen
      ask:
        label: Naam voor deze telefoon
    phones:
      label: 5. Gekoppelde telefoons bekijken
    revoke:
      label: 6. Telefoon ontkoppelen
      ask:
        phone: Naam van de telefoon die ontkoppeld wordt
