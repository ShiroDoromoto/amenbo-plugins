desc: Lees je taken op je telefoon, vanaf een server die van jou is
about: |
  Je taken komen op je telefoon aan, en de app Amenbo Viewer leest ze daar — de taken, de stand van elk ervan en de beslissingen erachter — terwijl je weg bent van de computer.

  Er wordt niets voor je gehost. De server is van jou: een server met database die «3. Server op Cloudflare aanmaken» in je eigen Cloudflare-account aanmaakt. Taken reizen één kant op, en alleen voor zover ze bewegen.

  Ze reizen verzegeld. «4. Telefoon koppelen» koppelt een telefoon buiten het netwerk om — de camera leest de URL van de server, het API-token om te lezen en de encryptiesleutel. Er is één koppeling: «5. Kijken of er een telefoon is» zegt of die er is, «6. Koppeling ongedaan maken» haalt hem weg, en opnieuw koppelen vervangt de vorige.

  Aanzetten draagt elk project op deze machine mee: een telefoon is één apparaat, niet één project.
config:
  routes:
    label: Waar het heen gaat
    help: |-
      Of dit naar je eigen server op Cloudflare mag dragen. De plek kan hier alleen weg: aanvinken is niet genoeg, de server moet bestaan voordat er iets aankomt, en «3. Server op Cloudflare aanmaken» is wat er een aanmaakt. Niets aanvinken is ook een antwoord en wordt gerespecteerd: de plug-in blijft aan en draagt nergens heen.
    options:
      cloudflare: Je eigen server op Cloudflare
  worker_url:
    label: URL van je server op Cloudflare
    help: "«3. Server op Cloudflare aanmaken» vult dit in bij het aanmaken van de server. Je hoeft niets te typen."
  auth_token:
    label: API-token waarmee de server schrijfacties aanneemt
    help: "«3. Server op Cloudflare aanmaken» genereert dit. Je hoeft niets te typen."
  encryption_key:
    label: Sleutel waarmee je taken versleuteld worden
    help: "«3. Server op Cloudflare aanmaken» genereert deze. Je hoeft niets te typen — de telefoon krijgt hem via de QR, nooit via het netwerk."
settings:
  actions:
    app:
      label: 1. App op de telefoon zetten
    token:
      label: 2. Cloudflare-API-token halen
    setup:
      label: 3. Server op Cloudflare aanmaken
      ask:
        api_token: Cloudflare-API-token
    qr:
      label: 4. Telefoon koppelen
    phones:
      label: 5. Kijken of er een telefoon is
    revoke:
      label: 6. Koppeling ongedaan maken
    repair:
      label: "7. Kopie op de telefoon herstellen"
