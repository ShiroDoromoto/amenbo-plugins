desc: Lees je takenlijst op je telefoon, vanaf een plek die van jou is
about: |
  Je takenlijst komt op je telefoon aan, en de app Amenbo Viewer leest hem daar — de taken, de stand van elk ervan en de beslissingen erachter — terwijl je weg bent van de computer.

  Er wordt niets voor je gehost. De plek is van jou: een app-eigen iCloud-map op een Mac, of een Cloudflare Worker met database die `setup` in je eigen Cloudflare-account neerzet. Records reizen één kant op, en alleen voor zover ze bewegen.

  Over de route van Cloudflare reizen ze verzegeld. `qr` koppelt een telefoon buiten het netwerk om — de camera leest het adres, het token en de sleutel. `phones` zegt welke telefoons mogen lezen, en `revoke` snijdt er één af.

  Aanzetten draagt elk project op deze machine mee: een telefoon is één apparaat, niet één project.
config:
  routes:
    label: Waarheen dragen
    help: |-
      Waarheen dit mag dragen. Plaatsen kunnen hier alleen weg: een plaats die je aanvinkt moet nog steeds bestaan voordat er iets aankomt — de iCloud-map verschijnt zodra je Amenbo Viewer een keer op een telefoon hebt geopend (de knop “App op de telefoon zetten” zet de App Store-pagina ervan op een code), en die bij Cloudflare zet setup neer. Niets aanvinken is ook een antwoord en wordt gerespecteerd: de plug-in blijft aan en draagt nergens heen.
    options:
      icloud: De eigen iCloud-map van de app
      cloudflare: Je eigen Cloudflare Worker
  worker_url:
    label: URL van je eigen Cloudflare Worker
    help: "setup vult dit in bij het opzetten van de Worker. Je hoeft niets te typen."
  auth_token:
    label: Token waarmee de Worker schrijfacties toelaat
    help: "setup genereert dit. Je hoeft niets te typen."
  encryption_key:
    label: Sleutel waarmee de records versleuteld worden
    help: "setup genereert deze. Je hoeft niets te typen — de telefoon krijgt hem via de QR, nooit via het netwerk."
settings:
  actions:
    app:
      label: 1. App op de telefoon zetten
    token:
      label: 2. Cloudflare-API-token halen
    setup:
      label: 3. Cloudflare-route opzetten
      ask:
        api_token: Cloudflare-API-token
    qr:
      label: 4. Telefoon koppelen
      ask:
        label: Naam voor deze telefoon
