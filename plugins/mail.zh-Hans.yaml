desc: 用邮件报告 AI 做了什么
about: |
  你不在的时候，AI 在项目里做了什么，都用邮件告诉你。

  只报告 AI 写下的改动：你自己做的改动，你当时就在场。到期这件事不是谁写下的，而且它来的时候没人在看，
  所以也一并报告。哪些事件值得发一封邮件，由你从 Amenbo 触发的 13 种里勾选。

  接连发生的事件会合成一封邮件，而不是十几封；同一个项目发出的邮件会归到同一个会话。发往哪里是这个项目
  自己的设置，所以两个项目可以报告到两个邮箱。

  用你现有的任何 SMTP 服务器即可。中间没有别的服务，插件自身也不存放任何地址，邮件从你自己的账号发出。

  使用 Gmail 时，需要先生成应用专用密码：
  https://github.com/ShiroDoromoto/amenbo-plugin-mail#gmail
config:
  smtp_host:
    label: SMTP 服务器
    help: |-
      把邮件交给它发出的服务器。你的服务商会公布，通常写在“SMTP”或“发件服务器”下面。
  smtp_port:
    label: 端口
    help: |-
      587 是几乎所有服务商都在监听的投递端口。只有当你的服务商指明别的端口时才需要改。
  smtp_user:
    label: 账号
    help: |-
      用来认证的账号，要写完整：是整个地址，不是 @ 前面那一段。若发往不要求认证的中继，就和密码一起留空。
  smtp_password:
    label: 密码
    help: |-
      该账号允许程序使用的密码，未必是你登录时用的那一个。Gmail 不接受本人密码：请开启两步验证，创建应用专用密码，把十六个字符连着输入——屏幕上显示的空格并不属于密码。
  from:
    label: 发件人
    help: |-
      邮件的发件地址。留空就是该账号，服务商能接受的也正是它——大多数会拒收自称来自他人的邮件。没有账号时就没有可退回的值，这时请填写。
  to:
    label: 收件人
    help: |-
      邮件发往哪里。留空就发往该账号，没有账号时必须填写。多个地址写在同一行，用逗号分隔。
  events:
    label: 报告哪些事
    help: |-
      Amenbo 会触发、而本插件能报告的全部事件。就写入而言，无论勾选哪些，报告的都只是 AI 的写入——你自己动手的那些，你当时就在场。最后两项不是写入：Amenbo 每天提醒一次，哪个任务已经到期，哪个任务明天到期。它们不是谁写下的，所以不会被筛掉。一个都不勾也是一种回答：插件保持启用，什么都不报告。
    options:
      task.created: 任务被创建
      task.status_changed: 任务状态变更
      task.done: 任务完成
      task.rejected: 任务被否决
      task.assigned: 任务负责人变更
      task.moved: 任务移到其他项目
      task.deleted: 任务被删除
      decision.accepted: 决定被采纳
      decision.rejected: 决定被否决
      comment.added: 评论被添加
      comment.removed: 评论被撤回
      task.due: 任务今天到期或已逾期
      task.due_tomorrow: 任务明天到期
