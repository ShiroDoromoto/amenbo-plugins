desc: Повідомляти в канал Slack про те, що зробив ваш ШІ
about: |
  Кожне завдання, яке завершив ваш ШІ, кожне, яке він вирішив не робити, кожне прийняте рішення — рядок приходить у канал Slack. Те, що відбувалося, поки вас не було в проєкті, читається там, куди ви й так дивитеся.

  - **Публікується те, що пише ШІ, — і дні, яких ніхто не писав.** При тому, що написали ви самі, ви були присутні; у каналі лишається робота, зроблена без вас.
  - **Канал — це і є налаштування.** `webhook_url` належить проєкту, у якому його записано, тож це значення і *є* канал, куди проєкт звітує. Два проєкти з двома вебхуками звітують у два канали; кожне повідомлення називає свій проєкт, тож і спільний канал читається.
  - **Які події — обираєте ви.** Тринадцять на вибір: від створення завдання до настання терміну. Типово шість: завдання створено, змінило статус, завершено, відхилено, термін настав або настане завтра.

  Від Slack потрібна лише одна URL-адреса Incoming Webhook, і вона зберігається як таємне налаштування — вона не покидає Amenbo ні в експорті, ні в журналі, ні при зворотному читанні. Повідомлення пишуться мовою, якою ви читаєте Amenbo, і звуть ШІ тим іменем, яке ви йому дали.
config:
  webhook_url:
    label: URL вебхука Slack
    help: |-
      Цю адресу створює Slack, а не Amenbo, і вона ж і є каналом: вебхук для не того каналу звітує не в ту кімнату, хоча решта налаштована правильно.
      Створіть застосунок у робочому просторі, який має чути про цей проєкт, увімкніть Incoming Webhooks, додайте один для потрібного каналу та скопіюйте видану URL-адресу.
      Вона зберігається як таємне налаштування — не покидає Amenbo ні в експорті, ні в журналі, ні при зворотному читанні.
  events:
    label: Про що повідомляти
    help: |-
      Не позначити нічого — теж відповідь, і вона враховується: плагін лишається увімкненим і нічого не повідомляє. Очищення повертає шість типових подій.
    options:
      task.created: Завдання створено
      task.status_changed: Статус завдання змінився
      task.done: Завдання завершено
      task.rejected: Завдання вирішили не робити
      task.assigned: Для завдання призначено відповідального
      task.moved: Завдання переміщено до іншого проєкту
      task.deleted: Завдання видалено
      decision.accepted: Рішення прийнято
      decision.rejected: Рішення відхилено
      comment.added: Додано коментар
      comment.removed: Коментар відкликано
      task.due: Термін завдання настав сьогодні або вже минув
      task.due_tomorrow: Термін завдання настає завтра
settings:
  actions:
    config test:
      label: Надіслати тест
