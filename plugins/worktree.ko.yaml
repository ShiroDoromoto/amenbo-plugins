desc: 작업마다 별도의 git worktree로 분리한다
about: |
  작업마다 전용 체크아웃을 갖는다. `start` 는 새 브랜치 `task/<id>` 위에 git worktree 를 잘라 주고, `finish` 는 작업이 병합된 뒤 둘 다 걷어낸다.

  ```
  <repo>/../<repo-name>-worktrees/<id>/    브랜치 task/<id>
  ```

  체크아웃은 저장소 **밖**에 놓인다. amenbo 에 묶이지 않은 순수한 개발 환경이라, 프로젝트의 일부로 오해할 여지가 없다. 구현 세션을 몇 개 동시에 돌려도 부딪히지 않는다 — 한 작업에 하나의 체크아웃, 하나의 브랜치.

  ```sh
  eval "$(amenbo plugin run worktree start 123)"   # PowerShell 은 iex (…)
  # …작업, 커밋, 병합…
  amenbo plugin run worktree finish 123
  ```

  `start` 가 돌려주는 것은 `cd` 한 줄 그 자체라서, worktree 로 들어가는 것은 지금 서 있는 셸이다. `finish` 는 메인 저장소에서 실행한다. 체크아웃이 더럽거나 기준 브랜치에 없는 변경을 브랜치가 안고 있으면 거절한다(`--force` 로 밀어붙일 수 있다). 재는 것은 커밋이 아니라 변경 자체라서, squash 나 rebase 로 들어간 것도 보통의 병합과 똑같이 들어간 것으로 읽는다. `--base` 를 주지 않으면 둘 다 저장소가 서 있는 브랜치를 기준으로 삼으므로, 미리 채워 둘 것이 없다.

  작업을 예약하면 플러그인은 stderr 에 제안 한 줄을 쓴다. 그뿐이다 — *이* 작업에 전용 체크아웃이 필요한지는 판단이고, 그 판단은 제안을 읽는 쪽에 남는다. 백로그도 amenbo 가 그대로 쥔다. 이 플러그인이 작업을 읽는 것은 어디서 작업되는지 보기 위해서뿐이고, 쓰는 것은 git 뿐이다.

  git 2.31 이상이 필요하다.
