desc: Zgłaszać na kanale Slack to, co zrobiła Twoja SI
about: |
  Każde zadanie, które twoja SI ukończy, każde, którego postanowi nie robić, każda przyjęta decyzja, każde zadanie, którego termin nadszedł — wiersz trafia na kanał Slacka. To, co działo się, gdy nie było cię przy projekcie, czytasz tam, gdzie i tak zaglądasz.

  - **Publikowane jest tylko to, co pisze SI — i dni, których nikt nie zapisał.** Przy tym, co napisałeś sam, byłeś obecny; na kanale zostaje praca wykonana bez ciebie. Nadejście terminu nie jest niczyim zapisem i przychodzi, gdy nikt nie patrzy, więc też trafia na kanał.
  - **Kanał to właśnie to ustawienie.** `webhook_url` należy do projektu, w którym został zapisany, więc ta wartość *jest* kanałem, na który ten projekt raportuje. Dwa projekty z dwoma webhookami raportują na dwa kanały; każda wiadomość nazywa swój projekt, więc wspólny kanał też się czyta.
  - **Które zdarzenia — wybierasz ty.** Trzynaście do zaznaczenia, od utworzenia zadania po nadejście terminu. Domyślnie sześć: zadanie utworzone, zmieniony status, ukończone, odrzucone, termin nadszedł lub jest jutro.

  Slack musi wydać tylko jeden adres Incoming Webhook, a ten jest trzymany jako tajne ustawienie — nie opuszcza Amenbo ani w eksporcie, ani w dzienniku, ani przy odczycie zwrotnym. Wiadomości są pisane w języku, w którym czytasz Amenbo, i nazywają twoją SI imieniem, które jej nadałeś.
config:
  webhook_url:
    label: Adres URL webhooka Slacka
    help: |-
      Ten adres tworzy Slack, nie Amenbo, i to on jest kanałem: webhook wystawiony na zły kanał raportuje do złego pokoju, choć poza tym wszystko jest ustawione dobrze.
      Utwórz aplikację w przestrzeni, która ma słyszeć o tym projekcie, włącz Incoming Webhooks, dodaj jeden do wybranego kanału i skopiuj zwrócony adres.
      Jest trzymany jako tajne ustawienie — nie opuszcza Amenbo ani w eksporcie, ani w dzienniku, ani przy odczycie zwrotnym.
  events:
    label: Co zgłaszać
    help: |-
      Niezaznaczenie niczego też jest odpowiedzią i jest respektowane: wtyczka pozostaje włączona i nic nie zgłasza. Wyczyszczenie przywraca sześć domyślnych.
    options:
      task.created: Utworzono zadanie
      task.status_changed: Zmienił się status zadania
      task.done: Ukończono zadanie
      task.rejected: Odrzucono zadanie
      task.assigned: Przypisano zadanie
      task.moved: Zadanie trafiło do innego projektu
      task.deleted: Usunięto zadanie
      decision.accepted: Przyjęto decyzję
      decision.rejected: Odrzucono decyzję
      comment.added: Dodano komentarz
      comment.removed: Wycofano komentarz
      task.due: Termin zadania jest dziś albo już minął
      task.due_tomorrow: Termin zadania przypada jutro
