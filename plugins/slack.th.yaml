desc: รายงานสิ่งที่ AI ของคุณทำไปยังช่อง Slack
about: |
  ทุกงานที่ AI ของคุณทำเสร็จ ทุกงานที่มันตัดสินใจไม่ทำ และทุกการตัดสินใจที่มันรับ จะมาถึงแชนเนล Slack เป็นบรรทัดเดียว อ่านได้ว่าเกิดอะไรขึ้นตอนคุณไม่ได้อยู่กับโปรเจกต์

  - **ส่งเฉพาะสิ่งที่ AI เขียน** สิ่งที่คุณลงมือเองคุณก็อยู่ตรงนั้นแล้ว แชนเนลจึงเหลือแต่งานที่เดินไปโดยไม่มีคุณ
  - **แชนเนลก็คือค่าตั้งนั้นเอง** `webhook_url` เป็นของโปรเจกต์ที่เขียนมันลงไป ค่านั้นจึง *คือ* แชนเนลที่โปรเจกต์นั้นรายงานไป แต่ละโปรเจกต์ตอบเอง และทุกข้อความบอกว่ามาจากโปรเจกต์ไหน
  - **จะรายงานเรื่องใด คุณเลือกเอง** มีสิบเอ็ดอย่างให้ติ๊ก ค่าเริ่มต้นคือ งานถูกสร้าง เปลี่ยนสถานะ เสร็จ และตีตก

  ฝั่ง Slack ต้องการเพียง URL ของ Incoming Webhook เส้นเดียว และเก็บเป็นค่าตั้งลับ ไม่หลุดออกจาก amenbo ข้อความเขียนด้วยภาษาที่คุณอ่าน amenbo และเรียก AI ด้วยชื่อที่คุณตั้งให้
config:
  webhook_url:
    label: URL ของ Slack webhook
    help: |-
      URL นี้ Slack เป็นคนสร้าง ไม่ใช่ amenbo และตัว URL ก็คือแชนเนล ถ้าเลือกแชนเนลผิด ต่อให้อย่างอื่นถูกหมดก็ไปลงห้องผิดอยู่ดี
      ที่ api.slack.com/apps ให้สร้างแอปในเวิร์กสเปซที่ควรได้ยินเรื่องโปรเจกต์นี้ เปิด Incoming Webhooks เพิ่มหนึ่งเส้นให้แชนเนลที่ต้องการ แล้วคัดลอก URL ที่ได้กลับมา
      เก็บเป็นค่าตั้งลับ จึงไม่หลุดออกจาก amenbo ทั้งทางการส่งออก บันทึก และการอ่านย้อน
  events:
    label: จะรายงานอะไรบ้าง
    help: |-
      ไม่ติ๊กเลยก็นับเป็นคำตอบและถูกทำตาม ปลั๊กอินยังเปิดอยู่แต่ไม่รายงานอะไร ล้างค่าแล้วจะกลับไปเป็นสี่อย่างเริ่มต้น
    options:
      task.created: มีการสร้างงาน
      task.status_changed: สถานะของงานเปลี่ยน
      task.done: งานเสร็จแล้ว
      task.rejected: ตัดสินใจไม่ทำงานนั้น
      task.assigned: มีการมอบหมายงาน
      task.moved: งานย้ายไปโปรเจกต์อื่น
      task.deleted: มีการลบงาน
      decision.accepted: การตัดสินใจถูกรับไว้
      decision.rejected: การตัดสินใจถูกตีตก
      comment.added: มีการเพิ่มความเห็น
      comment.removed: มีการถอนความเห็น
