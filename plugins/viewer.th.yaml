desc: อ่านงานของคุณบนมือถือ จากเซิร์ฟเวอร์ที่เป็นของคุณเอง
about: |
  ระหว่างที่คุณอยู่ห่างจากคอมพิวเตอร์ งานจะไปถึงมือถือ และแอป Amenbo Viewer อ่านมันที่นั่น — ทั้งตัวงาน สถานะของแต่ละงาน และเหตุผลที่ตัดสินใจไว้

  ไม่มีใครโฮสต์ให้คุณ เซิร์ฟเวอร์เป็นของคุณเอง: คือเซิร์ฟเวอร์และฐานข้อมูลที่ «3. เซิร์ฟเวอร์» สร้างขึ้นในบัญชี Cloudflare ของคุณเอง งานเดินทางไปทางเดียว และไปเฉพาะส่วนที่เปลี่ยน

  งานเดินทางแบบผนึกไว้ «4. จับคู่มือถือ» จับคู่มือถือโดยไม่ผ่านเครือข่าย — กล้องอ่าน URL ของเซิร์ฟเวอร์ โทเคน API สำหรับอ่าน และกุญแจเข้ารหัส การจับคู่มีได้ครั้งละหนึ่ง «5. ดูการจับคู่» บอกว่ามีอยู่ไหม «6. เลิกจับคู่» เอาออก และการจับคู่ใหม่จะแทนที่ของเดิม

  เมื่อเปิดใช้ มันจะพาทุกโปรเจกต์บนเครื่องนี้ไปด้วย: มือถือคืออุปกรณ์หนึ่งเครื่อง ไม่ใช่โปรเจกต์หนึ่งโปรเจกต์
config:
  routes:
    label: จะส่งไปที่ไหน
    help: |-
      จะส่งไปยังเซิร์ฟเวอร์ของคุณบน Cloudflare ได้หรือไม่ ที่นี่ทำได้เพียงตัดออก ต่อให้ติ๊กไว้ เซิร์ฟเวอร์ก็ยังต้องมีอยู่จริงก่อนจึงจะมีอะไรไปถึง และผู้ที่สร้างขึ้นคือ «3. เซิร์ฟเวอร์» ไม่ติ๊กเลยก็นับเป็นคำตอบและถูกทำตาม ปลั๊กอินยังเปิดอยู่แต่ไม่ส่งไปที่ใดเลย
    options:
      cloudflare: เซิร์ฟเวอร์ของคุณเองบน Cloudflare
  worker_url:
    label: URL ของเซิร์ฟเวอร์ของคุณบน Cloudflare
    help: "«3. เซิร์ฟเวอร์» เติมให้เมื่อสร้างเซิร์ฟเวอร์ขึ้นมา ไม่มีอะไรต้องพิมพ์"
  auth_token:
    label: โทเคน API ที่เซิร์ฟเวอร์ใช้รับการเขียน
    help: "«3. เซิร์ฟเวอร์» สร้างขึ้นให้ ไม่มีอะไรต้องพิมพ์"
  encryption_key:
    label: กุญแจที่ใช้เข้ารหัสงานของคุณ
    help: "«3. เซิร์ฟเวอร์» สร้างขึ้นให้ ไม่มีอะไรต้องพิมพ์ — โทรศัพท์รับผ่าน QR ไม่เคยผ่านเครือข่าย"
settings:
  actions:
    app:
      label: 1. ดาวน์โหลดแอป
    token:
      label: 2. รับโทเคน API
    setup:
      label: 3. เซิร์ฟเวอร์
      ask:
        api_token: โทเคน API ของ Cloudflare
    qr:
      label: 4. จับคู่มือถือ
    phones:
      label: 5. ดูการจับคู่
    revoke:
      label: 6. เลิกจับคู่
    repair:
      label: "7. ซ่อมข้อมูล"
