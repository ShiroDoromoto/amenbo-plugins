desc: อ่านรายการงานของคุณบนมือถือ จากที่ที่เป็นของคุณเอง
about: |
  ระหว่างที่คุณอยู่ห่างจากคอมพิวเตอร์ รายการงานจะไปถึงมือถือ และแอป Amenbo Viewer อ่านมันที่นั่น — ทั้งตัวงาน สถานะของแต่ละงาน และเหตุผลที่ตัดสินใจไว้

  ไม่มีใครโฮสต์ให้คุณ ที่เก็บเป็นของคุณเอง: บน Mac คือโฟลเดอร์ iCloud เฉพาะของแอป ไม่เช่นนั้นก็คือ Cloudflare Worker และฐานข้อมูลที่ `setup` ตั้งขึ้นในบัญชี Cloudflare ของคุณเอง ระเบียนเดินทางไปทางเดียว และไปเฉพาะส่วนที่เปลี่ยน

  บนเส้นทาง Cloudflare ระเบียนเดินทางแบบผนึกไว้ `qr` จับคู่มือถือโดยไม่ผ่านเครือข่าย — กล้องอ่านที่อยู่ โทเคน และกุญแจ `phones` บอกว่ามือถือเครื่องใดอ่านได้ และ `revoke` ตัดเครื่องหนึ่งออก

  เมื่อเปิดใช้ มันจะพาทุกโปรเจกต์บนเครื่องนี้ไปด้วย: มือถือคืออุปกรณ์หนึ่งเครื่อง ไม่ใช่โปรเจกต์หนึ่งโปรเจกต์
config:
  routes:
    label: จะส่งไปที่ใดบ้าง
    help: |-
      ที่เก็บที่ส่งไปได้ ที่นี่ทำได้เพียงตัดออก ที่เก็บที่คุณติ๊กไว้ก็ยังต้องมีอยู่จริงก่อนจึงจะมีอะไรไปถึง — โฟลเดอร์ iCloud จะปรากฏเมื่อคุณเปิดแอป Amenbo Viewer บนมือถือสักครั้ง (ปุ่ม “ดาวน์โหลดแอป” จะวางหน้า App Store ของแอปไว้บนโค้ด) ส่วนที่เก็บฝั่ง Cloudflare นั้น setup เป็นผู้ตั้งขึ้น ไม่ติ๊กเลยก็นับเป็นคำตอบและถูกทำตาม ปลั๊กอินยังเปิดอยู่แต่ไม่ส่งไปที่ใดเลย
    options:
      icloud: โฟลเดอร์ iCloud เฉพาะของแอป
      cloudflare: Cloudflare Worker ของคุณเอง
  worker_url:
    label: URL ของ Cloudflare Worker ของคุณเอง
    help: "setup เติมให้เมื่อสร้าง Worker ขึ้นมา ไม่มีอะไรต้องพิมพ์"
  auth_token:
    label: โทเคนที่ Worker ใช้อนุญาตการเขียน
    help: "setup สร้างขึ้นให้ ไม่มีอะไรต้องพิมพ์"
  encryption_key:
    label: กุญแจที่ใช้เข้ารหัสระเบียน
    help: "setup สร้างขึ้นให้ ไม่มีอะไรต้องพิมพ์ — โทรศัพท์รับผ่าน QR ไม่เคยผ่านเครือข่าย"
settings:
  actions:
    app:
      label: 1. ดาวน์โหลดแอป
    token:
      label: 2. รับโทเคน API
    setup:
      label: 3. ตั้งค่า Cloudflare
      ask:
        api_token: โทเคน API ของ Cloudflare
    qr:
      label: 4. จับคู่มือถือ
      ask:
        label: ชื่อมือถือนี้
