desc: Signaler dans un canal Slack ce que votre IA a fait
about: |
  Chaque tâche que votre IA termine, chaque tâche qu'elle décide de ne pas faire, chaque décision qu'elle accepte : la ligne arrive dans un canal Slack. Ce qui s'est passé pendant que vous étiez loin du projet, là où vous regardez déjà.

  - **Seules les écritures de l'IA sont publiées.** Ce que vous avez écrit vous-même, vous y étiez ; le canal garde le travail fait sans vous.
  - **Le canal, c'est le réglage.** `webhook_url` appartient au projet où elle a été écrite : cette valeur *est* le canal auquel ce projet rend compte. Deux projets avec deux webhooks rendent compte dans deux canaux ; chaque message nomme son projet, donc les pointer tous les deux vers un même canal se lit aussi.
  - **Quels événements, c'est vous qui choisissez.** Onze à cocher, de la création d'une tâche au retrait d'un commentaire. Par défaut, les quatre qui disent qu'une tâche a été créée, a changé d'état, a été terminée ou abandonnée.

  Slack n'a qu'une seule URL d'Incoming Webhook à fournir, et elle est gardée comme un réglage secret : elle ne quitte amenbo ni dans un export, ni dans un journal, ni dans une relecture. Les messages sont écrits dans la langue où vous lisez amenbo et appellent votre IA par le nom que vous lui avez donné.
config:
  webhook_url:
    label: URL du webhook Slack
    help: |-
      Cette URL vient de Slack, pas d'amenbo, et elle est le canal : un webhook créé pour le mauvais canal publie dans la mauvaise pièce sans que rien d'autre soit mal réglé.
      Sur api.slack.com/apps, créez une app dans l'espace de travail qui doit entendre parler de ce projet, activez Incoming Webhooks, ajoutez-en un au canal visé et copiez l'URL renvoyée.
      Elle est gardée comme un réglage secret : elle ne quitte amenbo ni dans un export, ni dans un journal, ni dans une relecture.
  events:
    label: Ce qui est signalé
    help: |-
      Ne rien cocher est aussi une réponse, et elle est respectée : le plugin reste activé et ne signale rien. Vider ce réglage remet les quatre par défaut.
    options:
      task.created: Une tâche a été créée
      task.status_changed: L'état d'une tâche a changé
      task.done: Une tâche a été terminée
      task.rejected: Une tâche a été écartée
      task.assigned: Une tâche a été affectée
      task.moved: Une tâche a été déplacée vers un autre projet
      task.deleted: Une tâche a été supprimée
      decision.accepted: Une décision a été acceptée
      decision.rejected: Une décision a été rejetée
      comment.added: Un commentaire a été ajouté
      comment.removed: Un commentaire a été retiré
settings:
  actions:
    config test:
      label: Envoyer un test
