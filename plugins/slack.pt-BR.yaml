desc: Informar em um canal do Slack o que a sua IA fez
about: |
  Cada tarefa que sua IA conclui, cada uma que ela decide não fazer, cada decisão que ela aceita: a linha chega a um canal do Slack. O que aconteceu enquanto você estava longe do projeto, na sala que você já acompanha.

  - **Só o que a IA escreve é publicado.** O que você mesmo escreveu você presenciou; no canal fica o trabalho que aconteceu sem você.
  - **O canal é a configuração.** `webhook_url` pertence ao projeto em que foi escrita, então esse valor *é* o canal para o qual aquele projeto reporta. Dois projetos com dois webhooks reportam a dois canais; cada mensagem diz de qual projeto veio, então apontar os dois para um só canal também se lê.
  - **Quais eventos, você escolhe.** Onze para marcar, de uma tarefa criada a um comentário retirado. O padrão são os quatro que dizem que uma tarefa foi criada, mudou de estado, foi concluída ou foi descartada.

  Do Slack só é preciso uma URL de Incoming Webhook, guardada como configuração secreta — ela não sai do amenbo nem em uma exportação, nem em um log, nem em uma releitura. As mensagens são escritas no idioma em que você lê o amenbo e chamam sua IA pelo nome que você deu a ela.
config:
  webhook_url:
    label: URL do webhook do Slack
    help: |-
      Esta URL quem faz é o Slack, não o amenbo, e ela é o canal: um webhook do canal errado publica na sala errada sem que mais nada esteja mal configurado.
      Em api.slack.com/apps, crie um app no workspace que deve saber deste projeto, ative Incoming Webhooks, adicione um ao canal desejado e copie a URL devolvida.
      Ela é guardada como configuração secreta — não sai do amenbo nem em uma exportação, nem em um log, nem em uma releitura.
  events:
    label: O que informar
    help: |-
      Não marcar nada também é uma resposta e é respeitada: o plugin continua ativo e não informa nada. Esvaziar devolve os quatro padrões.
    options:
      task.created: Uma tarefa foi criada
      task.status_changed: O status de uma tarefa mudou
      task.done: Uma tarefa foi concluída
      task.rejected: Uma tarefa foi recusada
      task.assigned: Uma tarefa foi atribuída
      task.moved: Uma tarefa foi movida para outro projeto
      task.deleted: Uma tarefa foi excluída
      decision.accepted: Uma decisão foi aceita
      decision.rejected: Uma decisão foi recusada
      comment.added: Um comentário foi adicionado
      comment.removed: Um comentário foi retirado
