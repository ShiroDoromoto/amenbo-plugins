desc: Повідомляє поштою, що зробив ваш ШІ
about: |
  Отримуйте поштою те, що ШІ зробив у проєкті, поки вас там не було.

  Повідомляється лише про записи самого ШІ: при вашій власній зміні ви й так були поруч.
  Які події варті листа, обираєте ви — з одинадцяти, які подає Amenbo.

  Сплеск подій приходить одним листом, а не дюжиною, і всі листи одного проєкту потрапляють
  до одного ланцюжка. Куди вони йдуть — налаштування самого проєкту, тож два проєкти можуть
  писати до двох різних скриньок.

  Підійде будь-який SMTP-сервер, який у вас уже є. Жодної служби посередині немає, і сам
  плагін не зберігає жодної адреси: лист виходить через ваш обліковий запис.

  Користуєтеся Gmail? Знадобиться пароль застосунку:
  https://github.com/ShiroDoromoto/amenbo-plugin-mail#gmail
config:
  smtp_host:
    label: Сервер SMTP
    help: |-
      Сервер, якому передається лист. Ваш провайдер публікує його, зазвичай під назвою "SMTP" або «сервер вихідної пошти».
  smtp_port:
    label: Порт
    help: |-
      587 — порт надсилання, який слухає майже будь-який провайдер. Змінюйте його, лише якщо ваш називає інший.
  smtp_user:
    label: Обліковий запис
    help: |-
      Обліковий запис, під яким виконується вхід, записаний повністю — уся адреса, а не частина до @. Залиште його порожнім разом із паролем для ретранслятора, який не вимагає ні того, ні іншого.
  smtp_password:
    label: Пароль
    help: |-
      Пароль, який цей обліковий запис дозволяє програмі, — не завжди той, з яким входите ви. Gmail власний не приймає: увімкніть двоетапну перевірку, створіть пароль застосунку й уведіть його шістнадцять знаків поспіль — пробіли, які показує екран, до нього не належать.
  from:
    label: Відправник
    help: |-
      Адреса, з якої надходить лист. Залишена порожньою, вона дорівнює обліковому запису, і саме це провайдер прийме: більшість відхиляє лист, що видає себе за чужий. Без облікового запису відступати нікуди — тоді заповніть поле.
  to:
    label: Одержувач
    help: |-
      Куди надсилається лист. Залишене порожнім, воно йде на обліковий запис, а без нього поле доведеться заповнити. Кілька адрес пишуться в один рядок через кому.
  events:
    label: Про що повідомляти
    help: |-
      Усе, що Amenbo породжує і про що цей плагін може повідомити. Хоч би що ви позначили, повідомляється лише те, що записав ваш ШІ: там, де діяли ви самі, ви були присутні. Не позначити нічого — теж відповідь: плагін лишається увімкненим і ні про що не повідомляє.
    options:
      task.created: Задачу створено
      task.status_changed: Статус задачі змінено
      task.done: Задачу завершено
      task.rejected: Задачу відхилено
      task.assigned: Виконавця задачі змінено
      task.moved: Задачу перенесено до іншого проєкту
      task.deleted: Задачу видалено
      decision.accepted: Рішення ухвалено
      decision.rejected: Рішення відхилено
      comment.added: Додано коментар
      comment.removed: Коментар відкликано
