desc: Czytaj swoje zadania na telefonie, z serwera, który należy do ciebie
about: |
  Twoje zadania trafiają na telefon, a aplikacja Amenbo Viewer czyta je tam — zadania, stan każdego z nich i decyzje, które za nimi stoją — kiedy jesteś z dala od komputera.

  Nikt niczego dla ciebie nie hostuje. Serwer należy do ciebie: serwer wraz z bazą danych, który «3. Utwórz serwer w Cloudflare» tworzy na twoim własnym koncie Cloudflare. Zadania jadą w jedną stronę i tylko w takiej ilości, w jakiej się zmieniły.

  Jadą zapieczętowane. «4. Sparuj telefon» paruje telefon bez wychodzenia do sieci — aparat odczytuje adres URL serwera, token API do odczytu i klucz szyfrujący. «5. Zobacz sparowane telefony» mówi, które telefony mogą czytać, a «6. Odłącz telefon» odcina jeden z nich.

  Po włączeniu niesie każdy projekt z tej maszyny: telefon to jedno urządzenie, a nie jeden projekt.
config:
  routes:
    label: Dokąd wysyłać
    help: |-
      Czy to może wysyłać do twojego własnego serwera w Cloudflare. Miejsce da się tu tylko odjąć: zaznaczenie nie wystarczy — serwer i tak musi już istnieć, zanim cokolwiek do niego dotrze, a tworzy go «3. Utwórz serwer w Cloudflare». Niezaznaczenie niczego też jest odpowiedzią i jest respektowane: wtyczka pozostaje włączona i nigdzie nie wysyła.
    options:
      cloudflare: Twój własny serwer w Cloudflare
  worker_url:
    label: Adres URL twojego serwera w Cloudflare
    help: "«3. Utwórz serwer w Cloudflare» wpisuje to, gdy tworzy serwer. Nie ma tu nic do wpisania."
  auth_token:
    label: Token API, którym serwer przyjmuje zapisy
    help: "«3. Utwórz serwer w Cloudflare» to generuje. Nie ma tu nic do wpisania."
  encryption_key:
    label: Klucz, którym szyfrowane są twoje zadania
    help: "«3. Utwórz serwer w Cloudflare» go generuje. Nie ma tu nic do wpisania — telefon dostaje go z kodu QR, nigdy przez sieć."
settings:
  actions:
    app:
      label: 1. Zainstaluj aplikację na telefonie
    token:
      label: 2. Pobierz token API Cloudflare
    setup:
      label: 3. Utwórz serwer w Cloudflare
      ask:
        api_token: Token API Cloudflare
    qr:
      label: 4. Sparuj telefon
      ask:
        label: Nazwa tego telefonu
    phones:
      label: 5. Zobacz sparowane telefony
    revoke:
      label: 6. Odłącz telefon
      ask:
        phone: Nazwa telefonu do odłączenia
