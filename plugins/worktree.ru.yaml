desc: Изолирует каждую задачу в отдельном git worktree
about: |
  У каждой задачи своя рабочая копия: `start` вырезает ей git worktree на свежей ветке `task/<id>`, а `finish` убирает и то и другое, как только работа влита.

  ```
  <repo>/../<repo-name>-worktrees/<id>/    ветка task/<id>
  ```

  Копия лежит **вне** репозитория, поэтому это чистая среда разработки — ничто в ней не привязано к amenbo и не сойдёт за часть проекта. Несколько сессий идут разом, не сталкиваясь: одна задача, одна копия, одна ветка.

  ```sh
  eval "$(amenbo plugin run worktree start 123)"   # в PowerShell: iex (…)
  amenbo plugin run worktree finish 123
  ```

  `start` возвращает саму строку `cd`, так что в worktree входит та оболочка, в которой вы стоите. `finish` запускают из главного репозитория; он отказывает, пока копия грязная или ветка держит изменения, которых нет в базовой, — `--force` перешагнёт через оба отказа. Без `--base` обе команды берут ту ветку, на которой стоит репозиторий, так что заполнять заранее нечего.

  Резервирование задачи заставляет плагин написать одну подсказку в stderr, и только: нужна ли *этой* задаче своя копия — суждение, и оно остаётся за тем, кто подсказку читает. Бэклог тоже остаётся за amenbo: плагин читает задачу лишь затем, чтобы увидеть, где она делается, и пишет только git.

  Нужен git 2.31 или новее.
