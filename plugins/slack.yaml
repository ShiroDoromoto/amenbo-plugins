about: |
  Every task your AI finishes, every one it decides against, every decision it settles — the line arrives in a Slack channel. What happened while you were away from the project, in the room you already watch.

  - **Only your AI's writes are posted.** A write you made yourself is one you were there for, so the channel carries the work that happened without you rather than an echo of your own.
  - **The channel is the setting.** `webhook_url` belongs to the project it was written in, so that value *is* the channel that project reports to. Point two projects at two webhooks and they report to two channels; every message names its project, so pointing both at one channel reads too.
  - **Which events, you choose.** Eleven to tick, from a task being created to a comment being taken back. The default is the four that say a task was created, moved, finished, or dropped.

  All Slack has to hand over is one Incoming Webhook URL, and it is held as a secret setting — it never leaves amenbo into an export, a log, or a read-back. Messages are written in the language you read amenbo in, and call your AI by the name you gave it.

official: true
payload_v: 1
min_amenbo: 3.1.0
config:
  - key: webhook_url
    label: Slack webhook URL
    secret: true
    required: true
  - key: events
    label: What to report
    type: multi
    default: task.created,task.status_changed,task.done,task.rejected
    options:
      - value: task.created
        label: A task was created
      - value: task.status_changed
        label: A task's status moved
      - value: task.done
        label: A task was finished
      - value: task.rejected
        label: A task was decided against
      - value: task.assigned
        label: A task was assigned
      - value: task.moved
        label: A task moved to another project
      - value: task.deleted
        label: A task was deleted
      - value: decision.accepted
        label: A decision was accepted
      - value: decision.rejected
        label: A decision was rejected
      - value: comment.added
        label: A comment was added
      - value: comment.removed
        label: A comment was taken back
events:
  - task.created
  - task.status_changed
  - task.done
  - task.rejected
  - task.assigned
  - task.moved
  - task.deleted
  - decision.accepted
  - decision.rejected
  - comment.added
  - comment.removed
