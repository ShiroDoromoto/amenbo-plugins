desc: Lesen Sie Ihre Aufgabenliste auf dem Handy, von einem Ort, der Ihnen gehört
about: |
  Ihre Aufgabenliste erreicht Ihr Handy, und die App Amenbo Viewer liest sie dort — die Aufgaben, den Stand jeder einzelnen und die Entscheidungen dahinter — während Sie vom Rechner weg sind.

  Nichts wird für Sie gehostet. Der Ort gehört Ihnen: ein Cloudflare Worker samt Datenbank, den `setup` in Ihrem eigenen Cloudflare-Konto aufstellt. Einträge reisen in eine Richtung, und nur so, wie sie sich bewegen.

  Sie reisen versiegelt. `qr` koppelt ein Handy ohne Netz — die Kamera liest Adresse, Token und Schlüssel. `phones` sagt, welche Handys lesen dürfen, und `revoke` trennt eines davon ab.

  Eingeschaltet trägt es jedes Projekt dieses Rechners: ein Handy ist ein Gerät, kein Projekt.
config:
  routes:
    label: Wohin getragen wird
    help: |-
      Ob dies zu Ihrem Cloudflare Worker tragen darf. Der Ort lässt sich hier nur wegnehmen: angekreuzt muss der Worker trotzdem erst existieren, bevor ihn etwas erreicht, und aufgestellt wird er von setup. Nichts anzukreuzen ist auch eine Antwort und wird respektiert: Das Plugin bleibt eingeschaltet und trägt nirgendwohin.
    options:
      cloudflare: Ihr eigener Cloudflare Worker
  worker_url:
    label: URL Ihres eigenen Cloudflare Workers
    help: "setup trägt dies ein, wenn es den Worker aufsetzt. Sie müssen nichts eintippen."
  auth_token:
    label: Token, mit dem der Worker Schreibzugriffe zulässt
    help: "setup erzeugt dies. Sie müssen nichts eintippen."
  encryption_key:
    label: Schlüssel, mit dem die Einträge verschlüsselt werden
    help: "setup erzeugt dies. Sie müssen nichts eintippen — das Telefon bekommt ihn über den QR-Code, nie über das Netz."
settings:
  actions:
    app:
      label: 1. App aufs Telefon holen
    token:
      label: 2. Cloudflare-API-Token holen
    setup:
      label: 3. Cloudflare-Weg aufstellen
      ask:
        api_token: Cloudflare-API-Token
    qr:
      label: 4. Telefon koppeln
      ask:
        label: Name für dieses Telefon
