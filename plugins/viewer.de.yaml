desc: Lesen Sie Ihre Aufgaben auf dem Handy, von einem Server, der Ihnen gehört
about: |
  Ihre Aufgaben erreichen Ihr Handy, und die App Amenbo Viewer liest sie dort — die Aufgaben, den Stand jeder einzelnen und die Entscheidungen dahinter — während Sie vom Rechner weg sind.

  Nichts wird für Sie gehostet. Der Server gehört Ihnen: ein Server samt Datenbank, den „3. Server bei Cloudflare einrichten“ in Ihrem eigenen Cloudflare-Konto anlegt. Aufgaben reisen in eine Richtung, und nur so, wie sie sich bewegen.

  Sie reisen versiegelt. „4. Telefon koppeln“ koppelt ein Handy ohne Netz — die Kamera liest die URL des Servers, den API-Token zum Lesen und den Verschlüsselungsschlüssel. „5. Gekoppelte Telefone ansehen“ sagt, welche Handys lesen dürfen, und „6. Telefon entkoppeln“ trennt eines davon ab.

  Eingeschaltet trägt es jedes Projekt dieses Rechners: ein Handy ist ein Gerät, kein Projekt.
config:
  routes:
    label: Wohin getragen wird
    help: |-
      Ob dies zu Ihrem eigenen Server bei Cloudflare tragen darf. Der Ort lässt sich hier nur wegnehmen: angekreuzt muss der Server trotzdem erst existieren, bevor ihn etwas erreicht, und angelegt wird er von „3. Server bei Cloudflare einrichten“. Nichts anzukreuzen ist auch eine Antwort und wird respektiert: Das Plugin bleibt eingeschaltet und trägt nirgendwohin.
    options:
      cloudflare: Ihr eigener Server bei Cloudflare
  worker_url:
    label: URL Ihres Servers bei Cloudflare
    help: "„3. Server bei Cloudflare einrichten“ trägt dies ein, wenn es den Server anlegt. Sie müssen nichts eintippen."
  auth_token:
    label: API-Token, mit dem der Server Schreibzugriffe annimmt
    help: "„3. Server bei Cloudflare einrichten“ erzeugt dies. Sie müssen nichts eintippen."
  encryption_key:
    label: Schlüssel, mit dem Ihre Aufgaben verschlüsselt werden
    help: "„3. Server bei Cloudflare einrichten“ erzeugt dies. Sie müssen nichts eintippen — das Telefon bekommt ihn über den QR-Code, nie über das Netz."
settings:
  actions:
    app:
      label: 1. App aufs Telefon holen
    token:
      label: 2. Cloudflare-API-Token holen
    setup:
      label: 3. Server bei Cloudflare einrichten
      ask:
        api_token: Cloudflare-API-Token
    qr:
      label: 4. Telefon koppeln
      ask:
        label: Name für dieses Telefon
    phones:
      label: 5. Gekoppelte Telefone ansehen
    revoke:
      label: 6. Telefon entkoppeln
      ask:
        phone: Name des zu entkoppelnden Telefons
    repair:
      label: "7. Telefonkopie reparieren"
