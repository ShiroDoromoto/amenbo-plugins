desc: आपके AI ने जो किया, उसे Slack चैनल पर बताना
about: |
  आपका AI जो काम पूरा करता है, जिसे न करने का तय करता है, और जो निर्णय स्वीकार करता है — वह पंक्ति एक Slack चैनल में पहुँच जाती है। आप प्रोजेक्ट से दूर थे तब क्या हुआ, यह वहीं पढ़िए जहाँ आप वैसे भी देखते हैं।

  - **सिर्फ़ AI का लिखा, और वे दिन जो किसी ने नहीं लिखे।** जो आपने खुद लिखा, उसमें आप मौजूद थे; चैनल में वही काम बचता है जो आपके बिना आगे बढ़ा।
  - **चैनल ही वह सेटिंग है।** `webhook_url` उसी प्रोजेक्ट का है जिसमें लिखा गया, इसलिए वही मान *वह चैनल है* जिसे प्रोजेक्ट रिपोर्ट करता है। दो प्रोजेक्ट में दो webhook हों तो दो चैनल; हर संदेश अपना प्रोजेक्ट बताता है।
  - **कौन-सी घटनाएँ, यह आप चुनते हैं।** तेरह विकल्प; डिफ़ॉल्ट छह हैं: काम बना, स्थिति बदली, पूरा हुआ, छोड़ा गया, और समय-सीमा के दो।

  Slack से बस एक Incoming Webhook URL चाहिए, जो गुप्त सेटिंग की तरह रखा जाता है और Amenbo से बाहर नहीं जाता। संदेश उसी भाषा में लिखे जाते हैं जिसमें आप Amenbo पढ़ते हैं।
config:
  webhook_url:
    label: Slack वेबहुक URL
    help: |-
      यह URL Amenbo नहीं, Slack बनाता है, और वही URL चैनल है: ग़लत चैनल का webhook बाक़ी सब ठीक होने पर भी ग़लत कमरे में भेजेगा।
      उस वर्कस्पेस में एक ऐप बनाइए जिसे इस प्रोजेक्ट की ख़बर मिलनी चाहिए, Incoming Webhooks चालू कीजिए, जिस चैनल पर भेजना है उसके लिए एक जोड़िए, और लौटा हुआ URL कॉपी कीजिए।
      यह गुप्त सेटिंग की तरह रखा जाता है — निर्यात, लॉग या दोबारा पढ़ने में बाहर नहीं आता।
  events:
    label: क्या बताया जाए
    help: |-
      एक भी न चुनना भी एक जवाब है और वैसा ही माना जाता है: प्लगइन चालू रहता है और कुछ नहीं बताता। ख़ाली करने पर डिफ़ॉल्ट छह लौट आते हैं।
    options:
      task.created: कोई काम बनाया गया
      task.status_changed: किसी काम की स्थिति बदली
      task.done: कोई काम पूरा हुआ
      task.rejected: कोई काम न करने का तय हुआ
      task.assigned: कोई काम सौंपा गया
      task.moved: कोई काम दूसरे प्रोजेक्ट में गया
      task.deleted: कोई काम मिटाया गया
      decision.accepted: कोई निर्णय स्वीकार हुआ
      decision.rejected: कोई निर्णय अस्वीकार हुआ
      comment.added: कोई टिप्पणी जुड़ी
      comment.removed: कोई टिप्पणी वापस ली गई
      task.due: किसी काम की समय-सीमा आज है, या बीत चुकी है
      task.due_tomorrow: किसी काम की समय-सीमा कल है
