      task.moved: कोई काम दूसरे प्रोजेक्ट में गया
      task.deleted: कोई काम मिटाया गया
      decision.accepted: कोई निर्णय स्वीकार हुआ
      decision.rejected: कोई निर्णय अस्वीकार हुआ
      comment.added: कोई टिप्पणी जुड़ी
      comment.removed: कोई टिप्पणी वापस ली गई
