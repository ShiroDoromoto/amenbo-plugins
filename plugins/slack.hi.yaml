desc: आपके AI ने जो किया, उसे Slack चैनल पर बताना
about: |
  आपका AI जो काम पूरा करता है, जिसे न करने का तय करता है, और जो निर्णय स्वीकार करता है — वह पंक्ति एक Slack चैनल में पहुँच जाती है। आप प्रोजेक्ट से दूर थे तब क्या हुआ, यह वहीं पढ़िए जहाँ आप वैसे भी देखते हैं।

  - **सिर्फ़ AI का लिखा भेजा जाता है।** जो आपने खुद लिखा, उसमें आप मौजूद थे; चैनल में वही काम बचता है जो आपके बिना आगे बढ़ा।
  - **चैनल ही वह सेटिंग है।** `webhook_url` उसी प्रोजेक्ट का है जिसमें लिखा गया, इसलिए वही मान *वह चैनल है* जिसे प्रोजेक्ट रिपोर्ट करता है। दो प्रोजेक्ट में दो webhook हों तो दो चैनल; हर संदेश अपना प्रोजेक्ट बताता है।
  - **कौन-सी घटनाएँ, यह आप चुनते हैं।** ग्यारह विकल्प; डिफ़ॉल्ट चार हैं: काम बना, स्थिति बदली, पूरा हुआ, या छोड़ा गया।

  Slack से बस एक Incoming Webhook URL चाहिए, जो गुप्त सेटिंग की तरह रखा जाता है और amenbo से बाहर नहीं जाता। संदेश उसी भाषा में लिखे जाते हैं जिसमें आप amenbo पढ़ते हैं।
config:
  webhook_url:
    label: Slack वेबहुक URL
  events:
    label: क्या बताया जाए
    options:
