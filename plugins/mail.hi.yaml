desc: आपकी AI ने जो किया, उसकी खबर ईमेल से देता है
about: |
  आप जब प्रोजेक्ट से दूर थे, तब AI ने वहाँ क्या किया — यह ईमेल से मिल जाता है।

  खबर सिर्फ़ AI के लिखे की दी जाती है: जो बदलाव आपने खुद किया, उसमें आप मौजूद ही थे। किन
  घटनाओं पर ईमेल चाहिए, यह आप चुनते हैं — Amenbo जो ग्यारह भेजता है, उनमें से।

  एक साथ हुई कई घटनाएँ दर्जन भर ईमेल नहीं, एक ही ईमेल बनकर आती हैं, और एक प्रोजेक्ट की सारी
  ईमेल एक ही थ्रेड में जुड़ती रहती हैं। कहाँ भेजनी है, यह उसी प्रोजेक्ट की सेटिंग है, इसलिए दो
  प्रोजेक्ट दो अलग मेलबॉक्स को खबर दे सकते हैं।

  आपके पास पहले से जो भी SMTP सर्वर है, वही काफ़ी है। बीच में कोई सेवा नहीं आती और प्लगइन
  खुद कोई पता नहीं रखता: ईमेल आपके अपने खाते से निकलती है।

  Gmail इस्तेमाल करते हैं? तो ऐप पासवर्ड बनाना होगा:
  https://github.com/ShiroDoromoto/amenbo-plugin-mail#gmail
config:
  smtp_host:
    label: SMTP सर्वर
    help: |-
      वह सर्वर जिसे संदेश सौंपा जाता है। आपका प्रदाता इसे बताता है, आम तौर पर "SMTP" या "आउटगोइंग मेल" के नीचे।
  smtp_port:
    label: पोर्ट
    help: |-
      587 वह सबमिशन पोर्ट है जिस पर लगभग हर प्रदाता सुनता है। इसे तभी बदलें जब आपका प्रदाता कोई और बताए।
  smtp_user:
    label: खाता
    help: |-
      वह खाता जिससे प्रमाणीकरण होगा, पूरा लिखा हुआ — पूरा पता, @ से पहले वाला हिस्सा भर नहीं। जो रिले खाता और पासवर्ड दोनों नहीं माँगता, उसके लिए दोनों खाली छोड़ दें।
  smtp_password:
    label: पासवर्ड
    help: |-
      वह पासवर्ड जो यह खाता किसी प्रोग्राम को इस्तेमाल करने देता है — ज़रूरी नहीं कि वही हो जिससे आप साइन इन करते हैं। Gmail अपना वाला नहीं मानता: 2-चरणीय सत्यापन चालू करें, ऐप पासवर्ड बनाएँ और उसके सोलह अक्षर बिना जगह छोड़े डालें — स्क्रीन पर दिखने वाली खाली जगहें उसका हिस्सा नहीं हैं।
  from:
    label: भेजने वाला
    help: |-
      वह पता जिससे संदेश भेजा जाता है। खाली छोड़ने पर यह खाता ही होता है, और प्रदाता यही स्वीकार करेगा — ज़्यादातर ऐसा संदेश ठुकरा देते हैं जो किसी और का होने का दावा करे। खाता न हो तो लौटने को कुछ नहीं बचता, इसलिए इसे भरें।
  to:
    label: पाने वाला
    help: |-
      संदेश कहाँ भेजा जाए। खाली छोड़ने पर यह खाते पर जाता है, और खाता न हो तो इसे भरना ही होगा। कई पते एक ही पंक्ति में, कॉमा से अलग करके लिखें।
  events:
    label: किसकी खबर देनी है
    help: |-
      Amenbo जो कुछ भी चलाता है और यह प्लगइन बता सकता है, वह सब। आप जो भी चुनें, बताया सिर्फ़ वही जाता है जो आपके AI ने लिखा — जो आपने खुद किया, उसमें आप मौजूद थे। कुछ भी न चुनना भी एक जवाब है: प्लगइन चालू रहता है और कुछ नहीं बताता।
    options:
      task.created: टास्क बनाया गया
      task.status_changed: टास्क की स्थिति बदली
      task.done: टास्क पूरा हुआ
      task.rejected: टास्क छोड़ दिया गया
      task.assigned: टास्क किसी और को सौंपा गया
      task.moved: टास्क दूसरे प्रोजेक्ट में गया
      task.deleted: टास्क मिटाया गया
      decision.accepted: फ़ैसला स्वीकार हुआ
      decision.rejected: फ़ैसला अस्वीकार हुआ
      comment.added: टिप्पणी जोड़ी गई
      comment.removed: टिप्पणी वापस ली गई
