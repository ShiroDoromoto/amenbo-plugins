desc: Báo qua email những gì AI của bạn đã làm
about: |
  Nhận qua email những gì AI đã làm trong một dự án lúc bạn không ở đó.

  Chỉ những gì AI ghi mới được báo: thay đổi do chính bạn làm thì bạn đã có mặt rồi. Sự kiện
  nào đáng gửi một email là do bạn chọn, trong mười một sự kiện amenbo phát ra.

  Một loạt sự kiện đến trong một thư duy nhất thay vì cả chục thư, và mọi thư của cùng một
  dự án đều nằm chung một chuỗi hội thoại. Gửi đi đâu là thiết lập của riêng dự án đó, nên
  hai dự án có thể báo về hai hộp thư khác nhau.

  Máy chủ SMTP nào bạn đang có cũng dùng được. Không có dịch vụ nào chen vào giữa, và bản
  thân plugin không giữ địa chỉ nào: thư đi ra từ tài khoản của chính bạn.

  Dùng Gmail? Bạn sẽ cần một mật khẩu ứng dụng:
  https://github.com/ShiroDoromoto/amenbo-plugin-mail#gmail
config:
  smtp_host:
    label: "Máy chủ SMTP (Gmail: smtp.gmail.com)"
  smtp_port:
    label: Cổng
  smtp_user:
    label: "Tài khoản (Gmail: địa chỉ của bạn)"
  smtp_password:
    label: "Mật khẩu (Gmail: mật khẩu ứng dụng)"
  from:
    label: Người gửi (bỏ trống thì lấy địa chỉ tài khoản)
  to:
    label: Người nhận (bỏ trống thì lấy địa chỉ tài khoản; nhiều người cách nhau bằng dấu phẩy)
  events:
    label: Báo những gì
    options:
      task.created: Công việc được tạo
      task.status_changed: Trạng thái công việc thay đổi
      task.done: Công việc hoàn thành
      task.rejected: Công việc bị bác
      task.assigned: Người phụ trách công việc thay đổi
      task.moved: Công việc chuyển sang dự án khác
      task.deleted: Công việc bị xóa
      decision.accepted: Quyết định được chấp nhận
      decision.rejected: Quyết định bị bác bỏ
      comment.added: Bình luận được thêm
      comment.removed: Bình luận bị thu hồi
