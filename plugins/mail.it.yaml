desc: Segnala per e-mail quello che ha fatto la tua IA
about: |
  Ricevi per e-mail quello che la tua IA ha fatto in un progetto mentre eri altrove.

  Viene segnalato solo ciò che ha scritto l'IA: a una modifica fatta da te c'eri già tu.
  Una scadenza che arriva non è la scrittura di nessuno, e arriva quando nessuno guarda:
  perciò viene segnalata anche quella. Quali eventi meritano un'e-mail lo scegli tu, fra i
  tredici che Amenbo emette.

  Una raffica di eventi arriva in un solo messaggio invece che in una dozzina, e tutti i
  messaggi di un progetto finiscono nella stessa conversazione. Dove vengono spediti è
  un'impostazione del progetto stesso, così due progetti possono segnalare a due caselle.

  Va bene qualsiasi server SMTP che già hai. In mezzo non c'è nessun servizio e il plugin non
  conserva alcun indirizzo: l'e-mail parte dal tuo account.

  Usi Gmail? Ti servirà una password per le app:
  https://github.com/ShiroDoromoto/amenbo-plugin-mail#gmail
config:
  smtp_host:
    label: Server SMTP
    help: |-
      Il server a cui il messaggio viene consegnato. Il tuo provider lo pubblica, di solito sotto "SMTP" o "posta in uscita".
  smtp_port:
    label: Porta
    help: |-
      587 è la porta di invio su cui ascolta quasi ogni provider. Cambiala solo se il tuo ne indica un’altra.
  smtp_user:
    label: Account
    help: |-
      L’account con cui autenticarsi, scritto per intero — l’indirizzo completo, non la parte prima della @. Lascialo vuoto insieme alla password per un relay che non chiede né l’uno né l’altra.
  smtp_password:
    label: Password
    help: |-
      La password che quell’account concede a un programma, che non è sempre quella con cui accedi. Gmail rifiuta la propria: attiva la verifica in due passaggi, crea una password per le app e inserisci i suoi sedici caratteri di seguito — gli spazi mostrati sullo schermo non ne fanno parte.
  from:
    label: Mittente
    help: |-
      L’indirizzo da cui il messaggio parte. Lasciato vuoto è l’account, ed è ciò che un provider accetterà: quasi tutti rifiutano un messaggio che dice di venire da qualcun altro. Senza account non c’è nulla su cui ripiegare, quindi compilalo.
  to:
    label: Destinatario
    help: |-
      Dove il messaggio viene inviato. Lasciato vuoto va all’account, e senza account va compilato. Più indirizzi stanno sulla stessa riga, separati da virgole.
  events:
    label: Che cosa segnalare
    help: |-
      Tutto ciò che Amenbo emette e che questo plugin può segnalare. Fra le scritture, qualunque cosa spunti, viene segnalato solo ciò che ha scritto la tua IA — a quello che hai fatto tu eri presente. Gli ultimi due non sono scritture: una volta al giorno Amenbo segnala un’attività la cui scadenza è arrivata e una che scade domani. Non le ha scritte nessuno, quindi nulla le filtra. Non spuntare nulla è anch’essa una risposta: il plugin resta attivo e non segnala niente.
    options:
      task.created: Un'attività è stata creata
      task.status_changed: Lo stato di un'attività è cambiato
      task.done: Un'attività è stata completata
      task.rejected: Un'attività è stata scartata
      task.assigned: Un'attività è stata riassegnata
      task.moved: Un'attività è passata a un altro progetto
      task.deleted: Un'attività è stata eliminata
      decision.accepted: Una decisione è stata accettata
      decision.rejected: Una decisione è stata respinta
      comment.added: È stato aggiunto un commento
      comment.removed: È stato ritirato un commento
      task.due: Un'attività scade oggi o è già scaduta
      task.due_tomorrow: Un'attività scade domani
