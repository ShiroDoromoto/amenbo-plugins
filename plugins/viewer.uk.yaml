desc: Читайте свій список задач на телефоні — з місця, яке належить вам
about: |
  Список задач приходить на телефон, і застосунок Amenbo Viewer читає його там — задачі, стан кожної з них і рішення, що за ними стоять, — поки ви далеко від комп'ютера.

  Ніхто нічого для вас не хостить. Місце ваше: Cloudflare Worker із базою даних, який `setup` піднімає у вашому власному обліковому записі Cloudflare. Записи їдуть в один бік і лише в міру того, як змінюються.

  Вони їдуть запечатаними. `qr` пов'язує телефон поза мережею — камера зчитує адресу, токен і ключ. `phones` показує, які телефони можуть читати, а `revoke` відрізає один із них.

  Увімкнений, він несе всі проєкти цієї машини: телефон — це один пристрій, а не один проєкт.
config:
  routes:
    label: Куди доставляти
    help: |-
      Чи можна доставляти до вашого Cloudflare Worker. Звідси місце можна лише прибрати: позначки замало — Worker усе одно має існувати, перш ніж туди щось дійде, а піднімає його setup. Не позначити нічого — теж відповідь, і вона враховується: плагін лишається увімкненим і нікуди не доставляє.
    options:
      cloudflare: Ваш власний Cloudflare Worker
  worker_url:
    label: URL вашого власного Cloudflare Worker
    help: "setup вписує це, коли піднімає Worker. Вводити нічого не треба."
  auth_token:
    label: Токен, з яким Worker пропускає запис
    help: "setup створює це. Вводити нічого не треба."
  encryption_key:
    label: Ключ, яким шифруються записи
    help: "setup створює це. Вводити нічого не треба — на телефон він потрапляє через QR, а не мережею."
settings:
  actions:
    app:
      label: 1. Отримати застосунок
    token:
      label: 2. Отримати токен API
    setup:
      label: 3. Створити шлях Cloudflare
      ask:
        api_token: Токен API Cloudflare
    qr:
      label: 4. Підключити телефон
      ask:
        label: Назва цього телефона
