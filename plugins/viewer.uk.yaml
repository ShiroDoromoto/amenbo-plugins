desc: Читайте свої задачі на телефоні — із сервера, який належить вам
about: |
  Задачі приходять на телефон, і застосунок Amenbo Viewer читає їх там — задачі, стан кожної з них і рішення, що за ними стоять, — поки ви далеко від комп'ютера.

  Ніхто нічого для вас не хостить. Сервер ваш: сервер із базою даних, який «3. Створити сервер» створює у вашому власному обліковому записі Cloudflare. Задачі їдуть в один бік і лише в міру того, як змінюються.

  Вони їдуть запечатаними. «4. Підключити телефон» пов'язує телефон поза мережею — камера зчитує URL сервера, API-токен для читання і ключ шифрування. «5. Показати телефони» показує, які телефони можуть читати, а «6. Відключити телефон» відрізає один із них.

  Увімкнений, він несе всі проєкти цієї машини: телефон — це один пристрій, а не один проєкт.
config:
  routes:
    label: Куди доставляти
    help: |-
      Чи можна доставляти на ваш власний сервер у Cloudflare. Звідси місце можна лише прибрати: позначки замало — сервер усе одно має існувати, перш ніж туди щось дійде, а створює його «3. Створити сервер». Не позначити нічого — теж відповідь, і вона враховується: плагін лишається увімкненим і нікуди не доставляє.
    options:
      cloudflare: Ваш власний сервер у Cloudflare
  worker_url:
    label: URL вашого сервера у Cloudflare
    help: "«3. Створити сервер» вписує це, коли створює сервер. Вводити нічого не треба."
  auth_token:
    label: API-токен, з яким сервер приймає запис
    help: "«3. Створити сервер» створює це. Вводити нічого не треба."
  encryption_key:
    label: Ключ, яким шифруються ваші задачі
    help: "«3. Створити сервер» створює це. Вводити нічого не треба — на телефон він потрапляє через QR, а не мережею."
settings:
  actions:
    app:
      label: 1. Отримати застосунок
    token:
      label: 2. Отримати токен API
    setup:
      label: 3. Створити сервер
      ask:
        api_token: Токен API Cloudflare
    qr:
      label: 4. Підключити телефон
      ask:
        label: Назва цього телефона
    phones:
      label: 5. Показати телефони
    revoke:
      label: 6. Відключити телефон
      ask:
        phone: Назва телефона для відключення
