desc: Читайте свій список задач на телефоні — з місця, яке належить вам
about: |
  Список задач приходить на телефон, і застосунок Amenbo Viewer читає його там — задачі, стан кожної з них і рішення, що за ними стоять, — поки ви далеко від комп'ютера.

  Ніхто нічого для вас не хостить. Місце ваше: приватна для застосунку тека iCloud на Mac або Cloudflare Worker із базою даних, який `setup` піднімає у вашому власному обліковому записі Cloudflare. Записи їдуть в один бік і лише в міру того, як змінюються.

  Маршрутом Cloudflare вони їдуть запечатаними. `qr` пов'язує телефон поза мережею — камера зчитує адресу, токен і ключ. `phones` показує, які телефони можуть читати, а `revoke` відрізає один із них.

  Увімкнений, він несе всі проєкти цієї машини: телефон — це один пристрій, а не один проєкт.
config:
  worker_url:
    label: URL вашого власного Cloudflare Worker (заповнює setup)
  auth_token:
    label: Токен, з яким Worker пропускає запис (заповнює setup)
  encryption_key:
    label: Ключ, яким шифруються записи (заповнює setup)
