desc: Сообщает по почте, что сделал ваш ИИ
about: |
  Получайте по почте то, что ИИ сделал в проекте, пока вас там не было.

  Сообщается только о записях самого ИИ: при вашей собственной правке вы и так были рядом.
  Какие события достойны письма, выбираете вы — из одиннадцати, которые подаёт Amenbo.

  Всплеск событий приходит одним письмом, а не дюжиной, и все письма одного проекта попадают
  в одну переписку. Куда они уходят — настройка самого проекта, так что два проекта могут
  писать в два разных ящика.

  Подойдёт любой SMTP-сервер, который у вас уже есть. Никакой службы посередине нет, и сам
  плагин не хранит ни одного адреса: письмо уходит через вашу учётную запись.

  Пользуетесь Gmail? Понадобится пароль приложения:
  https://github.com/ShiroDoromoto/amenbo-plugin-mail#gmail
config:
  smtp_host:
    label: Сервер SMTP
    help: |-
      Сервер, которому передаётся письмо. Ваш провайдер публикует его, обычно под названием "SMTP" или «сервер исходящей почты».
  smtp_port:
    label: Порт
    help: |-
      587 — порт отправки, который слушает почти любой провайдер. Меняйте его, только если ваш называет другой.
  smtp_user:
    label: Учётная запись
    help: |-
      Учётная запись, под которой выполняется вход, записанная целиком — весь адрес, а не часть до @. Оставьте её пустой вместе с паролем, если ретранслятор не требует ни того, ни другого.
  smtp_password:
    label: Пароль
    help: |-
      Пароль, который эта учётная запись разрешает программе, — не всегда тот, с которым вы входите сами. Gmail свой собственный не принимает: включите двухэтапную аутентификацию, создайте пароль приложения и введите его шестнадцать знаков подряд — пробелы, которые показывает экран, в него не входят.
  from:
    label: Отправитель
    help: |-
      Адрес, с которого уходит письмо. Оставленный пустым, он равен учётной записи, и именно это провайдер примет: большинство отклоняет письмо, выдающее себя за чужое. Без учётной записи отступать некуда — тогда заполните поле.
  to:
    label: Получатель
    help: |-
      Куда уходит письмо. Оставленное пустым, оно идёт на учётную запись, а без неё поле придётся заполнить. Несколько адресов пишутся в одну строку через запятую.
  events:
    label: О чём сообщать
    help: |-
      Всё, что Amenbo порождает и о чём этот плагин может сообщить. Что бы вы ни отметили, сообщается только то, что записал ваш ИИ: при том, что вы сделали сами, вы присутствовали. Не отметить ничего — тоже ответ: плагин остаётся включённым и не сообщает ни о чём.
    options:
      task.created: Задача создана
      task.status_changed: Статус задачи изменён
      task.done: Задача завершена
      task.rejected: Задача отклонена
      task.assigned: У задачи сменился исполнитель
      task.moved: Задача перенесена в другой проект
      task.deleted: Задача удалена
      decision.accepted: Решение принято
      decision.rejected: Решение отклонено
      comment.added: Добавлен комментарий
      comment.removed: Комментарий отозван
