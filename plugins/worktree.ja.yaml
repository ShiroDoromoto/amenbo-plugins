desc: タスクごとに git worktree を切り分ける
about: |
  タスクごとに専用のチェックアウトを持たせる。`start` は `task/<id>` という新しいブランチで worktree を切り、`finish` はマージが済んだらその worktree とブランチを畳む。

  ```
  <repo>/../<repo-name>-worktrees/<id>/    ブランチ task/<id>
  ```

  チェックアウトはリポジトリの**外**に置かれる。amenbo に束縛されない純粋な開発環境なので、プロジェクトの一部と取り違えようがない。実装セッションを何本同時に走らせても衝突しない——1タスクに1チェックアウト、1ブランチ。

  ```sh
  eval "$(amenbo plugin run worktree start 123)"   # PowerShell なら iex (…)
  # …作業・コミット・マージ…
  amenbo plugin run worktree finish 123
  ```

  `start` が返すのは `cd` の行そのもので、worktree に入るのはいま立っているシェル自身。`finish` はメインリポジトリで打つ。チェックアウトが汚れているうちや、基準ブランチに無いコミットをブランチが抱えているうちは拒む（`--force` で押し切れる）。`--base` を渡さなければ、どちらもリポジトリがいま立っているブランチを基準にするので、先に設定しておくことは何もない。

  タスクを予約すると、プラグインは stderr に提案を1行書く。それだけ。このタスクに専用のチェックアウトが要るかどうかは判断であって、その判断は提案を読んだ側に残る。バックログも amenbo が持ったままで、このプラグインが触るのは git だけ。

  git 2.31 以降が要る。
