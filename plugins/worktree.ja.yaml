desc: タスクごとに git worktree を切り分ける
about: |
  タスクごとに専用のチェックアウトができます。`start` は `task/<id>` という新しいブランチで worktree を切ります。`finish` はマージが済んだら、その worktree とブランチを削除します。

  ```
  <repo>/../<repo-name>-worktrees/<id>/    ブランチ task/<id>
  ```

  チェックアウトはリポジトリの**外**に作られます。中に Amenbo のものが何も入らない開発環境なので、プロジェクトの一部と取り違えません。実装セッションを何本同時に走らせても衝突しません——1タスクに1チェックアウト、1ブランチ。

  ```sh
  eval "$(amenbo plugin run worktree start 123)"   # PowerShell なら iex (…)
  # …作業・コミット・マージ…
  amenbo plugin run worktree finish 123
  ```

  `start` が返すのは `cd` の行そのものです。いま使っているシェルが、そのまま worktree に入ります。`finish` はメインリポジトリで打ちます。未コミットの変更が残っているあいだは `finish` できません。基準ブランチに無い変更がブランチに残っているときも同じです（`--force` でどちらも押し切れます）。見るのは変更そのものでコミットではないので、squash や rebase で入ったものも普通のマージと同じくマージ済みとして扱います。`--base` を渡さなければ、どちらもいまチェックアウトしているブランチを基準にします。先に設定するものはありません。

  タスクを予約すると、プラグインは stderr に提案を1行書きます。それだけです。このタスクに専用のチェックアウトが要るかどうかは判断であって、決めるのは提案を読んだ人です。タスクは Amenbo が持ったままです。このプラグインがタスクを読むのは、どこで作業しているかを見るためだけです。書くのは git だけです。

  git 2.31 以降が必要です。
