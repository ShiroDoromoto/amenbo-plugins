desc: Meldet per E-Mail, was Ihre KI getan hat
about: |
  Sie bekommen per E-Mail, was Ihre KI in einem Projekt getan hat, während Sie weg waren.

  Gemeldet wird nur, was die KI geschrieben hat: bei einer Änderung von Ihnen waren Sie ja
  dabei. Welche Ereignisse eine E-Mail wert sind, wählen Sie selbst aus den elf, die amenbo
  auslöst.

  Ein Schwall davon kommt als eine Nachricht statt als ein Dutzend, und alle Nachrichten eines
  Projekts landen im selben Thread. Wohin sie gehen, ist eine Einstellung des Projekts selbst –
  zwei Projekte können also an zwei Postfächer melden.

  Jeder SMTP-Server, den Sie schon haben, genügt. Dazwischen liegt kein Dienst, und das Plugin
  hält selbst keine Adresse: Die E-Mail wird über Ihr eigenes Konto verschickt.

  Sie nutzen Gmail? Dann brauchen Sie ein App-Passwort:
  https://github.com/ShiroDoromoto/amenbo-plugin-mail#gmail
config:
  smtp_host:
    label: SMTP-Server
    help: |-
      Der Server, dem die Nachricht übergeben wird. Ihr Anbieter nennt ihn, meist unter "SMTP" oder "Postausgang".
  smtp_port:
    label: Port
    help: |-
      587 ist der Einlieferungsport, auf dem fast jeder Anbieter lauscht. Ändern Sie ihn nur, wenn Ihrer einen anderen nennt.
  smtp_user:
    label: Konto
    help: |-
      Das Konto, mit dem angemeldet wird, vollständig geschrieben — die ganze Adresse, nicht nur der Teil vor dem @. Für ein Relay, das weder Konto noch Passwort verlangt, lassen Sie beides leer.
  smtp_password:
    label: Passwort
    help: |-
      Das Passwort, das dieses Konto einem Programm erlaubt — nicht immer dasselbe, mit dem Sie sich anmelden. Gmail lehnt sein eigenes ab: Schalten Sie die Bestätigung in zwei Schritten ein, erstellen Sie ein App-Passwort und geben Sie dessen sechzehn Zeichen ohne Leerzeichen ein — die Abstände auf dem Bildschirm gehören nicht dazu.
  from:
    label: Absender
    help: |-
      Die Adresse, von der die Nachricht kommt. Leer gelassen ist es das Konto, und genau das akzeptiert ein Anbieter — die meisten lehnen eine Nachricht ab, die sich als jemand anderes ausgibt. Ohne Konto gibt es nichts, worauf zurückgegriffen werden könnte: dann füllen Sie es aus.
  to:
    label: Empfänger
    help: |-
      Wohin die Nachricht geht. Leer gelassen geht sie an das Konto, und ohne Konto muss sie ausgefüllt werden. Mehrere Adressen stehen in derselben Zeile, durch Kommas getrennt.
  events:
    label: Was gemeldet wird
    help: |-
      Alles, was amenbo auslöst und dieses Plugin melden kann. Gemeldet werden nur die Schreibvorgänge Ihrer KI, was Sie hier auch ankreuzen — was Sie selbst getan haben, waren Sie dabei. Nichts anzukreuzen ist auch eine Antwort: Das Plugin bleibt eingeschaltet und meldet nichts.
    options:
      task.created: Eine Aufgabe wurde erstellt
      task.status_changed: Der Status einer Aufgabe hat sich geändert
      task.done: Eine Aufgabe wurde abgeschlossen
      task.rejected: Eine Aufgabe wurde verworfen
      task.assigned: Eine Aufgabe wurde neu zugewiesen
      task.moved: Eine Aufgabe kam in ein anderes Projekt
      task.deleted: Eine Aufgabe wurde gelöscht
      decision.accepted: Eine Entscheidung wurde angenommen
      decision.rejected: Eine Entscheidung wurde abgelehnt
      comment.added: Ein Kommentar wurde hinzugefügt
      comment.removed: Ein Kommentar wurde zurückgenommen
