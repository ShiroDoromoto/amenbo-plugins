desc: แยกแต่ละงานไว้ใน git worktree ของตัวเอง
about: |
  งานแต่ละชิ้นได้ checkout ของตัวเอง: `start` ตัด git worktree ให้บนสาขาใหม่ `task/<id>` และ `finish` เก็บคืนทั้งคู่เมื่อรวมงานแล้ว

  ```
  <repo>/../<repo-name>-worktrees/<id>/    สาขา task/<id>
  ```

  checkout อยู่**นอก**รีโพ ไม่มีอะไรในนั้นผูกกับ amenbo หลายเซสชันเดินพร้อมกันได้โดยไม่ชนกัน — หนึ่งงาน หนึ่ง checkout หนึ่งสาขา

  ```sh
  eval "$(amenbo plugin run worktree start 123)"   # PowerShell ใช้ iex (…)
  amenbo plugin run worktree finish 123
  ```

  `start` คืนบรรทัด `cd` นั้นเอง เชลล์ที่คุณยืนอยู่จึงเป็นตัวที่เข้า worktree `finish` สั่งจากรีโพหลัก และปฏิเสธถ้า checkout ยังสกปรกหรือสาขาถือการแก้ไขที่ฐานไม่มี — `--force` ข้ามได้ทั้งสองอย่าง ถ้าไม่ให้ `--base` ทั้งคู่ยึดสาขาที่รีโพยืนอยู่ จึงไม่ต้องตั้งค่าอะไรก่อน

  การจองงานทำให้ปลั๊กอินเขียนข้อเสนอหนึ่งบรรทัดลง stderr เท่านั้น งาน*นี้*ต้องการ checkout ของตัวเองไหม เป็นดุลพินิจของคนอ่าน แบ็กล็อกยังอยู่กับ amenbo ปลั๊กอินนี้อ่านงานเพื่อดูว่าทำที่ไหน และเขียนแค่ git

  ต้องใช้ git 2.31 ขึ้นไป
