name: worktree
desc: Isolate each task in its own git worktree
author: amenbo
repo: ShiroDoromoto/amenbo-plugin-worktree
os:
  - macos
  - linux
  - windows
category: workflow
assets:
  macos:
    url: https://github.com/ShiroDoromoto/amenbo-plugin-worktree/releases/download/v4/worktree-v4-macos-universal.tar.gz
    checksum: sha256:f66ef1d8f2e58517430f8868b7e72c0214c1ae39247410c9536e3cd1395c1162
  linux-x64:
    url: https://github.com/ShiroDoromoto/amenbo-plugin-worktree/releases/download/v4/worktree-v4-linux-x64.tar.gz
    checksum: sha256:32924dfc1fb65509054a68e328b401389fea3784deaf4b537ee3b9ce39b74988
  linux-arm64:
    url: https://github.com/ShiroDoromoto/amenbo-plugin-worktree/releases/download/v4/worktree-v4-linux-arm64.tar.gz
    checksum: sha256:06902f67df17c4c5de6dd7ce3b6d69f3f9d11cd3fd157431bd5164e62b72db1e
  windows-x64:
    url: https://github.com/ShiroDoromoto/amenbo-plugin-worktree/releases/download/v4/worktree-v4-windows-x64.tar.gz
    checksum: sha256:4420cb5c5b0a95de1f6409d48bf7ec03571510c3b00ae49c6d58f65d8390714b
official: true
payload_v: 1
events:
  - task.status_changed
agent:
  when: Starting work on a task that will produce commits, and wanting it isolated
  commands:
    - cmd: start <task-id>
      does: Cuts a worktree for the task outside the repository, and returns the line to cd into it
      steps: [worktree.cut-per-task, worktree.run-the-line]
    - cmd: finish <task-id>
      does: Removes that worktree and its branch, once the work has been merged
      steps: [worktree.fold-it]
about: |
  Each task gets a checkout of its own: `start` cuts a git worktree for it on a fresh branch `task/<id>`, and `finish` takes both away once the work has been merged.

  ```
  <repo>/../<repo-name>-worktrees/<id>/    on branch task/<id>
  ```

  The checkout lives **outside** the repository, so it is a pure development environment — nothing in it is bound to amenbo, and nothing about it can be mistaken for part of the project. Several implementation sessions can then run at once without colliding: one task, one checkout, one branch.

  ```sh
  eval "$(amenbo plugin run worktree start 123)"   # iex (…) in PowerShell
  # …work, commit, merge…
  amenbo plugin run worktree finish 123
  ```

  `start` returns that `cd` line itself, so the shell you are standing in is the one that enters the worktree. `finish` is run from the main repository, and refuses while the checkout is dirty or the branch holds commits the base does not; `--force` overrides both. Without `--base` they answer with the branch the repository is standing on, so there is nothing to fill in first.

  Reserving a task makes the plugin write one suggestion to stderr, and nothing more: whether *this* task wants a checkout of its own is a judgement, and it stays with whoever reads the suggestion. The backlog stays with amenbo as well — this plugin reads a task to see where it is worked, and writes nothing but git.

  Needs git 2.31 or newer.
