name: worktree
desc: Isolate each task in its own git worktree
author: Amenbo
repo: ShiroDoromoto/amenbo-plugin-worktree
os:
  - macos
  - linux
  - windows
category: workflow
assets:
  macos:
    url: https://github.com/ShiroDoromoto/amenbo-plugin-worktree/releases/download/v5/worktree-v5-macos-universal.tar.gz
    checksum: sha256:d284de477cf7161b898b233c4dd4ef34039db1e6af17c030548e9a34713278cf
  linux-x64:
    url: https://github.com/ShiroDoromoto/amenbo-plugin-worktree/releases/download/v5/worktree-v5-linux-x64.tar.gz
    checksum: sha256:92ef7692ff32928c7f88e36ccd708ca803082c68990fd1bc4a42b0dc2b473356
  linux-arm64:
    url: https://github.com/ShiroDoromoto/amenbo-plugin-worktree/releases/download/v5/worktree-v5-linux-arm64.tar.gz
    checksum: sha256:85e5d133f06c097cbaf4f021a6fc89cbac61514e02c7ac05e29c61879a750034
  windows-x64:
    url: https://github.com/ShiroDoromoto/amenbo-plugin-worktree/releases/download/v5/worktree-v5-windows-x64.tar.gz
    checksum: sha256:082e047349fd1730641f4314c638beacb0f378699bf27c30ed259a1daa727a24
official: true
payload_v: 1
events:
  - task.status_changed
agent:
  when: Starting work on a task that will produce commits, and wanting it isolated
  commands:
    - cmd: start <task-id>
      does: Cuts a worktree for the task outside the repository, and returns the line to cd into it
      steps: [worktree.cut-per-task, worktree.run-the-line]
    - cmd: finish <task-id>
      does: Removes that worktree and its branch, once the work has been merged
      steps: [worktree.fold-it]
about: |
  Each task gets a checkout of its own: `start` cuts a git worktree for it on a fresh branch `task/<id>`, and `finish` takes both away once the work has been merged.

  ```
  <repo>/../<repo-name>-worktrees/<id>/    on branch task/<id>
  ```

  The checkout lives **outside** the repository, so it is a pure development environment — nothing in it is bound to Amenbo, and nothing about it can be mistaken for part of the project. Several implementation sessions can then run at once without colliding: one task, one checkout, one branch.

  ```sh
  eval "$(amenbo plugin run worktree start 123)"   # iex (…) in PowerShell
  # …work, commit, merge…
  amenbo plugin run worktree finish 123
  ```

  `start` returns that `cd` line itself, so the shell you are standing in is the one that enters the worktree. `finish` is run from the main repository, and refuses while the checkout is dirty or the branch still carries changes the base does not have; `--force` overrides both. What counts is the change rather than the commit carrying it, so a squash or rebase merge reads as merged just as a plain merge does. Without `--base` they answer with the branch the repository is standing on, so there is nothing to fill in first.

  Reserving a task makes the plugin write one suggestion to stderr, and nothing more: whether *this* task wants a checkout of its own is a judgement, and it stays with whoever reads the suggestion. The backlog stays with Amenbo as well — this plugin reads a task to see where it is worked, and writes nothing but git.

  Needs git 2.31 or newer.
