desc: अपने काम अपने फ़ोन पर पढ़ें, अपने ही सर्वर से
about: |
  PC से दूर रहते हुए भी आपके काम फ़ोन तक पहुँचते हैं और Amenbo Viewer ऐप उन्हें वहीं पढ़ता है — काम, हर एक की मौजूदा स्थिति, और उनके पीछे के फ़ैसले।

  कुछ भी आपके लिए होस्ट नहीं किया जाता। सर्वर आपका अपना है: “3. सर्वर बनाएँ” उसे डेटाबेस समेत आपके अपने Cloudflare खाते में बनाता है। जो बदला है वही एक ही दिशा में जाता है, और उतना ही जितना बदला हो।

  वह सीलबंद जाता है। “4. फ़ोन जोड़ें” बिना नेटवर्क के एक फ़ोन जोड़ता है — कैमरा सर्वर का URL, पढ़ने वाला API टोकन और एन्क्रिप्शन कुंजी पढ़ लेता है। “5. फ़ोन देखें” बताता है कौन-से फ़ोन पढ़ सकते हैं, और “6. फ़ोन हटाएँ” उनमें से एक को काट देता है।

  चालू करने पर यह इस मशीन की सारी परियोजनाएँ ले जाता है: फ़ोन एक उपकरण है, एक परियोजना नहीं।
config:
  routes:
    label: कहाँ तक ले जाना है
    help: |-
      यह आपके Cloudflare सर्वर तक ले जा सकता है या नहीं। यहाँ से जगह सिर्फ़ हटाई जा सकती है: निशान लगाने के बाद भी सर्वर का पहले से होना ज़रूरी है, और उसे “3. सर्वर बनाएँ” बनाता है। कुछ भी न चुनना भी एक जवाब है और वैसा ही माना जाता है: प्लगइन चालू रहता है और कहीं नहीं ले जाता।
    options:
      cloudflare: Cloudflare पर आपका अपना सर्वर
  worker_url:
    label: Cloudflare पर आपके सर्वर का URL
    help: |-
      सर्वर बनाते समय “3. सर्वर बनाएँ” इसे भर देता है। आपको कुछ लिखना नहीं है।
  auth_token:
    label: जिस API टोकन से सर्वर लिखने देता है
    help: |-
      “3. सर्वर बनाएँ” इसे बनाता है। आपको कुछ लिखना नहीं है।
  encryption_key:
    label: जिस कुंजी से आपके काम एन्क्रिप्ट होते हैं
    help: |-
      “3. सर्वर बनाएँ” इसे बनाता है। आपको कुछ लिखना नहीं है — फ़ोन को यह QR से मिलती है, नेटवर्क से कभी नहीं।
settings:
  actions:
    app:
      label: 1. ऐप लें
    token:
      label: 2. API टोकन लें
    setup:
      label: 3. सर्वर बनाएँ
      ask:
        api_token: Cloudflare का API टोकन
    qr:
      label: 4. फ़ोन जोड़ें
      ask:
        label: इस फ़ोन का नाम
    phones:
      label: 5. फ़ोन देखें
    revoke:
      label: 6. फ़ोन हटाएँ
      ask:
        phone: जिस फ़ोन को हटाना है उसका नाम
