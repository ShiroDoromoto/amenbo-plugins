desc: अपने काम की सूची अपने फ़ोन पर पढ़ें, अपनी ही जगह से
about: |
  PC से दूर रहते हुए भी आपकी सूची फ़ोन तक पहुँचती है और Amenbo Viewer ऐप उसे वहीं पढ़ता है — काम, हर एक की मौजूदा स्थिति, और उनके पीछे के फ़ैसले।

  कुछ भी आपके लिए होस्ट नहीं किया जाता। जगह आपकी अपनी है: Mac पर ऐप की निजी iCloud फ़ोल्डर, वरना `setup` आपके अपने Cloudflare खाते में जो Worker और डेटाबेस खड़ा करता है वह। रिकॉर्ड एक ही दिशा में जाते हैं, और उतने ही जितने बदले हों।

  Cloudflare वाले रास्ते पर वे सीलबंद जाते हैं। `qr` बिना नेटवर्क के फ़ोन जोड़ता है — कैमरा पता, टोकन और कुंजी पढ़ लेता है। `phones` बताता है कौन-से फ़ोन पढ़ सकते हैं, और `revoke` उनमें से एक को काट देता है।

  चालू करने पर यह इस मशीन की सारी परियोजनाएँ ले जाता है: फ़ोन एक उपकरण है, एक परियोजना नहीं।
config:
  worker_url:
    label: आपके अपने Cloudflare Worker का URL (setup भर देता है)
  auth_token:
    label: जिस टोकन से Worker लिखने देता है (setup भर देता है)
  encryption_key:
    label: जिस कुंजी से रिकॉर्ड एन्क्रिप्ट होते हैं (setup भर देता है)
