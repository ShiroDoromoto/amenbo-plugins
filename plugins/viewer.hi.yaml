desc: अपने काम की सूची अपने फ़ोन पर पढ़ें, अपनी ही जगह से
about: |
  PC से दूर रहते हुए भी आपकी सूची फ़ोन तक पहुँचती है और Amenbo Viewer ऐप उसे वहीं पढ़ता है — काम, हर एक की मौजूदा स्थिति, और उनके पीछे के फ़ैसले।

  कुछ भी आपके लिए होस्ट नहीं किया जाता। जगह आपकी अपनी है: `setup` आपके अपने Cloudflare खाते में जो Worker और डेटाबेस खड़ा करता है, वही। रिकॉर्ड एक ही दिशा में जाते हैं, और उतने ही जितने बदले हों।

  वे सीलबंद जाते हैं। `qr` बिना नेटवर्क के फ़ोन जोड़ता है — कैमरा पता, टोकन और कुंजी पढ़ लेता है। `phones` बताता है कौन-से फ़ोन पढ़ सकते हैं, और `revoke` उनमें से एक को काट देता है।

  चालू करने पर यह इस मशीन की सारी परियोजनाएँ ले जाता है: फ़ोन एक उपकरण है, एक परियोजना नहीं।
config:
  routes:
    label: कहाँ तक ले जाना है
    help: |-
      यह आपके Cloudflare Worker तक ले जा सकता है या नहीं। यहाँ से जगह सिर्फ़ हटाई जा सकती है: निशान लगाने के बाद भी Worker का पहले से होना ज़रूरी है, और उसे setup खड़ा करता है। कुछ भी न चुनना भी एक जवाब है और वैसा ही माना जाता है: प्लगइन चालू रहता है और कहीं नहीं ले जाता।
    options:
      cloudflare: आपका अपना Cloudflare Worker
  worker_url:
    label: आपके अपने Cloudflare Worker का URL
    help: "Worker खड़ा करते समय setup इसे भर देता है। आपको कुछ लिखना नहीं है।"
  auth_token:
    label: जिस टोकन से Worker लिखने देता है
    help: "setup इसे बनाता है। आपको कुछ लिखना नहीं है।"
  encryption_key:
    label: जिस कुंजी से रिकॉर्ड एन्क्रिप्ट होते हैं
    help: "setup इसे बनाता है। आपको कुछ लिखना नहीं है — फ़ोन को यह QR से मिलती है, नेटवर्क से कभी नहीं।"
settings:
  actions:
    app:
      label: 1. ऐप लें
    token:
      label: 2. API टोकन लें
    setup:
      label: 3. Cloudflare सेटअप
      ask:
        api_token: Cloudflare का API टोकन
    qr:
      label: 4. फ़ोन जोड़ें
      ask:
        label: इस फ़ोन का नाम
