desc: Leia suas tarefas no celular, de um servidor que é seu
about: |
  Suas tarefas chegam ao celular e o app Amenbo Viewer as lê por lá — as tarefas, o estado em que cada uma está e as decisões por trás delas — enquanto você está longe do computador.

  Ninguém hospeda nada para você. O servidor é seu: um servidor com seu banco de dados que «3. Criar o servidor no Cloudflare» cria na sua própria conta Cloudflare. As tarefas viajam em uma só direção, e só conforme se movem.

  Elas viajam lacradas. «4. Parear um telefone» pareia um celular fora da rede — a câmera lê a URL do servidor, o token de API de leitura e a chave de criptografia. O pareamento é um só: «5. Ver se há um celular pareado» diz se existe, «6. Desfazer o pareamento» o remove, e parear de novo substitui o anterior.

  Ao ativar, ele leva todo projeto desta máquina: um celular é um aparelho, não um projeto.
config:
  routes:
    label: Para onde levar
    help: |-
      Se isto pode levar ao seu servidor no Cloudflare. Aqui só dá para tirar o lugar: marcá-lo não basta, o servidor precisa existir antes que algo chegue nele, e é «3. Criar o servidor no Cloudflare» que o cria. Não marcar nada também é uma resposta e é respeitada: o plugin continua ativo e não leva a lugar nenhum.
    options:
      cloudflare: Seu próprio servidor no Cloudflare
  worker_url:
    label: URL do seu servidor no Cloudflare
    help: "«3. Criar o servidor no Cloudflare» preenche isto ao criar o servidor. Não há nada para digitar."
  auth_token:
    label: Token de API com que o servidor aceita gravações
    help: "«3. Criar o servidor no Cloudflare» gera isto. Não há nada para digitar."
  encryption_key:
    label: Chave com que suas tarefas são criptografadas
    help: "«3. Criar o servidor no Cloudflare» gera isto. Não há nada para digitar — o telefone a recebe pelo QR, nunca pela rede."
settings:
  actions:
    app:
      label: 1. Instalar o app no telefone
    token:
      label: 2. Obter um token de API do Cloudflare
    setup:
      label: 3. Criar o servidor no Cloudflare
      ask:
        api_token: Token de API do Cloudflare
    qr:
      label: 4. Parear um telefone
    phones:
      label: 5. Ver se há um celular pareado
    revoke:
      label: 6. Desfazer o pareamento
    repair:
      label: "7. Reparar a cópia do telefone"
