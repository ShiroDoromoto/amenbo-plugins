desc: Читайте свой список задач на телефоне — из места, которое принадлежит вам
about: |
  Список задач приходит на телефон, и приложение Amenbo Viewer читает его там — задачи, состояние каждой из них и решения, которые за ними стоят, — пока вы вдали от компьютера.

  Никто ничего для вас не хостит. Место ваше: приватная для приложения папка iCloud на Mac либо Cloudflare Worker с базой данных, который `setup` поднимает в вашей собственной учётной записи Cloudflare. Записи едут в одну сторону и только по мере того, как меняются.

  По маршруту Cloudflare они едут запечатанными. `qr` связывает телефон вне сети — камера считывает адрес, токен и ключ. `phones` показывает, какие телефоны могут читать, а `revoke` отключает один из них.

  Включённый, он несёт все проекты этой машины: телефон — это одно устройство, а не один проект.
config:
  worker_url:
    label: URL вашего собственного Cloudflare Worker
    help: "setup заполняет это, когда поднимает Worker. Вводить ничего не нужно."
  auth_token:
    label: Токен, с которым Worker пропускает запись
    help: "setup создаёт это. Вводить ничего не нужно."
  encryption_key:
    label: Ключ, которым шифруются записи
    help: "setup создаёт это. Вводить ничего не нужно — на телефон он попадает через QR, а не по сети."
settings:
  actions:
    token:
      label: 1. Получить токен API
    setup:
      label: 2. Настроить Cloudflare
      ask:
        api_token: Токен API Cloudflare
    qr:
      label: 3. Подключить телефон
      ask:
        label: Имя этого телефона
