desc: Читайте свои задачи на телефоне — с сервера, который принадлежит вам
about: |
  Задачи приходят на телефон, и приложение Amenbo Viewer читает их там — задачи, состояние каждой из них и решения, которые за ними стоят, — пока вы вдали от компьютера.

  Никто ничего для вас не хостит. Сервер ваш: сервер с базой данных, который «3. Создать сервер» создаёт в вашей собственной учётной записи Cloudflare. Задачи едут в одну сторону и только по мере того, как меняются.

  Они едут запечатанными. «4. Подключить телефон» связывает телефон вне сети — камера считывает URL сервера, API-токен для чтения и ключ шифрования. «5. Показать телефоны» показывает, какие телефоны могут читать, а «6. Отключить телефон» отключает один из них.

  Включённый, он несёт все проекты этой машины: телефон — это одно устройство, а не один проект.
config:
  routes:
    label: Куда доставлять
    help: |-
      Можно ли доставлять на ваш собственный сервер в Cloudflare. Отсюда место можно только убрать: отметки мало — сервер всё равно должен существовать, прежде чем туда что-то дойдёт, а создаёт его «3. Создать сервер». Не отметить ничего — тоже ответ, и он соблюдается: плагин остаётся включённым и никуда не доставляет.
    options:
      cloudflare: Ваш собственный сервер в Cloudflare
  worker_url:
    label: URL вашего сервера в Cloudflare
    help: "«3. Создать сервер» заполняет это, когда создаёт сервер. Вводить ничего не нужно."
  auth_token:
    label: API-токен, с которым сервер принимает запись
    help: "«3. Создать сервер» создаёт это. Вводить ничего не нужно."
  encryption_key:
    label: Ключ, которым шифруются ваши задачи
    help: "«3. Создать сервер» создаёт это. Вводить ничего не нужно — на телефон он попадает через QR, а не по сети."
settings:
  actions:
    app:
      label: 1. Скачать приложение
    token:
      label: 2. Получить токен API
    setup:
      label: 3. Создать сервер
      ask:
        api_token: Токен API Cloudflare
    qr:
      label: 4. Подключить телефон
      ask:
        label: Имя этого телефона
    phones:
      label: 5. Показать телефоны
    revoke:
      label: 6. Отключить телефон
      ask:
        phone: Имя телефона для отключения
