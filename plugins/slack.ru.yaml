desc: Сообщать в канал Slack о том, что сделал ваш ИИ
about: |
  Каждая задача, которую завершил ваш ИИ, каждая, которую он решил не делать, каждое принятое решение — строка приходит в канал Slack. То, что происходило, пока вас не было в проекте, читается там, куда вы и так смотрите.

  - **Публикуется только то, что пишет ИИ.** При том, что написали вы сами, вы присутствовали; в канале остаётся работа, сделанная без вас.
  - **Канал — это и есть настройка.** `webhook_url` принадлежит проекту, в котором записан, поэтому это значение и *есть* канал, куда проект отчитывается. Два проекта с двумя вебхуками отчитываются в два канала; каждое сообщение называет свой проект, так что и общий канал читается.
  - **Какие события — выбираете вы.** Одиннадцать на выбор: от создания задачи до отзыва комментария. По умолчанию четыре: задача создана, сменила статус, завершена или отклонена.

  От Slack нужен всего один URL Incoming Webhook, и он хранится как секретная настройка — он не покидает amenbo ни в экспорте, ни в журнале, ни при обратном чтении. Сообщения пишутся на языке, на котором вы читаете amenbo, и называют ИИ тем именем, которое вы ему дали.
config:
  webhook_url:
    label: URL вебхука Slack
    help: |-
      Этот адрес создаёт Slack, а не amenbo, и он же и есть канал: вебхук для не того канала отчитывается не в ту комнату, хотя всё остальное настроено верно.
      На api.slack.com/apps создайте приложение в рабочем пространстве, которое должно знать об этом проекте, включите Incoming Webhooks, добавьте один для нужного канала и скопируйте выданный URL.
      Он хранится как секретная настройка — не покидает amenbo ни в экспорте, ни в журнале, ни при обратном чтении.
  events:
    label: О чём сообщать
    help: |-
      Не отметить ничего — тоже ответ, и он соблюдается: плагин остаётся включённым и ничего не сообщает. Очистка возвращает четыре значения по умолчанию.
    options:
      task.created: Задача создана
      task.status_changed: Статус задачи изменился
      task.done: Задача завершена
      task.rejected: Задачу решили не делать
      task.assigned: У задачи назначен ответственный
      task.moved: Задача перемещена в другой проект
      task.deleted: Задача удалена
      decision.accepted: Решение принято
      decision.rejected: Решение отклонено
      comment.added: Добавлен комментарий
      comment.removed: Комментарий отозван
settings:
  actions:
    config test:
      label: Отправить тест
