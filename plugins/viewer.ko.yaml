desc: 할 일 목록을 내 저장소에서 휴대폰으로 읽는다
about: |
  PC를 떠나 있는 동안에도 할 일 목록이 휴대폰으로 도착하고, Amenbo Viewer로 읽는다——어떤 작업이 있고, 하나하나가 지금 어떤 상태이며, 무엇을 왜 그렇게 정했는지까지.

  대신 호스팅해 주는 곳은 없다. 저장소는 사용자의 것으로, mac이라면 앱 전용 iCloud 폴더, 그렇지 않으면 `setup`이 사용자 본인의 Cloudflare 계정에 세우는 Worker와 데이터베이스가 된다. 기록은 한 방향으로, 움직인 것만 실려 간다.

  Cloudflare 경로에서는 봉해서 나른다. `qr`은 네트워크를 거치지 않고 휴대폰을 짝지어, 주소와 토큰과 키를 카메라로 건넨다. 읽을 수 있는 기기는 `phones`로 알 수 있고, `revoke`로 한 대만 끊는다.

  켜면 이 PC의 모든 프로젝트가 실려 간다——휴대폰은 기기 한 대이지, 프로젝트 하나가 아니다.
config:
  worker_url:
    label: 내 Cloudflare Worker의 URL
    help: "Worker를 세울 때 setup이 써 넣습니다. 입력할 것은 없습니다."
  auth_token:
    label: Worker가 쓰기를 받아들이는 토큰
    help: "setup이 만들어 냅니다. 입력할 것은 없습니다."
  encryption_key:
    label: 기록을 암호화하는 키
    help: "setup이 만들어 냅니다. 입력할 것은 없습니다 — 휴대폰에는 QR로 건네지며, 네트워크로는 나가지 않습니다."
settings:
  actions:
    setup:
      label: Cloudflare 경로 세우기
      ask:
        api_token: Cloudflare API 토큰
