desc: 把 AI 做過的事報告到 Slack 頻道
about: |
  你的 AI 每完成一個任務、每決定不做一個任務、每採納一項決策，都會有一行訊息送到 Slack 頻道。你離開專案的這段時間裡發生了什麼，就在你本來就看著的地方讀到。

  - **只發 AI 寫下的東西。** 你自己動手的那些，你當時就在場；頻道裡留下的是沒人盯著時推進的工作。
  - **頻道就是那項設定。** `webhook_url` 屬於寫下它的專案，所以這個值*就是*該專案回報的頻道。兩個專案填兩個 webhook，就回報到兩個頻道；每則訊息都會說明來自哪個專案，因此兩個專案共用一個頻道也讀得清。
  - **報哪些事，由你選。** 從任務被建立到留言被收回，共十一項可勾選。預設是任務被建立、狀態變更、完成、放棄這四項。

  Slack 那邊只需要給出一條 Incoming Webhook URL，它以機密設定的形式保存——不會隨匯出、記錄或回讀離開 amenbo。訊息會用你閱讀 amenbo 的語言寫成，並以你為 AI 取的名字稱呼它。
config:
  webhook_url:
    label: Slack Webhook 位址
  events:
    label: 報告哪些事
    options:
      task.created: 建立了任務
      task.status_changed: 任務的狀態變了
      task.done: 完成了任務
      task.rejected: 決定不做某個任務
      task.assigned: 指派了任務
      task.moved: 任務移到了另一個專案
      task.deleted: 刪除了任務
      decision.accepted: 採納了決策
      decision.rejected: 否決了決策
      comment.added: 新增了留言
      comment.removed: 撤回了留言
