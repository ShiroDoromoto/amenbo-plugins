desc: รายงานสิ่งที่ AI ของคุณทำผ่านอีเมล
about: |
  รับทางอีเมลว่า AI ทำอะไรในโปรเจกต์บ้าง ในช่วงที่คุณไม่ได้อยู่ตรงนั้น

  รายงานเฉพาะสิ่งที่ AI เขียนเท่านั้น เพราะการเปลี่ยนแปลงที่คุณลงมือเองนั้นคุณอยู่ด้วยแล้ว
  การถึงกำหนดไม่ใช่การเขียนของใคร และมาถึงตอนที่ไม่มีใครดูอยู่ จึงรายงานด้วยเช่นกัน
  ส่วนเหตุการณ์ไหนควรส่งอีเมล คุณเลือกเองได้จาก 13 อย่างที่ Amenbo ส่งออกมา

  เหตุการณ์ที่เกิดติด ๆ กันจะมาถึงเป็นอีเมลฉบับเดียว ไม่ใช่สิบกว่าฉบับ และอีเมลของโปรเจกต์เดียวกัน
  จะรวมอยู่ในเธรดเดียว ปลายทางเป็นการตั้งค่าของโปรเจกต์นั้นเอง สองโปรเจกต์จึงรายงานไปยัง
  สองกล่องจดหมายได้

  เซิร์ฟเวอร์ SMTP ที่คุณมีอยู่แล้วก็ใช้ได้ ไม่มีบริการใดมาคั่นกลาง และตัวปลั๊กอินเองไม่ได้เก็บที่อยู่ใดไว้
  อีเมลออกไปจากบัญชีของคุณเอง

  ถ้าใช้ Gmail จะต้องสร้างรหัสผ่านแอปก่อน
  https://github.com/ShiroDoromoto/amenbo-plugin-mail#gmail
config:
  smtp_host:
    label: เซิร์ฟเวอร์ SMTP
    help: |-
      เซิร์ฟเวอร์ที่จะส่งข้อความให้ ผู้ให้บริการของคุณจะประกาศไว้ มักอยู่ใต้หัวข้อ "SMTP" หรือ "เมลขาออก"
  smtp_port:
    label: พอร์ต
    help: |-
      587 คือพอร์ตสำหรับส่งที่ผู้ให้บริการเกือบทุกรายเปิดรออยู่ เปลี่ยนก็ต่อเมื่อผู้ให้บริการของคุณระบุเป็นอย่างอื่น
  smtp_user:
    label: บัญชี
    help: |-
      บัญชีที่ใช้ยืนยันตัวตน เขียนให้เต็ม คืออีเมลทั้งอีเมล ไม่ใช่เฉพาะส่วนหน้า @ ถ้าเป็นรีเลย์ที่ไม่ขอทั้งบัญชีและรหัสผ่าน ให้เว้นว่างทั้งคู่
  smtp_password:
    label: รหัสผ่าน
    help: |-
      รหัสผ่านที่บัญชีนั้นอนุญาตให้โปรแกรมใช้ ซึ่งไม่จำเป็นต้องเป็นรหัสที่คุณใช้ลงชื่อเข้าใช้ Gmail ไม่รับรหัสของตัวเอง ให้เปิดการยืนยันแบบ 2 ขั้นตอน สร้างรหัสผ่านแอป แล้วพิมพ์อักษรสิบหกตัวติดกัน ช่องว่างที่เห็นบนหน้าจอไม่นับรวม
  from:
    label: ผู้ส่ง
    help: |-
      ที่อยู่ที่ใช้เป็นผู้ส่ง เว้นว่างไว้จะใช้อีเมลของบัญชี ซึ่งเป็นสิ่งที่ผู้ให้บริการยอมรับ เพราะส่วนใหญ่ปฏิเสธข้อความที่อ้างว่ามาจากคนอื่น ถ้าไม่มีบัญชีก็ไม่มีอะไรให้ย้อนกลับไปใช้ จึงต้องกรอกเอง
  to:
    label: ผู้รับ
    help: |-
      ปลายทางที่ข้อความจะไปถึง เว้นว่างไว้จะไปที่อีเมลของบัญชี และถ้าไม่มีบัญชีก็ต้องกรอก หลายที่อยู่ให้เขียนในบรรทัดเดียวกัน คั่นด้วยจุลภาค
  events:
    label: จะรายงานอะไรบ้าง
    help: |-
      ทุกเหตุการณ์ที่ Amenbo ส่งออกมาและปลั๊กอินนี้รายงานได้ ไม่ว่าจะเลือกอะไร การเขียนที่รายงานคือของ AI เท่านั้น ส่วนที่คุณลงมือเองนั้นคุณอยู่ตรงนั้นแล้ว สองรายการสุดท้ายไม่ใช่การเขียน Amenbo เตือนวันละครั้งถึงงานที่ถึงกำหนดแล้ว และงานที่ถึงกำหนดพรุ่งนี้ ไม่มีใครเขียนขึ้นมา จึงไม่ถูกกรองออก การไม่เลือกเลยก็เป็นคำตอบ ปลั๊กอินยังเปิดอยู่และไม่รายงานอะไรเลย
    options:
      task.created: งานถูกสร้าง
      task.status_changed: สถานะของงานเปลี่ยน
      task.done: งานเสร็จแล้ว
      task.rejected: งานถูกตีตก
      task.assigned: ผู้รับผิดชอบงานเปลี่ยน
      task.moved: งานย้ายไปโปรเจกต์อื่น
      task.deleted: งานถูกลบ
      decision.accepted: การตัดสินใจถูกยอมรับ
      decision.rejected: การตัดสินใจถูกปฏิเสธ
      comment.added: ความเห็นถูกเพิ่ม
      comment.removed: ความเห็นถูกถอน
      task.due: งานถึงกำหนดวันนี้หรือเลยกำหนดแล้ว
      task.due_tomorrow: งานถึงกำหนดพรุ่งนี้
