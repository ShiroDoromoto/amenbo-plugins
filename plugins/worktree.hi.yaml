desc: हर काम को उसके अपने git worktree में अलग रखता है
about: |
  हर काम को अपना checkout मिलता है: `start` नई शाखा `task/<id>` पर उसके लिए git worktree काटता है, और मर्ज हो जाने पर `finish` दोनों हटा देता है।

  ```
  <repo>/../<repo-name>-worktrees/<id>/    शाखा task/<id>
  ```

  checkout रिपॉज़िटरी के **बाहर** रहता है — शुद्ध विकास वातावरण, जिसमें कुछ भी Amenbo से बँधा नहीं। कई सत्र एक साथ बिना टकराए चलते हैं: एक काम, एक checkout, एक शाखा।

  ```sh
  eval "$(amenbo plugin run worktree start 123)"   # PowerShell में iex (…)
  amenbo plugin run worktree finish 123
  ```

  `start` वही `cd` पंक्ति लौटाता है, तो जिस shell में आप खड़े हैं वही worktree में जाती है। `finish` मुख्य रिपॉज़िटरी से चलता है, और checkout गंदा हो या शाखा में आधार से बाहर के बदलाव हों तो मना करता है; `--force` दोनों को लाँघ जाता है। `--base` न दें तो दोनों उसी शाखा से चलते हैं जिस पर रिपॉज़िटरी खड़ी है।

  काम आरक्षित करने पर plugin stderr पर एक सुझाव लिखता है, बस इतना: इस काम को अपना checkout चाहिए या नहीं, यह पढ़ने वाले का निर्णय है। बैकलॉग Amenbo के पास रहता है; यह plugin काम पढ़ता है और लिखता सिर्फ़ git है।

  git 2.31 या नया चाहिए।
