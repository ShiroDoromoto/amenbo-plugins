name: PR

# The gate on a listing pull request: is every manifest well-formed, and does the one being submitted
# describe the bytes it points at?
#
# Whether a manifest is well-formed is Amenbo's judgment, not this repository's. The rules are the ones
# its install door enforces, so this runs Amenbo's real validator rather than a second implementation of
# them — restate them here and the two drift, and the drift shows up as a manifest this repo accepted and
# every client then refuses.
#
# The shape is checked over every listed manifest; the assets behind it only for the manifests this pull
# request touches. Those two scopes differ on purpose. A rule tightened in Amenbo should surface against
# the entries already listed, and costs nothing to check. An asset is a third party's to keep alive, and
# fetching all of them on every pull request would both grow without bound and let one rotted URL block
# submitters who never touched it — that rot is the catalog build's to handle, by dropping the entry.
#
# The validator is Amenbo's published release, installed the way a person installs it, rather than a
# build of its `main`: the rules this door holds submitters to are the ones every client already
# enforces, and a rule that has not been released yet is one no client enforces. A rule tightened in
# Amenbo reaches this door on its release, with nothing to update here.
#
# Nothing here needs a secret, which is what lets the asset check run on a pull request from a fork at
# all: downloading bytes and hashing them is unprivileged. Signing those bytes is not, and stays on
# `main`, one workflow over.

# Every pull request, with no path filter. The one check `main` requires is this workflow's aggregate job,
# and a check that is never reported is not one that passes — it is a pull request left waiting for a
# verdict nobody will give. A path filter here would be exactly that for anything touching only the
# documentation, so what this workflow costs such a pull request is the price of the branch having a gate at
# all. Little of it is wasted: the listed manifests are worth checking against the current Amenbo whatever
# the pull request touched, and the asset check below scopes itself to the manifests actually submitted, so
# it fetches nothing when none were.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request that is pushed to twice does not need the first check finished.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # The CLI below asks whether a newer release is out, and the file that answers is an asset of that
    # release. A runner carries no answer over from a previous run, so every job that runs the binary
    # would ask again, and each ask reads as one more person taking Amenbo. Nobody here wants the answer
    # either: this door deliberately holds submitters to whatever the published release is. Set on the
    # job, so every step that reaches for the binary is covered — the aggregation below, which calls it
    # once per manifest, included.
    env:
      AMENBO_UPDATE_CHECK: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history: naming the manifests this pull request touched is a diff against its base,
          # and the shallow checkout a pull request gets by default cannot reach that far back.
          fetch-depth: 0

      # The manifest rules live in exactly one place — Amenbo's validator — so this runs the real binary
      # rather than a second implementation of the rules, which would drift from the client's install
      # door. The binary is the published release, installed the way a person installs it: the door this
      # catalog guards is the one clients actually hold, and a rule that has not been released yet is a
      # rule no client enforces. It follows that a rule tightened in Amenbo reaches this door when it
      # reaches everyone else's — on the release, not on the commit.
      - id: release
        name: Resolve the release that would be installed
        run: |
          set -euo pipefail
          # `latest` answers with a redirect naming the tag, and reading that redirect is a page request
          # rather than a download of a release asset — which is the whole point: the two assets the
          # install below fetches are each counted as somebody taking Amenbo, and knowing the tag is what
          # lets a run skip fetching them. It resolves the same `latest` the installer is fetched from, so
          # the key below can never name a release other than the one that would be installed.
          location=$(curl -fsSI https://github.com/ShiroDoromoto/amenbo/releases/latest \
            | awk 'tolower($1) == "location:" { sub(/\r$/, "", $2); print $2 }')
          tag="${location##*/}"
          case "$tag" in
            v*) ;;
            *) echo "::error::could not resolve Amenbo's latest release (redirected to '${location:-nothing}')"; exit 1 ;;
          esac
          echo "resolved Amenbo $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "AMENBO_BIN=$HOME/.local/bin/amenbo" >> "$GITHUB_ENV"

      # Installing the CLI fetches two release assets — the installer, and the archive it unpacks — and
      # GitHub counts each as somebody taking Amenbo, with no way to tell this repository's own CI back
      # out of the numbers afterwards. Keyed by the tag resolved above, that fetch happens once per
      # release rather than once per run. It cannot serve a build older than the one `latest` names: a
      # new release is a new key, which is a miss. And it needs no secret, so a pull request from a fork
      # reads this cache like any other run — writing one is all a fork may not do.
      - uses: actions/cache@v6
        with:
          path: ~/.local/bin/amenbo
          key: amenbo-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.release.outputs.tag }}

      # Gated on the binary actually running rather than on the cache reporting a hit: an entry that is
      # truncated or otherwise unusable heals itself here, instead of failing every job that restores it
      # until it ages out.
      - name: Install the Amenbo CLI (its manifest validator), unless the cache had it
        run: |
          set -euo pipefail
          if [ -x "$AMENBO_BIN" ] && "$AMENBO_BIN" --version; then
            exit 0
          fi
          curl -fsSL https://github.com/ShiroDoromoto/amenbo/releases/latest/download/install.sh | sh
          "$AMENBO_BIN" --version

      # Every manifest, not only the ones this pull request touched: a rule tightened in Amenbo should
      # surface against the entries already listed too, and validating the whole catalog is cheap.
      #
      # `plugin validate` reports every problem in a manifest rather than the first, and the loop keeps
      # going after a failing one, so a single run tells a submitter everything they have to fix. The
      # translations beside a manifest (`plugins/<name>.<lang>.yaml`) are read as part of validating it, so
      # they are not looped over themselves — an overlay handed to the validator as a manifest would be
      # refused for missing every field a manifest requires.
      - name: Validate every manifest
        run: |
          shopt -s nullglob
          manifests=()
          for path in plugins/*.yaml; do
            # A second dot is the language token of a translation, a plugin's name being lower-case
            # letters, digits and hyphens.
            case "${path#plugins/}" in *.*.yaml) continue ;; esac
            manifests+=("$path")
          done
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "No manifests to validate."
            exit 0
          fi
          failed=0
          for manifest in "${manifests[@]}"; do
            echo "── $manifest"
            "$AMENBO_BIN" plugin validate "$manifest" || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more manifests are invalid — see the problems reported above."
            exit 1
          fi
          echo "All ${#manifests[@]} manifest(s) are valid."

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # The catalog build's own aggregator, run over the submitted manifests only and made fatal with
      # `--strict`: whatever it would reject after the merge is rejected here instead. Reusing it rather
      # than curling and hashing in-line is the same argument as the validator above — a second
      # implementation of "does this asset match its digest" is a second thing to keep in step.
      #
      # No signing key is passed, so the documents it builds are unsigned and everything it writes is
      # thrown away with the runner. What survives the step is its verdict.
      - name: Fetch the submitted assets and check them against their digests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ -n "${BASE_SHA:-}" ]; then
            # Excluding deletions: a manifest on its way out of the catalog has no asset left to fetch.
            mapfile -t submitted < <(git diff --name-only --diff-filter=d "${BASE_SHA:-}" HEAD -- 'plugins/*.yaml')
          else
            # A manual run has no pull request to diff against, so it sweeps the whole catalog — which is
            # exactly what someone reaching for the button wants to know.
            submitted=(plugins/*.yaml)
          fi
          if [ ${#submitted[@]} -eq 0 ]; then
            echo "This pull request touches no manifest — no asset to fetch."
            exit 0
          fi
          python3 scripts/aggregate.py --strict \
            --out "${RUNNER_TEMP}/catalog-dry-run.json" \
            "${submitted[@]}"

  # The gate's own shape, which nothing else is in a position to report on. `main` requires one check — the
  # aggregate below — and that job waits for exactly what its `needs:` names, so a job added without a line
  # there is a job the required check never waits for. That failure is silent by construction: the run is
  # green and the merge goes through.
  gate-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that the merge gate waits for every job
        run: python3 scripts/check-pr-aggregate.py

  # The one check `main` requires, standing in for every job above it. Naming one fixed check keeps jobs a
  # matter of this file: they can be added, renamed or dropped without a visit to the repository's settings,
  # where a change leaves no trace in the tree for anyone to review. `always()` is what makes this a gate
  # rather than a formality — without it a failed dependency *skips* this job, and a skipped check is not a
  # red one.
  all-green:
    name: all green
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - validate
      - gate-shape
    steps:
      - name: Fold every job's result
        env:
          # Read as data rather than one interpolation per job: this expression carries whatever `needs:`
          # names, so the fold cannot fall behind that list the way a hand-written set of
          # `needs.<id>.result` reads would.
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "  \(.value.result)\t\(.key)"'
          failed=$(echo "$RESULTS" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key')
          if [ -n "$failed" ]; then
            echo "::error::did not pass: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "every job in this workflow passed or was skipped"
